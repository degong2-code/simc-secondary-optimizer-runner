name: Secondary Optimizer — Reusable Offline Focused Checks

on:
  push:
    branches:
      - probe/chat-cache-v035-20261024
    paths:
      - 'runner/**'
      - 'integration_probes/**'
      - 'tests/**'
      - 'tools/check_development_ledger.py'
      - 'docs/development/**'
      - '.github/workflows/offline_focused_continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondary-offline-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-existing-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check compact developer ledger (offline, zero Native)
        run: python tools/check_development_ledger.py
      - name: Focused shared source/budget/SimC snapshot regression (offline)
        env:
          PYTHONPATH: runner:integration_probes:.
        run: |
          python -m unittest -v \
            tests.test_v094_durable_inclusive_adaptive_runner \
