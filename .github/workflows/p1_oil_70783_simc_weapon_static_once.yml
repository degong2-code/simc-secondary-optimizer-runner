# Two paired Native cases read player_t::init_initial_stats total gear stats.
# This is upstream SimC's precombat stat calculation, NOT talent-buffed JSON2.
# Reuses an existing binary; no custom scaling or effects engine.
name: P1 O 70783 paired SimC precombat unbuffed gear report
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p1_oil_70783_simc_weapon_static_once.yml]
permissions:
  contents: read
  actions: read
jobs:
  paired-gear-oil:
    if: contains(github.event.head_commit.message, '[p1-o-item-report-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse actual source-bound 70783 existing SimC binary
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Read SimC precombat total gear with oil off and on
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          sha256sum -c out/binary/simc.sha256
          chmod +x out/binary/simc
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          import v098_target_user_scenario_bootstrap as boot
          import v106_user_session_controller as controls
          import v140_pure_profile_physical_native_smoke as physical

          root=pathlib.Path("out/oil_static_one").resolve()
          root.mkdir(parents=True,exist_ok=True)
          binary=pathlib.Path("out/binary/simc").resolve()
          revision=os.environ["SIMC_PINNED_SOURCE_COMMIT"]
          settings=controls.standard_controls(("paladin","retribution"))
          settings["oil_hands"]=[]
          user=controls.user_scenario(settings)
          boot.build(user,root/"stage",binary,revision,
                     pure_stage=True,source_first_stage=True)
          planned=(root/"stage"/"profile.simc").read_text(encoding="utf8")
          results={}
          profiles={}
          for label,token in (
                  ("off","disabled"),
                  ("on","main_hand:thalassian_phoenix_oil_2")):
              json2=root/(label+".json")
              source=physical.physical_input(planned,json2,1)
              source="\n".join(x for x in source.splitlines()
                               if not x.startswith((
                                   "temporary_enchant=","debug=","threads=")))+"\n"
              source+="temporary_enchant="+token+"\n"
              source+="debug=1\nthreads=1\n"
              profiles[label]=source
              profile=root/(label+".simc")
              profile.write_text(source,encoding="utf8")
              log_path=root/(label+".log")
              with log_path.open("wb") as output:
                  ran=subprocess.run([str(binary),str(profile)],cwd=root,
                      stdout=output,stderr=subprocess.STDOUT,timeout=180)
              log=log_path.read_text(encoding="utf8",errors="replace")
              if ran.returncode:
                  print("SIMC_ORIGINAL_ERROR_TAIL",log[-4000:],flush=True)
                  raise SystemExit(ran.returncode)
              assert json2.is_file(),"SimC did not emit JSON2"
              assert "invalid temporary enchant" not in log.lower(),(
                  "SimC silently ignored oil token")
              lines=[x for x in log.splitlines()
                     if "total gear stats:" in x
                     and "target_retribution" in x.split("total gear stats:",1)[0]]
              print("P1_O_UNBUFFED_SIMC_GEAR_LINES",label,lines[-4:],flush=True)
              assert len(lines)==1,("SimC precombat gear debug line missing "
                                     "or ambiguous")
              fields=dict((k,float(v)) for k,v in re.findall(
                  r"\b([A-Za-z][A-Za-z0-9]*)=(-?[0-9]+(?:\.[0-9]+)?)",
                  lines[0].split("total gear stats:",1)[1]))
              assert {"Crit","Haste","Mastery","Vers"}<=set(fields),(
                  "Missing SimC gear stat fields")
              results[label]={"gear":fields,"line":lines[0].strip(),
                  "input_sha256":hashlib.sha256(
                      source.encode("utf8")).hexdigest(),
                  "json2_sha256":hashlib.sha256(
                      json2.read_bytes()).hexdigest()}
          normalized=lambda s:[x for x in s.splitlines()
                                 if not x.startswith(
                                     ("json2=","temporary_enchant="))]
          assert normalized(profiles["off"])==normalized(profiles["on"]),(
              "Profile changed beyond oil and JSON2 output")
          before,after=results["off"]["gear"],results["on"]["gear"]
          assert set(before)==set(after),"Different gear stat fields"
          changed={k:after[k]-before[k] for k in before}
          assert all(abs(v)<0.000001 for k,v in changed.items()
                     if k not in ("Crit","Haste","Mastery","Vers")),(
              "A non-CHMV gear field changed")
          vector={}
          for k,stat in (("Crit","crit_rating"),("Haste","haste_rating"),
                         ("Mastery","mastery_rating"),
                         ("Vers","versatility_rating")):
              value=changed[k]
              assert value>=0 and abs(value-round(value))<0.000001,(
                  "SimC oil gear delta not a nonnegative integer")
              vector[stat]=round(value)
          assert sum(vector.values())>0,"Oil O not present in gear"
          receipt={"schema":"p1_o_simc_precombat_total_gear_pair_70783_v1",
              "game_build":"12.1.5.70783",
              "simc_revision":revision,
              "binary_sha256":hashlib.sha256(
                  binary.read_bytes()).hexdigest(),
              "oil_token":"main_hand:thalassian_phoenix_oil_2",
              "enchant_id":8052,
              "native_calls":2,"unbuffed_static_CHMV_by_hand":vector,
              "simc_precombat_gear_lines":results,
              "talent_buffed_snapshot_not_used":True,
              "physical_item_eligibility_not_verified":True,
              "environment_not_registered":True}
          (root/"receipt.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("P1_O_UNBUFFED_SIMC_GEAR_DELTA",json.dumps({
              k:v for k,v in receipt.items() if k!="simc_precombat_gear_lines"},
              sort_keys=True),flush=True)
          PY
      - name: Preserve small source report receipt, not a new binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-70783-paired-simc-oil-precombat-gear
          path: |
            out/oil_static_one/receipt.json
            out/oil_static_one/active.simc
          if-no-files-found: ignore
          retention-days: 5
