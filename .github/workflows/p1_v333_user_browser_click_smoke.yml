name: P1 actual Korean browser interactions (ZERO SimC Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/p1_v333_user_browser_click_smoke.py
      - .github/workflows/p1_v333_user_browser_click_smoke.yml
permissions:
  contents: read
jobs:
  user-browser:
    if: contains(github.event.head_commit.message, '[ui-browser-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: runner:integration_probes:.
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Verify system Chrome (no SimC)
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Test dependencies
        run: python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
      - name: Real click and Korean selection exact ID (no Native)
        run: python -u integration_probes/p1_v333_user_browser_click_smoke.py
      - name: Preserve source-independent web receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v333-real-korean-browser-no-native
          path: |
            out/v333_user_browser_receipt.json
            out/v333_user_browser.png
          retention-days: 7
          if-no-files-found: ignore
