name: P1 primary v290 N56 continuous real Native one fresh Survival
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v334_primary_n56_native_once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v334-primary-one-user-case
  cancel-in-progress: false
jobs:
  primary-real-native:
    if: contains(github.event.head_commit.message, '[v334-primary-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: runner:integration_probes:.
      P2_NEW_PRODUCT_PROFILE_ONCE: '1'
      P1_PRIMARY_N56_ONCE: '1'
      P2_FRESH_PROFILE_CASE: survival_hunter_4ordinary_auto_T
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse exact proven binary (not old character profile)
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Binary SHA and existing product offline tests
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m unittest -q tests.test_p2_fresh_user_profile_case_offline tests.test_p2_v331_product_scout_n_seal_offline
      - name: Build fresh one-spec season environment and primary N56 adaptive SimC
        timeout-minutes: 21
        run: python -u integration_probes/p2_new_profile_product_e2e_once.py
      - name: Preserve short receipt and exact Native input JSON2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-v334-survival-primary-n56-real-native
          path: |
            p2_fresh_user_profile_e2e_receipt.json
            p2_new_frost_web_receipt.json
            p3_haj_web_native_evidence.zip
          retention-days: 7
          if-no-files-found: ignore
