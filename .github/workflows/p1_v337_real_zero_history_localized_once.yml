# One bounded real current-build fresh install; NOT a future-season claim.
name: P1 v337 strict empty-root GJFO plus official Korean locale once
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v337_real_zero_history_localized_once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v337-fresh-environment-one-shot
  cancel-in-progress: false
jobs:
  real-zero-history:
    if: contains(github.event.head_commit.message, '[v337-zero-history-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse prior exact SHA-verified SimC binary (not prior installed season)
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Pin binary identity; run targeted offline source contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m unittest -q tests.test_v335_environment_official_ko_localization tests.test_v336_environment_ko_playable_terms
      - name: Actual new verified environment plus name build followed by same-root reuse
        timeout-minutes: 21
        run: python -u integration_probes/p1_v337_real_zero_history_localized_once.py
      - name: Preserve concise receipt without credentials or raw large caches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-v337-cold-start-gjfo-official-ko-compact
          path: p1_v337_zero_history_environment_locale_receipt.json
          if-no-files-found: ignore
          retention-days: 7
