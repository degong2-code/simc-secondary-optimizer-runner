# One source-first Retail 70783 environment proof without Blizzard/WCL/GitHub API keys.
name: P1 v347 Retail 70783 Windows GJFO without developer credentials (max 3 Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p1_v347_windows_70783_native_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v347-no-private-keys-gjfo-one-case
  cancel-in-progress: false
jobs:
  current-windows-source-first:
    if: contains(github.event.head_commit.message, '[v347-no-private-keys-once]')
    runs-on: windows-2022
    timeout-minutes: 27
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: de11f57df75dda668bae6ac7043a43b98831fa96
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
    steps:
      - name: Preserve exact authored file bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse exact official Windows 2026-11-11 source artifact, not rebuild SimC
        uses: actions/download-artifact@v4
        with:
          repository: simulationcraft/simc-publish
          run-id: 42956947906
          name: simc-nightly-win64-midnight
          path: .simc-v347
          github-token: ${{ github.token }}
      - name: Verify exact original archive and Windows executable hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $PWD '.simc-v347/simc-1210.01.de11f57-win64.7z'
          if (!(Test-Path $archive -PathType Leaf)) { throw 'V347_OFFICIAL_SOURCE_FILENAME_DRIFT' }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'a4c4d5e7b349172d80897721daa3e849ce25874a82bbdfb96aeab4dbdc560eb0') { throw 'V347_ARCHIVE_SHA_DRIFT' }
          $seven='C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path $seven)) { throw 'V347_7ZIP_MISSING' }
          New-Item -ItemType Directory -Force -Path .simc-v347-extracted | Out-Null
          & $seven x '-o.simc-v347-extracted' -y -bd $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'V347_ARCHIVE_EXTRACTION_FAILED' }
          $exes=@(Get-ChildItem .simc-v347-extracted -Recurse -Filter simc.exe -File)
          if ($exes.Count -ne 1) { throw 'V347_SIMC_EXE_COUNT_INVALID' }
          $hash=(Get-FileHash -Algorithm SHA256 $exes[0].FullName).Hash.ToLowerInvariant()
          if ($hash -ne '1fc927d2be7f1b6064c75f004b5b22245b064a6b3e56e572af4048ba822a986d') { throw 'V347_EXE_SHA_DRIFT' }
          "V347_SIMC_EXE=$($exes[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reuse current tested dependencies, not an engine rebuild
        shell: pwsh
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'V347_WEB_DEPENDENCIES_FAILED' }
      - name: One KR Retail 70783 GJFO original Native G1+F2 without private or GitHub source API keys
        timeout-minutes: 19
        shell: pwsh
        run: |
          python -u integration_probes/p1_v347_windows_no_private_keys_gjfo_once.py --simc "$env:V347_SIMC_EXE" --out out/v347
          if ($LASTEXITCODE -ne 0) { throw 'V347_REAL_WINDOWS_NATIVE_FAILED' }
      - name: Retain compact true credential-free GJFO result or explicit blocked reason
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v347-windows-70783-no-private-keys-gjfo
          path: |
            out/v347/V347_WINDOWS_NO_PRIVATE_KEYS_ENVIRONMENT.json
          retention-days: 7
          if-no-files-found: warn
