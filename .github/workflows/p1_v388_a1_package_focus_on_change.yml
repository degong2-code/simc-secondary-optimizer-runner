name: p1 v388 A1 and package inventory focused offline
on:
  push:
    branches:
      - probe/chat-cache-v035-20261024
    paths:
      - .github/workflows/p1_v388_a1_package_focus_on_change.yml
      - runner/v155_season_api_probe.py
      - runner/v163_zero_seed_db2_join.py
      - runner/v216_environment_build_coordinator.py
      - runner/v242_authenticated_season_source_stage.py
      - runner/v113_local_web_api.py
      - tests/test_v155_all_expansion_autodiscovery.py
      - tests/test_v163_db2_zero_seed.py
      - tests/test_v113_local_web_api_offline.py
      - integration_probes/v181_windows_beta_packager.py
      - tests/test_v181_windows_beta_package_offline.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only existing web test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: A1 v155 source discovery (no external API/Native)
        run: python -m unittest discover -s tests -p 'test_v155_all_expansion_autodiscovery.py' -v
      - name: A1 v163 same-build DB2 source join (fixtures only)
        run: python -m unittest discover -s tests -p 'test_v163_db2_zero_seed.py' -v
      - name: A1 v113 HTTP boundary (offline fixtures only)
        run: python -m unittest discover -s tests -p 'test_v113_local_web_api_offline.py' -v
      - name: App TXT list vs existing ZIP selector
        run: python -m unittest discover -s tests -p 'test_v181_windows_beta_package_offline.py' -v
      - name: Publish exact focused test result for evidence lookup
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          payload = {
              "state": state,
              "context": "p1-v388-a1-and-app-package-offline",
              "description": "Four scoped suites; no real API, SimC or Windows Native",
              "target_url": (
                  f"https://github.com/{repo}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          req = urllib.request.Request(
              url,
              json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              assert response.status == 201, response.status
          print("FOCUSED_OFFLINE_RESULT",state,"commit",sha)
          PY
