name: p1 v388 A1 and package inventory focused offline
on:
  push:
    branches:
      - probe/chat-cache-v035-20261024
    paths:
      - .github/workflows/p1_v388_a1_package_focus_on_change.yml
      - runner/v155_season_api_probe.py
      - runner/v163_zero_seed_db2_join.py
      - runner/v165_current_season_gear_pool.py
      - runner/v166_compact_product_gear_db.py
      - runner/v167_product_season_gear_adapter.py
      - tests/test_v165_current_season_gear_pool.py
      - tests/test_v166_compact_product_gear_db.py
      - tests/test_v167_product_season_gear_adapter.py
      - runner/v216_environment_build_coordinator.py
      - runner/v242_authenticated_season_source_stage.py
      - runner/v113_local_web_api.py
      - tests/test_v289_retail_live_build_source.py
      - tests/test_v155_season_api_probe_offline.py
      - tests/test_v242_blizzard_source_lineage_offline.py
      - tests/test_v242_wcl_source_lineage_offline.py
      - tests/test_v332_blizzard_ko_item_labels.py
      - tests/test_v154_blizzard_season_loot_index_offline.py
      - runner/v332_blizzard_ko_item_labels.py
      - runner/v154_blizzard_season_loot_index.py
      - tests/test_v155_all_expansion_autodiscovery.py
      - tests/test_v163_db2_zero_seed.py
      - tests/test_v161_db2_source_provenance_offline.py
      - tests/test_v216_environment_build_coordinator.py
      - runner/v161_wago_db2_snapshot.py
      - runner/v217_stage_execution_engine.py
      - tests/test_v113_local_web_api_offline.py
      - integration_probes/v181_windows_beta_packager.py
      - tests/test_v181_windows_beta_package_offline.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only existing web test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: A2 v289 official Retail build parser (source-only fixtures)
        run: python -m unittest discover -s tests -p 'test_v289_retail_live_build_source.py' -v
      - name: A4 original v155 provider suite (all-expansion; no legacy named selector)
        run: python -m unittest discover -s tests -p 'test_v155_season_api_probe_offline.py' -v
      - name: A4 v242 original Blizzard source lineage and cache reuse
        run: python -m unittest discover -s tests -p 'test_v242_blizzard_source_lineage_offline.py' -v
      - name: A5 WCL exact two-request response provenance and cache reuse
        run: python -m unittest discover -s tests -p 'test_v242_wcl_source_lineage_offline.py' -v
      - name: A4 optional Blizzard localized item name contract
        run: python -m unittest discover -s tests -p 'test_v332_blizzard_ko_item_labels.py' -v
      - name: A4 optional Blizzard selected loot owner contract
        run: python -m unittest discover -s tests -p 'test_v154_blizzard_season_loot_index_offline.py' -v
      - name: A1 v155 source discovery (no external API/Native)
        run: python -m unittest discover -s tests -p 'test_v155_all_expansion_autodiscovery.py' -v
      - name: A1 v163 same-build DB2 source join (fixtures only)
        run: python -m unittest discover -s tests -p 'test_v163_db2_zero_seed.py' -v
      - name: A7 WSE guarded item source must not become current selectable candidate
        run: |
          python -m unittest discover -s tests -p 'test_v165_current_season_gear_pool.py' -v
          python -m unittest discover -s tests -p 'test_v166_compact_product_gear_db.py' -v
          python -m unittest discover -s tests -p 'test_v167_product_season_gear_adapter.py' -v
      - name: A6 v161 ten Wago CSV SHA and sealed reuse (synthetic source only)
        run: python -m unittest discover -s tests -p 'test_v161_db2_source_provenance_offline.py' -v
      - name: A6 v216 actual product path reuses DB2 without duplicate fetch
        run: python -m unittest tests.test_v216_environment_build_coordinator.EnvironmentBuildCoordinatorTests.test_live_collector_reuse_by_build_without_old_season_or_native -v
      - name: A1 v113 HTTP boundary (offline fixtures only)
        run: python -m unittest discover -s tests -p 'test_v113_local_web_api_offline.py' -v
      - name: Stage v213 catalog from existing SYNTHETIC test fixture (CI only)
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, str(pathlib.Path("tests").resolve()))
          from test_v213_source_to_catalog import SourceToCatalogTests
          SourceToCatalogTests.setUpClass()
          fixture=SourceToCatalogTests(
              "test_actual_source_rows_join_and_v196_preserves_approval_boundary"
          )
          document=fixture.compile()
          from v213_source_to_catalog import verify_catalog
          assert verify_catalog(document)
          assert document["native_calls"] == 0
          assert document["automatic_ui_promotion"] is False
          path=pathlib.Path("data/current_season_source_to_catalog.json")
          assert not path.exists(), "Do not overwrite original v213 source"
          path.write_text(json.dumps(
              document,sort_keys=True,ensure_ascii=False,indent=2
          )+"\n",encoding="utf8")
          print("CI_SYNTHETIC_V213_TEST_FIXTURE_ONLY",document["manifest_sha256"])
          PY
      - name: App TXT list vs existing ZIP selector
        run: python -m unittest discover -s tests -p 'test_v181_windows_beta_package_offline.py' -v
      - name: Generate current beta package input TXT
        run: |
          python integration_probes/v181_windows_beta_packager.py \
            --list-files APP_BETA_FILE_LIST.txt
          python - <<'PY'
          from pathlib import Path
          doc=Path("APP_BETA_FILE_LIST.txt").read_text(encoding="utf8")
          lines=[x for x in doc.splitlines() if not x.startswith("#")]
          assert lines and lines==sorted(set(lines))
          assert "runner/v113_local_web_api.py" in lines
          assert "runner/v155_season_api_probe.py" in lines
          assert "runner/webui/app.js" in lines
          print("APP_BETA_FILE_LIST_CAPTURED",len(lines))
          PY
      - name: Preserve TXT candidate list as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1-v388-app-beta-paths-${{ github.sha }}
          path: APP_BETA_FILE_LIST.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact focused test result for evidence lookup
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          payload = {
              "state": state,
              "context": "p1-v388-a1-and-app-package-offline",
              "description": "Four scoped suites; no real API, SimC or Windows Native",
              "target_url": (
                  f"https://github.com/{repo}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          req = urllib.request.Request(
              url,
              json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              assert response.status == 201, response.status
          print("FOCUSED_OFFLINE_RESULT",state,"commit",sha)
          PY
