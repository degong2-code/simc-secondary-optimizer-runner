# Read-only 70783 v439 existing evidence: NO SimC Native or season API calls.
name: P1 v440 B8 70783 existing six JSON2 policy audit
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v440_b8_existing_native_statistics_audit.py
      - .github/workflows/p1_v440_b8_existing_native_statistics.yml
permissions:
  contents: read
  actions: read
jobs:
  existing-six-native-json2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: runner:.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Original v439 artifact exact run and name, no rerun
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 43466966207
          name: p1-v439-b8-one-selected-70783-native-43466966207
          path: .v440-existing-v439-original
          github-token: ${{ github.token }}
      - name: Recalculate original v065 95 judgement and v094 material alternatives
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile runner/v440_b8_existing_native_statistics_audit.py
          python runner/v440_b8_existing_native_statistics_audit.py \
            --original-archive .v440-existing-v439-original \
            --v439-compact docs/development/research_receipts/p1_v439_windows_70783_selected_four_tier_actual_native_compact.json \
            --out out/v440/V440_EXISTING_NATIVE_95_POLICY_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/v440/V440_EXISTING_NATIVE_95_POLICY_RECEIPT.json').read_text())
          assert d['new_native_calls']==0
          assert d['confidence_level']==0.95
          assert d['confirmation']['distinct_simc_seeds_observed'] is True
          assert d['confirmation']['pairwise_direction_supported'] is True
          assert d['observed_unique_targets']==4
          assert d['material_near_alternatives']==[]
          assert d['official_78_B8_not_promoted_here'] is True
          print('PASS existing six JSON2 95% confirmation + material near 0/4, zero Native')
          PY
      - name: Publish original-evidence-derived compact analysis only
        uses: actions/upload-artifact@v6
        with:
          name: p1-v440-existing-v439-six-json2-95-statistics-${{ github.run_id }}
          path: out/v440/V440_EXISTING_NATIVE_95_POLICY_RECEIPT.json
          retention-days: 14
          if-no-files-found: error
