name: P1 v553 zero-source J original-owner source-only diagnostic Native0
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v552_zero_source_user_e2e_once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v552-true-zero-source-native-one
  cancel-in-progress: false
jobs:
  one-clean-user-native:
    if: ${{ contains(github.event.head_commit.message, '[v552-zero-source-once]') }}
    runs-on: windows-2022
    timeout-minutes: 44
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: de11f57df75dda668bae6ac7043a43b98831fa96
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_PINNED_BINARY_SHA256: 1fc927d2be7f1b6064c75f004b5b22245b064a6b3e56e572af4048ba822a986d
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Keep exact Git source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Assert scoped one-shot opt-in
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
          $allowed=@('.github/workflows/p1_v552_zero_source_user_e2e_once.yml','integration_probes/p1_v552_real_zero_source_user_e2e.py')
          if (@($changed | Where-Object {$_ -notin $allowed}).Count -gt 0) { throw 'V552_ONLY_NEW_SCOPED_TEST_FILES_ALLOWED' }
          if ($changed.Count -ne 2) { throw 'V552_EXACT_TWO_TEST_FILES_REQUIRED' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download original published same-build SimC binary (never copy season data)
        uses: actions/download-artifact@v4
        with:
          repository: simulationcraft/simc-publish
          run-id: 42956947906
          name: simc-nightly-win64-midnight
          path: .simc-v552
          github-token: ${{ github.token }}
      - name: Verify binary SHA, quarantine all repository historical season JSON
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $PWD '.simc-v552/simc-1210.01.de11f57-win64.7z'
          if (!(Test-Path $archive -PathType Leaf)) { throw 'V552_PINNED_BINARY_ARCHIVE_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'a4c4d5e7b349172d80897721daa3e849ce25874a82bbdfb96aeab4dbdc560eb0') { throw 'V552_ORIGINAL_BINARY_ARCHIVE_SHA_DRIFT' }
          New-Item -ItemType Directory -Force .simc-v552-extracted | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x '-o.simc-v552-extracted' -y -bd $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'V552_OFFICIAL_SIMC_EXTRACTION_FAILED' }
          $exes=@(Get-ChildItem .simc-v552-extracted -Recurse -Filter simc.exe -File)
          if ($exes.Count -ne 1) { throw 'V552_EXACT_BINARY_REQUIRED' }
          if ((Get-FileHash -Algorithm SHA256 $exes[0].FullName).Hash.ToLowerInvariant() -ne $env:SIMC_PINNED_BINARY_SHA256) { throw 'V552_PINNED_BINARY_SHA_DRIFT' }
          "V552_SIMC_EXE=$($exes[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $quarantine=Join-Path $env:RUNNER_TEMP 'v552-source-quarantine'
          New-Item -ItemType Directory -Force $quarantine | Out-Null
          $old=@(Get-ChildItem data -File -Filter 'current_season_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v202_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v206_*.json')
          $old+=@(Get-ChildItem data/season_ordinary_gem_nominal -File -Filter '*.json')
          foreach ($source in $old) { Move-Item -LiteralPath $source.FullName -Destination (Join-Path $quarantine $source.Name) }
          if ($old.Count -lt 2) { throw 'V552_HISTORICAL_QUARANTINE_DID_NOT_RUN' }
          Write-Host "ZERO_SOURCE_REPOSITORY_SEASON_INPUTS_QUARANTINED=$($old.Count)"
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'V552_TEST_CLIENT_REQUIREMENTS_FAILED' }
          python -m py_compile integration_probes/p1_v552_real_zero_source_user_e2e.py
          if ($LASTEXITCODE -ne 0) { throw 'V552_PROBE_SYNTAX_FAILED' }
      - name: One TRUE zero-source M1-M2 followed by real user DPS/SEM/95% and cache-only
        shell: pwsh
        timeout-minutes: 30
        run: |
          New-Item -ItemType Directory -Force out/v552 | Out-Null
          python -u integration_probes/p1_v552_real_zero_source_user_e2e.py --simc "$env:V552_SIMC_EXE" --out out/v552 --source-only
          if ($LASTEXITCODE -ne 0) { throw 'V552_REAL_ZERO_SOURCE_FIRST_BLOCKER_IN_RECEIPT' }
      - name: Preserve bounded status and original identifiers (no source data or credentials)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v552-true-zero-source-user-first-attempt
          path: out/v552/V552_TRUE_ZERO_SOURCE_TO_USER.json
          retention-days: 10
          if-no-files-found: warn
