name: P1 v569 First User Chrome Build-to-Trinkets (synthetic HTTP, Native 0)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/p1_v569_real_chrome_first_user_bridge.py
      - .github/workflows/p1_v569_first_user_chrome_once.yml
permissions:
  contents: read
concurrency:
  group: p1-v569-first-user-once
  cancel-in-progress: false
jobs:
  first-user-browser:
    if: contains(github.event.head_commit.message, '[v569-first-user-once]')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing web test stack and Selenium (no SimC)
        run: python -m pip install -r requirements-web-test.txt "selenium>=4.24,<5"
      - name: Actual user clicks, existing localhost UI, synthetic Build and DPS, zero Native
        run: python -u integration_probes/p1_v569_real_chrome_first_user_bridge.py
      - name: Save compact receipt (no screenshots, secrets, binaries or sessions)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v569-first-user-browser-${{ matrix.os }}
          path: out/v569/V569_BROWSER_BRIDGE_RECEIPT.json
          retention-days: 7
          if-no-files-found: warn
