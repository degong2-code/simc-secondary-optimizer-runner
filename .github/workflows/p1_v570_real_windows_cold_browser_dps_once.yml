name: P1 v570 Actual Windows Cold Browser Build to SimC DPS64 (ONE Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v570_real_windows_cold_browser_dps_once.yml
      - integration_probes/p1_v570_real_windows_cold_browser_to_simc_once.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v570-one-actual-windows-cold-ui-native
  cancel-in-progress: false
jobs:
  first-user-real-native:
    if: ${{ contains(github.event.head_commit.message, '[v570-real-cold-browser-once]') }}
    runs-on: windows-2022
    timeout-minutes: 48
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: de11f57df75dda668bae6ac7043a43b98831fa96
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_PINNED_BINARY_SHA256: 1fc927d2be7f1b6064c75f004b5b22245b064a6b3e56e572af4048ba822a986d
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve original sources on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Assert opt-in touches only one existing test script or workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
          $allowed=@('.github/workflows/p1_v570_real_windows_cold_browser_dps_once.yml',
                     'integration_probes/p1_v570_real_windows_cold_browser_to_simc_once.py')
          if (@($changed | Where-Object {$_ -notin $allowed}).Count -gt 0) { throw 'V570_SCOPED_FILES_ONLY' }
          if ($changed.Count -lt 1 -or $changed.Count -gt 2) { throw 'V570_EXPLICIT_SCOPED_OPTIN_ONLY' }
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse original official same-build Windows SimC archive
        uses: actions/download-artifact@v4
        with:
          repository: simulationcraft/simc-publish
          run-id: 42956947906
          name: simc-nightly-win64-midnight
          path: .v570-official-simc
          github-token: ${{ github.token }}
      - name: Exact SimC SHA and cold source quarantine (no Native)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $PWD '.v570-official-simc/simc-1210.01.de11f57-win64.7z'
          if (!(Test-Path $archive -PathType Leaf)) { throw 'V570_PINNED_SIMC_ARCHIVE_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'a4c4d5e7b349172d80897721daa3e849ce25874a82bbdfb96aeab4dbdc560eb0') { throw 'V570_ARCHIVE_SHA_DRIFT' }
          New-Item -ItemType Directory -Force .v570-extracted | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x '-o.v570-extracted' -y -bd $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'V570_SIMC_EXTRACTION_FAILED' }
          $exes=@(Get-ChildItem .v570-extracted -Recurse -Filter simc.exe -File)
          if ($exes.Count -ne 1) { throw 'V570_EXACT_ONE_SIMC_BINARY_REQUIRED' }
          if ((Get-FileHash -Algorithm SHA256 $exes[0].FullName).Hash.ToLowerInvariant() -ne $env:SIMC_PINNED_BINARY_SHA256) { throw 'V570_BINARY_SHA_DRIFT' }
          "V570_SIMC_EXE=$($exes[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $quarantine=Join-Path $env:RUNNER_TEMP 'v570-source-quarantine'
          New-Item -ItemType Directory -Force $quarantine | Out-Null
          $old=@(Get-ChildItem data -File -Filter 'current_season_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v202_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v206_*.json')
          $old+=@(Get-ChildItem data/season_ordinary_gem_nominal -File -Filter '*.json')
          foreach ($source in $old) { Move-Item -LiteralPath $source.FullName -Destination (Join-Path $quarantine $source.Name) }
          if ($old.Count -lt 2) { throw 'V570_SEASON_QUARANTINE_EMPTY' }
          Write-Host "V570_HISTORICAL_SEASON_FILES_QUARANTINED=$($old.Count)"
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V570_TEST_DEPENDENCIES_FAILED' }
          python -m py_compile integration_probes/p1_v570_real_windows_cold_browser_to_simc_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V570_PROBE_COMPILE_FAILED' }
          node --check runner/webui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'V570_PRODUCT_BROWSER_SCRIPT_INVALID' }
      - name: ONE actual cold Chrome button to source Build / v212 / trinkets / real 64 SimC result
        shell: pwsh
        timeout-minutes: 39
        run: |
          New-Item -ItemType Directory -Force out/v570 | Out-Null
          python -u integration_probes/p1_v570_real_windows_cold_browser_to_simc_once.py --simc "$env:V570_SIMC_EXE" --out out/v570
          if ($LASTEXITCODE -ne 0) { throw 'V570_FIRST_BLOCKER_IN_COMPACT_RECEIPT' }
      - name: Preserve exact compact result without secrets, source data, session files or binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v570-real-first-user-windows-native-compact
          path: out/v570/V570_REAL_WINDOWS_FIRST_USER_PRODUCT.json
          retention-days: 10
          if-no-files-found: warn
