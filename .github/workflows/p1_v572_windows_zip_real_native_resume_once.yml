name: P1 v572 ONE Windows ZIP Real SimC Cancel BAT Restart Resume (bounded Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v572_windows_zip_real_native_resume_once.yml
      - integration_probes/p1_v572_windows_zip_real_native_restart_resume_once.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v572-one-windows-zip-actual-cancel-resume
  cancel-in-progress: false
jobs:
  one-packaged-actual-adaptive-resume:
    if: ${{ contains(github.event.head_commit.message, '[v572-real-zip-resume-once]') }}
    runs-on: windows-2022
    timeout-minutes: 36
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: de11f57df75dda668bae6ac7043a43b98831fa96
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_PINNED_BINARY_SHA256: 1fc927d2be7f1b6064c75f004b5b22245b064a6b3e56e572af4048ba822a986d
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Original source bytes on Windows, never autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Explicit one-shot opt-in, no other product runtime edits
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
          $allowed=@('.github/workflows/p1_v572_windows_zip_real_native_resume_once.yml',
                     'integration_probes/p1_v572_windows_zip_real_native_restart_resume_once.py')
          if (@($changed | Where-Object {$_ -notin $allowed}).Count -gt 0) { throw 'V572_UNSCOPED_NATIVE_RUN_REFUSED' }
          if ($changed.Count -lt 1 -or $changed.Count -gt 2) { throw 'V572_EXPLICIT_SCOPED_OPTIN_REQUIRED' }
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse exact previously verified current-head Windows beta ZIP
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 44078544739
          name: v181-windows-source-beta-44078544739
          path: .v572-original-zip
          github-token: ${{ github.token }}
      - name: Reuse published same-build Windows SimC as separate binary
        uses: actions/download-artifact@v4
        with:
          repository: simulationcraft/simc-publish
          run-id: 42956947906
          name: simc-nightly-win64-midnight
          path: .v572-original-simc
          github-token: ${{ github.token }}
      - name: Verify exact Windows SimC and source-only ZIP, no Native
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $PWD '.v572-original-zip/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip'
          if (!(Test-Path $zip -PathType Leaf)) { throw 'V572_CURRENT_PRODUCT_SOURCE_ZIP_MISSING' }
          $arc=Join-Path $PWD '.v572-original-simc/simc-1210.01.de11f57-win64.7z'
          if (!(Test-Path $arc -PathType Leaf)) { throw 'V572_SAME_BUILD_OFFICIAL_SIMC_ARCHIVE_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $arc).Hash.ToLowerInvariant() -ne 'a4c4d5e7b349172d80897721daa3e849ce25874a82bbdfb96aeab4dbdc560eb0') { throw 'V572_ORIGINAL_SIMC_ARCHIVE_SHA_DRIFT' }
          New-Item -ItemType Directory -Force .v572-external-simc | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x '-o.v572-external-simc' -y -bd $arc | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'V572_OFFICIAL_SIMC_EXTRACT_FAIL' }
          $exe=@(Get-ChildItem .v572-external-simc -Recurse -File -Filter simc.exe)
          if ($exe.Count -ne 1) { throw 'V572_ONE_OFFICIAL_SIMC_EXE_REQUIRED' }
          if ((Get-FileHash -Algorithm SHA256 $exe[0].FullName).Hash.ToLowerInvariant() -ne $env:SIMC_PINNED_BINARY_SHA256) { throw 'V572_EXECUTABLE_SHA_MISMATCH' }
          "V572_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "V572_SOURCE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V572_DEPENDENCIES_UNAVAILABLE' }
          python -m py_compile integration_probes/p1_v572_windows_zip_real_native_restart_resume_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V572_NEW_PROBE_SYNTAX_FAIL' }
          node --check runner/webui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'V572_SHIPPED_JS_SYNTAX_FAIL' }
      - name: One real ZIP first build, original 64-case start, Chrome cancel, BAT restart/restore, Chrome resume and cancel
        shell: pwsh
        timeout-minutes: 28
        run: |
          New-Item -ItemType Directory -Force out/v572 | Out-Null
          python -u integration_probes/p1_v572_windows_zip_real_native_restart_resume_once.py --zip "$env:V572_SOURCE_ZIP" --simc "$env:V572_EXE" --out out/v572
          if ($LASTEXITCODE -ne 0) { throw 'V572_FIRST_BLOCKER_IN_COMPACT_RECEIPT' }
      - name: Save only compact proof; exclude credentials, original sources, session files, executable
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v572-one-real-win-zip-bounded-cancel-restart-resume
          path: out/v572/V572_WINDOWS_ZIP_REAL_CANCEL_RESTART_RESUME_COMPACT.json
          retention-days: 10
          if-no-files-found: warn
