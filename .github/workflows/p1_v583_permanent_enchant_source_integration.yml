name: P1 v583 Existing v216 Permanent Enchant Source Integration

on:
  workflow_dispatch:
  push:
    branches:
      - probe/chat-cache-v035-20261024
    paths:
      - .github/workflows/p1_v583_permanent_enchant_source_integration.yml
      - runner/v583_permanent_enchant_physical_source.py
      - runner/v584_supplemental_permanent_enchant_classification.py
      - runner/v213_source_to_catalog.py
      - tests/test_v584_supplemental_permanent_enchant_classification.py
      - tests/test_v585_historical_70783_enchant_quality.py
      - tests/test_v586_pinned_dk_runeforge_environment_integration.py
      - tests/fixtures/p1_v586_pinned_simc_dk_runeforge_enum_70783.txt
      - tests/fixtures/p1_v585_70783_linked_enchant_quality_pinned_source_excerpt.json
      - runner/v216_environment_build_coordinator.py
      - tests/test_v583_permanent_enchant_physical_source.py

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm v583 one-table cached source join and old v216 contracts
        run: |
          python -m unittest discover -s tests -p test_v583_permanent_enchant_physical_source.py -v
          python -m unittest discover -s tests -p test_v584_supplemental_permanent_enchant_classification.py -v
          python -m unittest discover -s tests -p test_v585_historical_70783_enchant_quality.py -v
          python -m unittest discover -s tests -p test_v586_pinned_dk_runeforge_environment_integration.py -v
          python -m unittest discover -s tests -p test_v294_dk_runeforge_selection.py -q
          python -m unittest discover -s tests -p test_v295_season_runeforge_source.py -q
          python -m unittest discover -s tests -p test_v240_v211_v213_fresh_catalog_handoff.py -q
          python -m unittest discover -s tests -p test_v216_environment_build_coordinator.py -q
      - name: Source join only (no Native / external collection)
        run: echo "Focused offline v583 tests only; historical real 70783 v582 Wago exact join remains separate evidence."
