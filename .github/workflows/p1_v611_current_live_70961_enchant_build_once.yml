# Fresh, same-build 70961 M1/M2 source construction and original v629 Policy A admission.
# No archived v213 stage input or historical season fixture; no user DPS Native.
# Preserve the original product v216/v196/v220/v212 runtime and its fail-closed checks.
name: P2 v630 fresh 70961 source build and v629 enchant admission once
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v611_current_live_70961_enchant_build_once.yml
      - integration_probes/p1_v611_current_live_70961_enchant_registration_once.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v611-70961-one-source-compiled-enchant
  cancel-in-progress: false
jobs:
  one-current-real-source:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v618-real-enchant-once]') || contains(github.event.head_commit.message, '[v630-fresh-source-enchant-once]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: 9933ffb946fb55b1fa66657b848f519ac19006e1
      SIMC_PINNED_GAME_BUILD: 12.1.5.70961
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Exact Git source formatting
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Checkout actual 70961 source SHA not previous binary
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: 9933ffb946fb55b1fa66657b848f519ac19006e1
          path: .v611-simc-src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse exact source-compiled CLI from this branch cache if present
        id: simc_cache
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - uses: step-security/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Verify exact source and reuse or compile CLI once
        shell: pwsh
        timeout-minutes: 23
        run: |
          $ErrorActionPreference='Stop'
          $sha=(& git -C .v611-simc-src rev-parse HEAD).Trim()
          if ($sha -ne $env:SIMC_PINNED_SOURCE_COMMIT) { throw 'V611_SIMC_SOURCE_COMMIT_DRIFT' }
          $sha | Set-Content -NoNewline -Encoding ascii -Path .v611-source-commit.txt
          $cacheDir=Join-Path $PWD '.v618-simc-cache'
          $bin=Join-Path $cacheDir 'simc.exe'
          $meta=Join-Path $cacheDir 'identity.json'
          if ((Test-Path $bin -PathType Leaf) -and (Test-Path $meta -PathType Leaf)) {
            $identity=Get-Content -Raw $meta | ConvertFrom-Json
            $hash=(Get-FileHash -Algorithm SHA256 $bin).Hash.ToLowerInvariant()
            if ($identity.source_commit -ne $sha -or $identity.game_build -ne $env:SIMC_PINNED_GAME_BUILD -or $identity.binary_sha256 -ne $hash) { throw 'V618_REUSED_BINARY_SOURCE_IDENTITY_SHA_DRIFT' }
            Write-Host "V618_REUSED_SOURCE_BOUND_BINARY_SHA256=$hash"
          } else {
            cmake -S .v611-simc-src -B .v611-simc-build -GNinja -DBUILD_GUI=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -ne 0) { throw 'V618_PINNED_SIMC_CMAKE_CONFIGURE_FAILED' }
            cmake --build .v611-simc-build --target simc --parallel 2
            if ($LASTEXITCODE -ne 0) { throw 'V618_PINNED_SIMC_CMAKE_BUILD_FAILED' }
            $exes=@(Get-ChildItem .v611-simc-build -Recurse -Filter simc.exe -File)
            if ($exes.Count -ne 1) { throw 'V618_SINGLE_COMPILED_SIMC_EXE_REQUIRED' }
            New-Item -ItemType Directory -Force $cacheDir | Out-Null
            Copy-Item -LiteralPath $exes[0].FullName -Destination $bin
            $hash=(Get-FileHash -Algorithm SHA256 $bin).Hash.ToLowerInvariant()
            @{ source_commit=$sha; game_build=$env:SIMC_PINNED_GAME_BUILD; binary_sha256=$hash } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 $meta
            Write-Host "V618_NEW_SOURCE_BOUND_BINARY_SHA256=$hash"
          }
          "V611_SIMC_EXE=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -m py_compile integration_probes/p1_v610_real_installed_enchant_one_build.py integration_probes/p1_v611_current_live_70961_enchant_registration_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V618_PROBE_SYNTAX_FAILED' }
      - name: Save one verified source-bound CLI for same-build product follow-ups
        if: ${{ steps.simc_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Quarantine historical season files and reuse original web dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $quarantine=Join-Path $env:RUNNER_TEMP 'v611-old-season-quarantine'
          New-Item -ItemType Directory -Force $quarantine | Out-Null
          $old=@(Get-ChildItem data -File -Filter 'current_season_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v202_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v206_*.json')
          $old+=@(Get-ChildItem data/season_ordinary_gem_nominal -File -Filter '*.json')
          foreach ($source in $old) { Move-Item -LiteralPath $source.FullName -Destination (Join-Path $quarantine $source.Name) }
          if ($old.Count -lt 2) { throw 'V611_HISTORICAL_INPUT_QUARANTINE_FAILED' }
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'V611_REQUIREMENTS_FAILED' }
      - name: ONE exact current season G J F O / original v216 v212 real enchant admission
        shell: pwsh
        timeout-minutes: 17
        run: |
          New-Item -ItemType Directory -Force out/v611 | Out-Null
          python -u integration_probes/p1_v611_current_live_70961_enchant_registration_once.py --simc "$env:V611_SIMC_EXE" --source-commit-file .v611-source-commit.txt --out out/v611
          if ($LASTEXITCODE -ne 0) { throw 'V611_REAL_FIRST_BLOCKER_IN_COMPACT_RECEIPT' }
      - name: Preserve proof counts and first blocker only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-v630-fresh-70961-v629-enchant-admission
          path: out/v611/V611_REAL_70961_ENCHANT_ADMISSION_ONE_BUILD.json
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve the original verified installed v212 document for next user consumer
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-v630-fresh-70961-verified-v212-installed
          path: out/v611/V618_REAL_INSTALLED_V212.json
          retention-days: 14
          if-no-files-found: ignore
