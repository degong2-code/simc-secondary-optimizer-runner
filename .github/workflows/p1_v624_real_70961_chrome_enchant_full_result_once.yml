# Real Chrome: one same-build signed 70961 E0 user scenario with exactly one
# original 64-case full completion and result restore; the v621 partial path stays intact.
name: P1 v624 real Chrome 70961 signed E0 full result and restore once
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v624_real_70961_chrome_enchant_full_result_once.yml
      - integration_probes/p1_v621_real_70961_browser_enchant_cancel_resume_once.py
      - integration_probes/p1_v624_real_70961_browser_enchant_full_result_once.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v624-real-current-70961-enchant-chrome-completion
  cancel-in-progress: false
jobs:
  syntax-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Python syntax and actual browser JS (no Native)
        shell: bash
        run: |
          python -m py_compile integration_probes/p1_v621_real_70961_browser_enchant_cancel_resume_once.py
          python -m py_compile integration_probes/p1_v624_real_70961_browser_enchant_full_result_once.py
          node --check runner/webui/app.js
  real-chrome-registered-user:
    needs: syntax-only
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v624-real-once]') }}
    runs-on: windows-2022
    timeout-minutes: 42
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: 9933ffb946fb55b1fa66657b848f519ac19006e1
      SIMC_PINNED_GAME_BUILD: 12.1.5.70961
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Restore v618 exact same-build SimC binary cache (no compile)
        id: binary
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Pin original source SHA, quarantine history, validate browser dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ steps.binary.outputs.cache-hit }}' -ne 'true') { throw 'V624_SAME_BUILD_BINARY_CACHE_MISSING_NO_NEW_COMPILATION' }
          $exe=Join-Path $PWD '.v618-simc-cache/simc.exe'
          $identity=Join-Path $PWD '.v618-simc-cache/identity.json'
          if (!(Test-Path $exe -PathType Leaf) -or !(Test-Path $identity -PathType Leaf)) { throw 'V624_ORIGINAL_BINARY_BYTES_MISSING' }
          $stored=Get-Content -Raw $identity | ConvertFrom-Json
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($stored.source_commit -ne $env:SIMC_PINNED_SOURCE_COMMIT -or $stored.game_build -ne $env:SIMC_PINNED_GAME_BUILD -or $stored.binary_sha256 -ne $sha) { throw 'V624_CACHED_BINARY_IDENTITY_DRIFT' }
          "V624_SIMC_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "V624_REUSED_70961_SOURCE_SIMC_SHA=$sha"
          $quarantine=Join-Path $env:RUNNER_TEMP 'v621-other-season-quarantine'
          New-Item -ItemType Directory -Force $quarantine | Out-Null
          $old=@(Get-ChildItem data -File -Filter 'current_season_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v202_*.json')
          $old+=@(Get-ChildItem data -File -Filter 'v206_*.json')
          $old+=@(Get-ChildItem data/season_ordinary_gem_nominal -File -Filter '*.json')
          foreach ($source in $old) { Move-Item -LiteralPath $source.FullName -Destination (Join-Path $quarantine $source.Name) }
          if ($old.Count -lt 2) { throw 'V624_OLD_SEASON_QUARANTINE_MISSING' }
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V624_DEPENDENCIES_FAILED' }
          python -m py_compile integration_probes/p1_v621_real_70961_browser_enchant_cancel_resume_once.py
          python -m py_compile integration_probes/p1_v624_real_70961_browser_enchant_full_result_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V624_SCRIPT_SYNTAX_INVALID' }
          node --check runner/webui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'V624_REAL_UI_JS_INVALID' }
      - name: Actual Chrome E0 signed option, Native 64 completion, saved result reopen
        timeout-minutes: 37
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/v624 | Out-Null
          python -u integration_probes/p1_v624_real_70961_browser_enchant_full_result_once.py --simc "$env:V624_SIMC_EXE" --out out/v624
          if ($LASTEXITCODE -ne 0) { throw 'V624_FIRST_BLOCKER_IN_COMPACT_RECEIPT' }
      - name: Preserve compact full-result and restored user-visible receipt only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v624-real-chrome-signed-enchant-full-result-reopen
          path: out/v624/V624_REAL_CHROME_ENCHANT_FULL_RESULT_RESTORE.json
          retention-days: 14
          if-no-files-found: warn
