name: P1 v684 one real same-build optional source projection, Native zero
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v684_real_optional_source_onebuild_once.yml
      - integration_probes/p1_v684_real_optional_source_onebuild_once.py
      - tests/test_v684_real_optional_source_onebuild_probe.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v684-70961-option-source-onebuild-once
  cancel-in-progress: false
jobs:
  source-only-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synthetic original-owner receipt boundary (no Wago, SimC or Native)
        shell: bash
        env:
          PYTHONPATH: runner:integration_probes:.
        run: |
          python -m pip install -r requirements-web-test.txt
          python -m unittest tests.test_v684_real_optional_source_onebuild_probe -v
  one-source-only:
    if: ${{ contains(github.event.head_commit.message, '[v684-source-once]') || contains(github.event.head_commit.message, '[v820-gem-source-once]') }}
    runs-on: windows-2022
    timeout-minutes: 28
    env:
      PYTHONPATH: runner;integration_probes;.
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Source-only Python dependencies and syntax
        shell: pwsh
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'V684_REQUIREMENTS' }
          python -m py_compile integration_probes/p1_v684_real_optional_source_onebuild_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V684_SYNTAX' }
      - name: One original v216 source-only Build, no SimC binary or Native
        shell: pwsh
        timeout-minutes: 22
        run: |
          New-Item -ItemType Directory -Force out/v684 | Out-Null
          $extra = @()
          if ('${{ contains(github.event.head_commit.message, '[v820-gem-source-once]') }}' -eq 'true') { $extra += '--special-gems' }
          python -u integration_probes/p1_v684_real_optional_source_onebuild_once.py --out out/v684 @extra
          if ($LASTEXITCODE -ne 0) { throw 'V684_FIRST_SOURCE_BLOCKER_IN_RECEIPT' }
      - name: Preserve bounded evidence only; never source CSV or credentials
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v684-real-70961-optional-source-only-once
          path: |
            out/v684/V684_ONE_BUILD_OPTIONAL_SOURCE_ONLY.json
            out/v684/V820_SPECIAL_GEM_SOURCE_ONLY.json
          if-no-files-found: warn
          retention-days: 10
  ordered-lookup-replay:
    if: ${{ contains(github.event.head_commit.message, '[v780-lookup-replay]') || contains(github.event.head_commit.message, '[v795-quality-replay]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse actual v778 compact source receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 45566131185
          github-token: ${{ github.token }}
          name: p1-v684-real-70961-optional-source-only-once
          path: out/v778
      - name: Only pinned item lookup or new exact direct quality source
        env:
          QUALITY_REPLAY: ${{ contains(github.event.head_commit.message, '[v795-quality-replay]') }}
        run: |
          python -m pip install -r requirements-web-test.txt
          extra=()
          if [ "$QUALITY_REPLAY" = "true" ]; then extra+=(--quality-replay); fi
          python -u integration_probes/p1_v684_real_optional_source_onebuild_once.py --replay-v778 out/v778/V684_ONE_BUILD_OPTIONAL_SOURCE_ONLY.json --out out/v780 "${extra[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v780-ordered-lookup-replay
          path: |
            out/v780/V780_ORDERED_LOOKUP_REPLAY.json
            out/v780/V795_DIRECT_QUALITY_REPLAY.json
          if-no-files-found: warn
          retention-days: 30
  special-gem-enchant-replay:
    if: ${{ contains(github.event.head_commit.message, '[v821-gem-enchant-replay]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse retained actual v820 rows and pinned v275 source parser only
        run: |
          python -m pip install -r requirements-web-test.txt
          python -u integration_probes/p1_v684_real_optional_source_onebuild_once.py --replay-special-enchants docs/development/research_receipts/p1_v820_70961_primary_gem_source_compact.json --out out/v821
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v821-special-gem-enchant-replay
          path: out/v821/V821_SPECIAL_GEM_ENCHANT_REPLAY.json
          if-no-files-found: warn
          retention-days: 30
