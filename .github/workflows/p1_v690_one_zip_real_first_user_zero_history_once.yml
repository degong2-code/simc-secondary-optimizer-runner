name: P1 v690 ONE fresh extracted ZIP user browser source SimC adaptive result
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v690_one_zip_real_first_user_zero_history_once.yml
      - integration_probes/p1_v690_one_zip_first_user_zero_history_once.py
      - integration_probes/p1_v573_windows_zip_cold_web_setup_consent_once.py
      - tests/test_v690_visible_oil_user_contract.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v690-first-user-clean-windows-one-shot
  cancel-in-progress: false
jobs:
  one-real-zip-first-user:
    if: ${{ contains(github.event.head_commit.message, '[v690-cold-first-user-once]') }}
    runs-on: windows-2022
    timeout-minutes: 58
    env:
      PYTHONPATH: runner;integration_probes;.
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve real Git source byte identity
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The unchanged v181 legacy packaging contract requires the prior
      # sealed v213 *metadata source* during ZIP creation. This is historical
      # packaging data, NOT a new-season install or user runtime authority.
      # v690 quarantines all current_season_* files after extraction BEFORE
      # launching the user browser. No season measurement is copied.
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 41360273361
          name: v213-source-to-catalog-41360273361
          path: out/v690/legacy-package-only
          github-token: ${{ github.token }}
      - name: Validate legacy package-only source seal, never install as current season
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $raw=Join-Path $PWD 'out/v690/legacy-package-only/v213_current_season_source_to_catalog.json'
          if (!(Test-Path $raw -PathType Leaf)) { throw 'V690_V181_LEGACY_PACKAGE_CATALOG_MISSING' }
          Copy-Item $raw 'data/current_season_source_to_catalog.json' -Force
          python -c "import json,sys;sys.path.insert(0,'runner');import v213_source_to_catalog as v;d=json.load(open('data/current_season_source_to_catalog.json',encoding='utf8'));assert v.verify_catalog(d) and not d['automatic_ui_promotion'] and d['native_calls']==0 and d['network_calls']==0;print('V690_PACKAGE_ONLY_OLD_CATALOG_SEAL_VALID_NOT_LIVE')"
          if ($LASTEXITCODE -ne 0) { throw 'V690_UNVERIFIED_LEGACY_PACKAGE_SOURCE' }
      - name: Prepare exact source ZIP and CI Python Selenium harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V690_CI_HARNESS_REQUIREMENTS' }
          python -m py_compile integration_probes/p1_v573_windows_zip_cold_web_setup_consent_once.py integration_probes/p1_v690_one_zip_first_user_zero_history_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V690_SYNTAX' }
          python -m unittest discover -s tests -p test_v690_visible_oil_user_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V690_VISIBLE_OIL_CONTRACT_PRECHECK' }
          New-Item -ItemType Directory -Force out/v690 | Out-Null
          python integration_probes/v181_windows_beta_packager.py --out out/v690/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          if ($LASTEXITCODE -ne 0) { throw 'V690_CURRENT_HEAD_ZIP_PACKAGER' }
      - name: One contiguous real user new ZIP consent SimC auto install source build browser DPS
        shell: pwsh
        timeout-minutes: 51
        run: |
          $ErrorActionPreference='Stop'
          python -u integration_probes/p1_v690_one_zip_first_user_zero_history_once.py --zip out/v690/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip --out out/v690/receipt
          if ($LASTEXITCODE -ne 0) { throw 'V690_FIRST_REAL_USER_BLOCKER_IN_RECEIPT' }
      - name: Save bounded non-secret report only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v690-cold-new-windows-first-user-one-shot
          path: |
            out/v690/receipt/V690_FIRST_USER_ONE_ZIP_CONTIGUOUS.json
            out/v690/receipt/V573_WINDOWS_COLD_SETUP_EXPLICIT_CONSENT_COMPACT.json
          retention-days: 10
          if-no-files-found: warn

  v691-existing-v278-path-only:
    if: ${{ contains(github.event.head_commit.message, '[v691-native-path-once]') }}
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONPATH: runner;integration_probes;.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse exact published binary and compare only two v278 baseline paths
        run: |
          python -m pip install "py7zr>=1.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_v278_sealed_simc_consumable_native_pair.TwoNativeOptions.test_windows_long_paths_use_relative_io_without_repeating_native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python integration_probes/p1_v691_existing_v278_windows_path_once.py out/v691-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v691-existing-v278-path-only
          path: out/v691-path/V691_NATIVE_PATH_COMPARISON.json
          retention-days: 10
          if-no-files-found: warn
