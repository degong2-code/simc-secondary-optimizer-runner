name: P1 v690 ONE fresh extracted ZIP user browser source SimC adaptive result
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v690_one_zip_real_first_user_zero_history_once.yml
      - integration_probes/p1_v690_one_zip_first_user_zero_history_once.py
      - integration_probes/p1_v573_windows_zip_cold_web_setup_consent_once.py
      - tests/test_v690_visible_oil_user_contract.py
      - tests/test_v278_sealed_simc_consumable_native_pair.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v690-first-user-clean-windows-one-shot
  cancel-in-progress: false
jobs:
  one-real-zip-first-user:
    if: ${{ contains(github.event.head_commit.message, '[v690-cold-first-user-once]') }}
    runs-on: windows-2022
    timeout-minutes: 58
    env:
      PYTHONPATH: runner;integration_probes;.
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve real Git source byte identity
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The unchanged v181 legacy packaging contract requires the prior
      # sealed v213 *metadata source* during ZIP creation. This is historical
      # packaging data, NOT a new-season install or user runtime authority.
      # v690 quarantines all current_season_* files after extraction BEFORE
      # launching the user browser. No season measurement is copied.
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 41360273361
          name: v213-source-to-catalog-41360273361
          path: out/v690/legacy-package-only
          github-token: ${{ github.token }}
      - name: Validate legacy package-only source seal, never install as current season
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $raw=Join-Path $PWD 'out/v690/legacy-package-only/v213_current_season_source_to_catalog.json'
          if (!(Test-Path $raw -PathType Leaf)) { throw 'V690_V181_LEGACY_PACKAGE_CATALOG_MISSING' }
          Copy-Item $raw 'data/current_season_source_to_catalog.json' -Force
          python -c "import json,sys;sys.path.insert(0,'runner');import v213_source_to_catalog as v;d=json.load(open('data/current_season_source_to_catalog.json',encoding='utf8'));assert v.verify_catalog(d) and not d['automatic_ui_promotion'] and d['native_calls']==0 and d['network_calls']==0;print('V690_PACKAGE_ONLY_OLD_CATALOG_SEAL_VALID_NOT_LIVE')"
          if ($LASTEXITCODE -ne 0) { throw 'V690_UNVERIFIED_LEGACY_PACKAGE_SOURCE' }
      - name: Prepare exact source ZIP and CI Python Selenium harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V690_CI_HARNESS_REQUIREMENTS' }
          python -m py_compile integration_probes/p1_v573_windows_zip_cold_web_setup_consent_once.py integration_probes/p1_v690_one_zip_first_user_zero_history_once.py
          if ($LASTEXITCODE -ne 0) { throw 'V690_SYNTAX' }
          python -m unittest discover -s tests -p test_v690_visible_oil_user_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V690_VISIBLE_OIL_CONTRACT_PRECHECK' }
          python -m unittest -v tests.test_v278_sealed_simc_consumable_native_pair.TwoNativeOptions.test_windows_long_paths_use_short_temp_without_repeating_native
          if ($LASTEXITCODE -ne 0) { throw 'V693_SHORT_TEMP_CONTRACT_PRECHECK' }
          New-Item -ItemType Directory -Force out/v690 | Out-Null
          python integration_probes/v181_windows_beta_packager.py --legacy-source-catalog --out out/v690/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          if ($LASTEXITCODE -ne 0) { throw 'V690_CURRENT_HEAD_ZIP_PACKAGER' }
      - name: One contiguous real user new ZIP consent SimC auto install source build browser DPS
        shell: pwsh
        timeout-minutes: 51
        run: |
          $ErrorActionPreference='Stop'
          python -u integration_probes/p1_v690_one_zip_first_user_zero_history_once.py --zip out/v690/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip --out out/v690/receipt
          if ($LASTEXITCODE -ne 0) { throw 'V690_FIRST_REAL_USER_BLOCKER_IN_RECEIPT' }
      - name: Save bounded non-secret report only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v690-cold-new-windows-first-user-one-shot
          path: |
            out/v690/receipt/V690_FIRST_USER_ONE_ZIP_CONTIGUOUS.json
            out/v690/receipt/V573_WINDOWS_COLD_SETUP_EXPLICIT_CONSENT_COMPACT.json
          retention-days: 10
          if-no-files-found: warn

  v691-existing-v278-path-only:
    if: ${{ contains(github.event.head_commit.message, '[v691-native-path-once]') }}
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONPATH: runner;integration_probes;.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse exact published binary and compare only two v278 baseline paths
        run: |
          python -m pip install "py7zr>=1.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_v278_sealed_simc_consumable_native_pair.TwoNativeOptions.test_windows_long_paths_use_short_temp_without_repeating_native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python integration_probes/p1_v691_existing_v278_windows_path_once.py out/v691-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v691-existing-v278-path-only
          path: out/v691-path/V691_NATIVE_PATH_COMPARISON.json
          retention-days: 10
          if-no-files-found: warn

  v694-user-beta-package-only:
    if: ${{ contains(github.event.head_commit.message, '[v694-package-only]') }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: 624ee15221631176c18bb5473d02063a41778f3d
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 41360273361
          name: v213-source-to-catalog-41360273361
          path: out/v694/legacy-package-only
          github-token: ${{ github.token }}
      - name: Recreate tested ZIP and reproduce only the tested quarantine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'out/v694/legacy-package-only/v213_current_season_source_to_catalog.json' 'data/current_season_source_to_catalog.json'
          python integration_probes/v181_windows_beta_packager.py --legacy-source-catalog --out out/v694/tested-parent.zip
          if ($LASTEXITCODE -ne 0) { throw 'V694_EXISTING_PACKAGER_FAILED' }
          @'
          import fnmatch, hashlib, json, pathlib, zipfile
          out=pathlib.Path("out/v694")
          parent=out/"tested-parent.zip"
          sha=lambda b:hashlib.sha256(b).hexdigest()
          parent_sha=sha(parent.read_bytes())
          assert parent_sha=="6862a73920d3dd727b82e31f5b4069db9abbf17fcd61c5d39ae3c73d22567c4d", ("PARENT_ZIP_BYTES_DRIFT",parent_sha)
          prefix="SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA/"
          manifest_name=prefix+"V181_PACKAGE_MANIFEST.json"
          target=out/"SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA_V693_1_FIRST_USER.zip"
          def historical(path):
              p=pathlib.PurePosixPath(path)
              return ((p.parent.as_posix()=="data" and any(fnmatch.fnmatchcase(p.name,pattern)
                  for pattern in ("current_season_*.json","v202_*.json","v206_*.json")))
                  or (p.parent.as_posix()=="data/season_ordinary_gem_nominal" and p.suffix==".json"))
          with zipfile.ZipFile(parent) as z:
              m=json.loads(z.read(manifest_name))
              assert m["file_count"]==286
              removed=[r["path"] for r in m["files"] if historical(r["path"])]
              assert len(removed)==13
              kept=[r for r in m["files"] if r["path"] not in removed]
              m["files"]=kept; m["file_count"]=len(kept)
              m["package_variant"]="first_user_zero_history_candidate"
              m["tested_parent_zip_sha256"]=parent_sha
              m["historical_quarantined_paths"]=removed
              m["source_catalog"]=None
              with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=8,allowZip64=False) as dst:
                  for r in kept:
                      name=prefix+r["path"]
                      raw=z.read(name)
                      assert len(raw)==r["size"] and sha(raw)==r["sha256"]
                      dst.writestr(z.getinfo(name),raw,compress_type=zipfile.ZIP_DEFLATED,compresslevel=8)
                  dst.writestr(z.getinfo(manifest_name),(json.dumps(m,ensure_ascii=False,sort_keys=True,indent=2)+"\n").encode("utf8"),compress_type=zipfile.ZIP_DEFLATED,compresslevel=8)
          with zipfile.ZipFile(target) as z:
              assert set(z.namelist())=={prefix+r["path"] for r in kept}|{manifest_name}
              assert all(sha(z.read(prefix+r["path"]))==r["sha256"] for r in kept)
              assert z.testzip() is None
          receipt={"status":"FIRST_USER_BETA_PACKAGE_READY_FOR_PERSONAL_PC_REVIEW",
              "tested_source_head":"624ee15221631176c18bb5473d02063a41778f3d",
              "tested_run":45318051264,"tested_receipt_artifact":14886722098,
              "tested_parent_zip_sha256":parent_sha,"candidate_zip_sha256":sha(target.read_bytes()),
              "candidate_zip_bytes":target.stat().st_size,"unchanged_payload_files":len(kept),
              "excluded_historical_files":removed,"new_native_calls":0,
              "new_season_build_calls":0,"personal_pc_tested":False,
              "candidate_archive_reexecuted":False,"full_product_e2e":"PENDING"}
          (out/"V694_USER_BETA_PACKAGE_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n","utf8")
          print(json.dumps(receipt,sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'V694_PACKAGE_IDENTITY_FAILED' }
      - uses: actions/upload-artifact@v6
        with:
          name: p1-v694-first-user-beta-candidate
          path: |
            out/v694/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA_V693_1_FIRST_USER.zip
            out/v694/V694_USER_BETA_PACKAGE_RECEIPT.json
          retention-days: 14
          if-no-files-found: error

  v714-reuse-v713-package-only:
    if: ${{ contains(github.event.head_commit.message, '[v714-reuse-package-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6fa00b97acdc1bbcfbb2e9b4d4978de488c2bca7
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 45402566725
          name: v181-windows-source-beta-45402566725
          path: out/v714/parent
          github-token: ${{ github.token }}
      - name: Reuse the actual passed v713 archive, remove only v694 historical paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fnmatch, hashlib, json, pathlib, zipfile
          out=pathlib.Path("out/v714")
          parent=out/"parent/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip"
          sha=lambda b:hashlib.sha256(b).hexdigest()
          prefix="SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA/"
          manifest_name=prefix+"V181_PACKAGE_MANIFEST.json"
          target=out/"SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA_V713.zip"
          def historical(path):
              p=pathlib.PurePosixPath(path)
              return ((p.parent.as_posix()=="data" and any(fnmatch.fnmatchcase(p.name,pattern)
                  for pattern in ("current_season_*.json","v202_*.json","v206_*.json")))
                  or (p.parent.as_posix()=="data/season_ordinary_gem_nominal" and p.suffix==".json"))
          with zipfile.ZipFile(parent) as z:
              m=json.loads(z.read(manifest_name))
              rows=m["files"]
              assert m["file_count"]==len(rows)
              assert len({r["path"] for r in rows})==len(rows)
              assert set(z.namelist())=={prefix+r["path"] for r in rows}|{manifest_name}
              for r in rows:
                  raw=z.read(prefix+r["path"])
                  assert len(raw)==r["size"] and sha(raw)==r["sha256"],r["path"]
              # Prove the actual changed product files match the passed HEAD.
              for path in ("runner/webui/app.js","runner/v113_local_web_api.py",
                           "runner/v098_target_user_scenario_bootstrap.py",
                           "runner/v216_environment_build_coordinator.py"):
                  assert z.read(prefix+path)==pathlib.Path(path).read_bytes(),path
              removed=[r["path"] for r in rows if historical(r["path"])]
              assert "data/current_season_source_to_catalog.json" in removed
              kept=[r for r in rows if r["path"] not in removed]
              m["files"]=kept; m["file_count"]=len(kept)
              m["package_variant"]="first_user_zero_history_candidate"
              m["tested_parent_zip_sha256"]=sha(parent.read_bytes())
              m["historical_quarantined_paths"]=removed
              m["source_catalog"]=None
              with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=8,allowZip64=False) as dst:
                  for r in kept:
                      name=prefix+r["path"]
                      dst.writestr(z.getinfo(name),z.read(name),compress_type=zipfile.ZIP_DEFLATED,compresslevel=8)
                  dst.writestr(z.getinfo(manifest_name),(json.dumps(m,ensure_ascii=False,sort_keys=True,indent=2)+"\n").encode("utf8"),compress_type=zipfile.ZIP_DEFLATED,compresslevel=8)
          with zipfile.ZipFile(target) as z:
              assert set(z.namelist())=={prefix+r["path"] for r in kept}|{manifest_name}
              assert all(sha(z.read(prefix+r["path"]))==r["sha256"] for r in kept)
              assert z.testzip() is None
          receipt={"status":"V713_EXISTING_USER_REVIEW_CANDIDATE",
              "tested_source_head":"6fa00b97acdc1bbcfbb2e9b4d4978de488c2bca7",
              "tested_run":45402566725,"tested_parent_artifact":14924002391,
              "tested_parent_zip_sha256":sha(parent.read_bytes()),"candidate_zip_sha256":sha(target.read_bytes()),
              "candidate_zip_bytes":target.stat().st_size,"unchanged_payload_files":len(kept),
              "excluded_historical_files":removed,"new_native_calls":0,
              "new_season_build_calls":0,"personal_pc_tested":False,
              "new_special_runtime_verified":False,"candidate_archive_reexecuted":False,"full_product_e2e":"PENDING"}
          (out/"V714_V713_USER_REVIEW_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n","utf8")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: p1-v714-v713-existing-user-review
          path: |
            out/v714/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA_V713.zip
            out/v714/V714_V713_USER_REVIEW_RECEIPT.json
          retention-days: 14
          if-no-files-found: error
