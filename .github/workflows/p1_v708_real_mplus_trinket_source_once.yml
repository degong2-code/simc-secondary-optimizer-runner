name: P1 v708 one real 70961 M+ trinket coverage source-only
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v708_real_mplus_trinket_source_once.yml
      - integration_probes/p1_v708_real_mplus_trinket_source_once.py
permissions:
  contents: read
concurrency:
  group: p1-v708-70961-trinket-source-once
  cancel-in-progress: false
jobs:
  source-only:
    if: ${{ contains(github.event.head_commit.message, '[v708-source-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: runner:.
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: One original source-only observation
        run: |
          python -m py_compile integration_probes/p1_v708_real_mplus_trinket_source_once.py
          python -u integration_probes/p1_v708_real_mplus_trinket_source_once.py --out out/v708
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v708-real-mplus-trinket-coverage
          path: out/v708/V708_REAL_MPLUS_TRINKET_COVERAGE.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only public same-build DB2 raw for reuse
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v708-public-70961-db2-reuse
          path: |
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/wago/*.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/wago/receipt.json
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_gear_effect.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/.stage_receipts/fresh-wago-db2.json
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/.stage_receipts/season-gear-effect-raw.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
