name: P1 v708 one real 70961 M+ trinket coverage source-only
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v708_real_mplus_trinket_source_once.yml
      - integration_probes/p1_v708_real_mplus_trinket_source_once.py
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-v708-70961-trinket-source-once
  cancel-in-progress: false
jobs:
  source-only:
    if: ${{ contains(github.event.head_commit.message, '[v708-source-once]') || contains(github.event.head_commit.message, '[v709-reuse-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: runner:.
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse exact v708 public raw snapshot and sealed source receipts
        if: ${{ contains(github.event.head_commit.message, '[v709-reuse-once]') }}
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 45371957303
          name: p1-v708-public-70961-db2-reuse
          path: out/v708/runs/_fresh_season_sources/wago_12.1.5.70961
          github-token: ${{ github.token }}
      - name: Reuse exact v718 public bonus raw receipts
        if: ${{ contains(github.event.head_commit.message, '[v722-product-effect-replay]') }}
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 45431936045
          name: p1-v716-public-70961-bonus-source-reuse
          path: out/v708/runs/_fresh_season_sources/wago_12.1.5.70961
          github-token: ${{ github.token }}
      - name: One original source-only observation
        env:
          V722_PRODUCT_EFFECT_REPLAY: ${{ contains(github.event.head_commit.message, '[v722-product-effect-replay]') && '1' || '0' }}
          V716_BONUS_REVIEW: ${{ contains(github.event.head_commit.message, '[v716-bonus-review]') && '1' || '0' }}
          V709_REUSE_REQUIRED: ${{ contains(github.event.head_commit.message, '[v709-reuse-once]') && '1' || '0' }}
        run: |
          python -m py_compile integration_probes/p1_v708_real_mplus_trinket_source_once.py
          python -u integration_probes/p1_v708_real_mplus_trinket_source_once.py --out out/v708
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v708-real-mplus-trinket-coverage
          path: |
            out/v708/V708_REAL_MPLUS_TRINKET_COVERAGE.json
            out/v708/V723_EFFECT_STAGE_DIAGNOSTICS.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only public same-build DB2 raw for reuse
        if: ${{ always() && contains(github.event.head_commit.message, '[v708-source-once]') }}
        uses: actions/upload-artifact@v6
        with:
          name: p1-v708-public-70961-db2-reuse
          path: |
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/wago/*.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/wago/receipt.json
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_gear_effect.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/.stage_receipts/fresh-wago-db2.json
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/.stage_receipts/season-gear-effect-raw.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve newly needed public bonus raw tables and sealed receipts
        if: ${{ always() && contains(github.event.head_commit.message, '[v716-bonus-review]') }}
        uses: actions/upload-artifact@v6
        with:
          name: p1-v716-public-70961-bonus-source-reuse
          path: |
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_ItemXBonusTree.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_ItemBonusTreeNode.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_ItemBonusListGroupEntry.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/source/raw_ItemBonus.csv
            out/v708/runs/_fresh_season_sources/wago_12.1.5.70961/.stage_receipts/season-bonus-raw-*.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
  context-free-replay:
    if: ${{ contains(github.event.head_commit.message, '[v719-bonus-replay]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: runner:.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 45431936045
          name: p1-v716-public-70961-bonus-source-reuse
          path: out/v719/runs/_fresh_season_sources/wago_12.1.5.70961
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 45431936045
          name: p1-v708-real-mplus-trinket-coverage
          path: out/v719/prior
          github-token: ${{ github.token }}
      - run: python -u integration_probes/p1_v708_real_mplus_trinket_source_once.py --out out/v719 --replay-context-free
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v719-context-free-bonus-replay
          path: out/v719/V719_CONTEXT_FREE_BONUS_REPLAY.json
          if-no-files-found: warn
          retention-days: 30
