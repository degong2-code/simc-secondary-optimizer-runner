name: P1 v769 actual same-season incremental GJFO once
# One bounded post-v773.1 actual Build retry; existing diagnostic and acceptance contract unchanged.
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p1_v769_incremental_environment_once.yml
      - integration_probes/p1_v769_incremental_environment_once.py
      - integration_probes/p1_v802_selected_mixed_oil_once.py
      - integration_probes/p1_v813_oil_name_and_crafted_auto_t_once.py
      - runner/v484_exact_optional_consumable_source_join.py
permissions:
  contents: read
concurrency:
  group: p1-v769-incremental-environment-once
  cancel-in-progress: false
jobs:
  same-season-target-increment:
    if: contains(github.event.head_commit.message, '[v769-increment-once]') || contains(github.event.head_commit.message, '[v789-installed-defaults-once]')
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: 9933ffb946fb55b1fa66657b848f519ac19006e1
      SIMC_PINNED_GAME_BUILD: 12.1.5.70961
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve source byte identity
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Restore existing exact source-bound CLI only; no compilation
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Existing web requirements and syntax
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile integration_probes/p1_v769_incremental_environment_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing actual v113 Build; one installed-default verification or legacy increment
        timeout-minutes: 24
        env:
          INSTALLED_DEFAULTS_ONCE: ${{ contains(github.event.head_commit.message, '[v789-installed-defaults-once]') }}
        run: |
          $extra = @()
          if ($env:INSTALLED_DEFAULTS_ONCE -eq 'true') { $extra += '--installed-defaults-once' }
          python -u integration_probes/p1_v769_incremental_environment_once.py --simc .v618-simc-cache/simc.exe --identity .v618-simc-cache/identity.json --out out/v769 @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain compact receipt only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-v769-incremental-environment-verdict
          path: out/v769/V769_INCREMENTAL_ENVIRONMENT.json
          retention-days: 14
          if-no-files-found: warn

  profile-defaults-only:
    if: contains(github.event.head_commit.message, '[v784-defaults-once]')
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONPATH: runner;integration_probes;.
    steps:
      - name: Preserve source byte identity
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Restore existing exact CLI, never compile
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Existing web dependencies and syntax
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile integration_probes/p1_v769_incremental_environment_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One SimC profile generation, no Build or DPS
        timeout-minutes: 4
        run: |
          python -u integration_probes/p1_v769_incremental_environment_once.py --defaults-only --simc .v618-simc-cache/simc.exe --identity .v618-simc-cache/identity.json --out out/v784
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-v784-simc-profile-defaults
          path: out/v784/V784_SIMC_DEFAULTS.json
          if-no-files-found: warn
          retention-days: 30

  v802-selected-mixed-oil:
    if: contains(github.event.head_commit.message, '[v802-selected-oil-once]') || contains(github.event.head_commit.message, '[v803-selected-oil-diagnostic-once]') || contains(github.event.head_commit.message, '[v805-selected-oil-once]') || contains(github.event.head_commit.message, '[v806-selected-oil-once]') || contains(github.event.head_commit.message, '[v813-oil-name-craft-once]')
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONPATH: runner;integration_probes;.
      SIMC_PINNED_SOURCE_COMMIT: 9933ffb946fb55b1fa66657b848f519ac19006e1
      SIMC_PINNED_GAME_BUILD: 12.1.5.70961
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve source byte identity
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Restore existing exact CLI, no rebuild
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Existing web dependencies and syntax
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile integration_probes/p1_v802_selected_mixed_oil_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact selected longrun replay regressions before expensive Native
        run: |
          python -m unittest -v tests.test_v436_selected_v096_admission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One real selected mixed-level weapon and oil, two DPS cases, zero-Native replay
        if: ${{ !contains(github.event.head_commit.message, '[v813-oil-name-craft-once]') }}
        timeout-minutes: 33
        run: |
          python -u integration_probes/p1_v802_selected_mixed_oil_once.py --simc .v618-simc-cache/simc.exe --identity .v618-simc-cache/identity.json --out out/v802
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual named oil preparation and crafted auto T prerequisites
        if: contains(github.event.head_commit.message, '[v813-oil-name-craft-once]')
        run: |
          python -m pip install 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile integration_probes/p1_v813_oil_name_and_crafted_auto_t_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_v182_simple_user_inputs_offline.SelectedOilPreparationRouting tests.test_v285_consumable_weapon_source tests.test_p1_v568_first_user_environment_bridge_offline tests.test_v208_special_L_hydration_offline.OneExactSpecialHydration.test_crafted_only_fresh_delta_two_batches_then_cache_zero_L
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Crafted-only automatic T and two DPS cases; reuse v815 oil proof
        if: contains(github.event.head_commit.message, '[v813-oil-name-craft-once]')
        timeout-minutes: 33
        run: |
          python -u integration_probes/p1_v813_oil_name_and_crafted_auto_t_once.py --simc .v618-simc-cache/simc.exe --identity .v618-simc-cache/identity.json --out out/v813 --crafted-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always() && contains(github.event.head_commit.message, '[v813-oil-name-craft-once]')
        with:
          name: p1-v813-oil-name-craft-compact
          path: out/v813/V813_OIL_NAME_CRAFTED_AUTO_T.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always() && !contains(github.event.head_commit.message, '[v813-oil-name-craft-once]')
        with:
          name: p1-v802-one-selected-mixed-oil-verdict
          path: out/v802/V802_SELECTED_MIXED_OIL.json
          retention-days: 14
          if-no-files-found: warn
