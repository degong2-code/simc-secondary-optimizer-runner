# One actual NEW profile via original zero-history product Build and FastAPI.
# No historical HAE profile, no copied result cache, no all-26 sweep.
name: P2 one fresh Frost Mage 4-ordinary product user SimC E2E
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_fresh_profile_real_product_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-fresh-different-product-profile-once
  cancel-in-progress: false
jobs:
  fresh-user-native:
    if: contains(github.event.head_commit.message, '[p2-fresh-profile-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: runner:integration_probes:.
      P2_NEW_PRODUCT_PROFILE_ONCE: '1'
      P2_FRESH_PROFILE_CASE: frost_mage_4ordinary_T3300
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse same-build exact validated binary but NEVER old profile
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Exact binary check and dependencies before any Native
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m unittest -v tests.test_p2_fresh_user_profile_case_offline
          echo P2_NEW_PROFILE_NO_OLD_USER_INPUT_PREFLIGHT_PASS
      - name: Fresh v113/v216/v212 GJFO then v098/FastAPI/v291 REAL Frost DPS
        timeout-minutes: 20
        run: python -u integration_probes/p2_new_profile_product_e2e_once.py
      - name: Preserve fresh case exact SHA and original bounded Native bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-fresh-frost-mage-four-ordinary-real-native-evidence
          path: |
            p2_fresh_user_profile_e2e_receipt.json
            p2_new_frost_web_receipt.json
            p3_haj_web_native_evidence.zip
          if-no-files-found: ignore
          retention-days: 7
