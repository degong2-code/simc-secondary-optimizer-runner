# Exactly one new source-backed Destruction Warlock level-11 FINITE lattice
# scan. All originals checkpointed; candidate time cost is subordinate to
# complete coverage. Prior 520 run raw history is NOT imported as trusted cache.
name: P2 v307 full level11 real 2800 Native + exact raw checkpoint
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v307_full11_real_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v307-full11-exact-source-real-once
  cancel-in-progress: false
jobs:
  full-l11-source-real:
    if: contains(github.event.head_commit.message, '[p2-v307-full11-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Retrieve same approved Native binary, never historical character profile
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Preflight binary SHA, Python, full-level and exact checkpoint offline
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile runner/v307_dense_nested_coverage_grid.py runner/v308_dense_native_checkpoint.py
          python -m py_compile integration_probes/p2_v307_full_level11_real_once.py integration_probes/p2_v307_full11_checkpoint_always.py
          python -m unittest -v tests.test_v307_dense_full_level11_resume_audit tests.test_v308_dense_raw_checkpoint_offline
          echo P2_V307_FULL11_PRECHECK_PASSED_ZERO_NATIVE
      - name: Real 2800 Native calls - exact level11 full grid and 16 confirms
        timeout-minutes: 32
        env:
          P2_V307_FULL11_REAL_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v307_full_level11_real_once.py
      - name: Always snapshot complete original JSON2 and receipts, including partial
        if: always()
        timeout-minutes: 8
        run: python -u integration_probes/p2_v307_full11_checkpoint_always.py
      - name: Retain compact coverage result and raw checkpoint proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v307-full11-2800-compact-coverage-receipt
          path: |
            out/p2_v307_full11_real_once/receipt.json
            out/p2_v307_full11_real_once/all_accepted_compact_cases.jsonl
            out/p2_v307_full11_real_once/top_confirm_native_bytes.zip
            out/p2_v307_full11_real_once/full_original_v291_cases_proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve exact all-case Native source and JSON2 raw bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v307-full11-2800-raw-native-original-checkpoint
          path: out/p2_v307_full11_real_once/full_original_v291_cases.zip
          if-no-files-found: warn
          retention-days: 7
