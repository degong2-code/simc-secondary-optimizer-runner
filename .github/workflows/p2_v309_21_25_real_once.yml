# NEW 21 lattice 25% = original 2784 verified historical + 2169 NEW scouts.
# Strictly distinct Native identity: old 2800 are historical proofs only;
# new v309 17,076-run cap sealed from first phase. This workflow runs ONE
# new-user phase and saves exact original raw new Native checkpoint.
name: P2 v309 21 lattice 25pct new only source backed exact Native
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v309_21_25_real_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v309-new21-25pct-exact-origin
  cancel-in-progress: false
jobs:
  new21-origin-25:
    if: contains(github.event.head_commit.message, '[p2-v309-new21-25-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse approved pinned real SimC binary not an old profile
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Fetch ALL old 2800 original inputs JSON2 receipts - reference only
        uses: actions/download-artifact@v4
        with:
          run-id: 42814969237
          name: p2-v307-full11-2800-raw-native-original-checkpoint
          path: out/v309_origin11_raw
          github-token: ${{ github.token }}
      - name: Fetch origin11 fully accepted compact provenance + sha receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 42814969237
          name: p2-v307-full11-2800-compact-coverage-receipt
          path: out/v309_origin11_compact
          github-token: ${{ github.token }}
      - name: Full offline policy+artifact bootstrap validation before Native
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          test -f out/v309_origin11_raw/full_original_v291_cases.zip
          test -f out/v309_origin11_compact/receipt.json
          test -f out/v309_origin11_compact/all_accepted_compact_cases.jsonl
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile runner/v309_prior_anchored_level21_progressive.py
          python -m py_compile integration_probes/p2_v309_21grid_25percent_real_once.py integration_probes/p2_v309_checkpoint_always.py
          python -m unittest -v tests.test_v309_progressive_21_milestones_offline
          echo P2_V309_ORIGIN11_PRECHECK_PASS_NO_NEW_NATIVE
      - name: ONE real new 21 lattice 25percent - 2169 scouts +16 confirms
        timeout-minutes: 28
        env:
          P2_V309_NEW21_25_REAL_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v309_21grid_25percent_real_once.py
      - name: Export all accepted NEW exact original JSON2 cases even if partial
        if: always()
        timeout-minutes: 8
        run: python -u integration_probes/p2_v309_checkpoint_always.py
      - name: Persist compact result and raw-case SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v309-level21-25pct-new-only-compact-evidence
          path: |
            out/p2_v309_21_progressive_once/receipt.json
            out/p2_v309_21_progressive_once/new21_original_exact_checkpoint_proof.json
            out/p2_v309_21_progressive_once/product_workspace/*/generated/v291_longrun_17076/simc_results/V291_JOURNAL.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Persist new-source complete original new Native inputs JSON2 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v309-level21-25pct-new-only-raw-original-checkpoint
          path: out/p2_v309_21_progressive_once/new21_original_exact_native_checkpoint.zip
          if-no-files-found: warn
          retention-days: 7
