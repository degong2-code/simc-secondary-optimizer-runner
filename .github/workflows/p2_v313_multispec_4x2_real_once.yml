# Research-only 4 class/spec x 2 T/cap conditions. No Warlock/previous
# Native history passed as a seed. Each arm has <=1008 real cases, <=540s
# planning+SimC; real iterations and best precision-320 are logged separately.
# Products defaults and main never change. Expensive real cases are one-shot.
name: P2 v313 cross-spec 4x2 real adaptive Native comparison
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v313_multispec_4x2_real_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v313-cross-spec-4x2-native-research
  cancel-in-progress: false
jobs:
  multispec-real-native:
    if: contains(github.event.head_commit.message, '[p2-v313-4spec-8domains-native-once]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id:
          - frost_mage__wide
          - frost_mage__narrow
          - fury_warrior__wide
          - fury_warrior__narrow
          - beast_mastery_hunter__wide
          - beast_mastery_hunter__narrow
          - elemental_shaman__wide
          - elemental_shaman__narrow
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      P2_V313_CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Source-pinned original 70783 SimC binary (no duplicate build)
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Verify source, v313 offline matrix and Python compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile runner/v313_multispec_matrix_contract.py integration_probes/p2_v313_multispec_real_ab_once.py integration_probes/p2_v313_multispec_checkpoint_always.py integration_probes/p2_v313_multispec_aggregate_offline.py
          python -m unittest -v tests.test_v313_multispec_matrix_offline
          echo V313_CROSS_SPEC_PREFLIGHT_NO_NATIVE_PASS
      - name: Actual original SimC A/B with two independent source-sealed policies
        timeout-minutes: 23
        env:
          P2_V313_MULTISPEC_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v313_multispec_real_ab_once.py
      - name: SHA-verified original input.simc JSON2 and receipt checkpoint
        if: always()
        timeout-minutes: 7
        run: python -u integration_probes/p2_v313_multispec_checkpoint_always.py
      - name: Publish compact same-profile DPS SEM 95 and iterations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v313-multispec-${{ matrix.case_id }}-compact
          path: |
            out/p2_v313_multispec_matrix/${{ matrix.case_id }}/receipt.json
            out/p2_v313_multispec_matrix/${{ matrix.case_id }}/checkpoint_proof.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish v290 baseline full original native input JSON2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v313-${{ matrix.case_id }}-v290-native-original
          path: out/p2_v313_multispec_matrix/${{ matrix.case_id }}/v313_v290_original_original_native.zip
          retention-days: 7
          if-no-files-found: warn
      - name: Publish v312 candidate full original native input JSON2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v313-${{ matrix.case_id }}-v312-native-original
          path: out/p2_v313_multispec_matrix/${{ matrix.case_id }}/v313_v312_model_guided_original_native.zip
          retention-days: 7
          if-no-files-found: warn
  aggregate-across-specializations:
    if: always()
    needs: [multispec-real-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Download compact receipts from this run only
        uses: actions/download-artifact@v4
        with:
          pattern: v313-multispec-*-compact
          path: out/v313_collected
          merge-multiple: false
      - name: Fail closed on no original case source and summarize per-case normalized DPS
        env:
          PYTHONPATH: runner:integration_probes:.
        run: |
          python -u integration_probes/p2_v313_multispec_aggregate_offline.py --artifact-folder out/v313_collected --output out/v313_aggregate/summary.json
      - name: Preserve eight-case relative comparison and partial blocker list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v313-multispec-4x2-comparison-summary
          path: out/v313_aggregate/summary.json
          retention-days: 7
          if-no-files-found: warn
