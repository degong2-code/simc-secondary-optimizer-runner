# ONLY AFTER original v313 release: exact SAME workflow concurrency group.
# Each of 16 cases builds a NEW user source profile from verified same-season
# inputs; neither existing completed .simc nor historical Native DPS is imported.
# 8 requested DPS specs x 2 distributions, max1008 calls/540s per policy.
# All native inputs/JSON2/receipts are preserved for scoped audit.
name: P2 v314 eight FRESH profiles x2 Native comparison AFTER v313
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v314_eight_fresh_specs_after_v313.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v313-cross-spec-4x2-native-research
  cancel-in-progress: false
jobs:
  multispec-real-native:
    if: contains(github.event.head_commit.message, '[p2-v314-8freshspecs-16domains-after-v313-once]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id:
          - marksmanship_hunter__wide
          - marksmanship_hunter__narrow
          - beast_mastery_hunter__wide
          - beast_mastery_hunter__narrow
          - arcane_mage__wide
          - arcane_mage__narrow
          - frost_mage__wide
          - frost_mage__narrow
          - fire_mage__wide
          - fire_mage__narrow
          - frost_death_knight__wide
          - frost_death_knight__narrow
          - subtlety_rogue__wide
          - subtlety_rogue__narrow
          - assassination_rogue__wide
          - assassination_rogue__narrow
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      P2_V314_CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Source-pinned original 70783 SimC binary (no duplicate build)
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Verify source, v314 offline matrix and Python compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile runner/v314_fresh_eight_spec_matrix_contract.py integration_probes/p2_v314_new_profiles_real_ab_once.py integration_probes/p2_v314_new_profiles_checkpoint_always.py integration_probes/p2_v314_new_profiles_aggregate_offline.py
          python -m unittest -v tests.test_v314_fresh_eight_specs_offline
          echo V314_CROSS_SPEC_PREFLIGHT_NO_NATIVE_PASS
      - name: Actual original SimC A/B with two independent source-sealed policies
        timeout-minutes: 23
        env:
          P2_V314_MULTISPEC_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v314_new_profiles_real_ab_once.py
      - name: SHA-verified original input.simc JSON2 and receipt checkpoint
        if: always()
        timeout-minutes: 7
        run: python -u integration_probes/p2_v314_new_profiles_checkpoint_always.py
      - name: Publish compact same-profile DPS SEM 95 and iterations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v314-multispec-${{ matrix.case_id }}-compact
          path: |
            out/p2_v314_multispec_matrix/${{ matrix.case_id }}/receipt.json
            out/p2_v314_multispec_matrix/${{ matrix.case_id }}/checkpoint_proof.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish v290 baseline full original native input JSON2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v314-${{ matrix.case_id }}-v290-native-original
          path: out/p2_v314_multispec_matrix/${{ matrix.case_id }}/v314_v290_original_original_native.zip
          retention-days: 3
          if-no-files-found: warn
      - name: Publish v312 candidate full original native input JSON2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v314-${{ matrix.case_id }}-v312-native-original
          path: out/p2_v314_multispec_matrix/${{ matrix.case_id }}/v314_v312_model_guided_original_native.zip
          retention-days: 3
          if-no-files-found: warn
  aggregate-across-specializations:
    if: always()
    needs: [multispec-real-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Download compact receipts from this run only
        uses: actions/download-artifact@v4
        with:
          pattern: v314-multispec-*-compact
          path: out/v314_collected
          merge-multiple: false
      - name: Fail closed on no original case source and summarize per-case normalized DPS
        env:
          PYTHONPATH: runner:integration_probes:.
        run: |
          python -u integration_probes/p2_v314_new_profiles_aggregate_offline.py --artifact-folder out/v314_collected --output out/v314_aggregate/summary.json
      - name: Preserve eight-case relative comparison and partial blocker list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v314-multispec-8x2-comparison-summary
          path: out/v314_aggregate/summary.json
          retention-days: 7
          if-no-files-found: warn
