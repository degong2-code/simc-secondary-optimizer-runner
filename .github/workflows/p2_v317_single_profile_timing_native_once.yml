# Exactly ONE user-like fresh profile, 12 bounded DPS Native max.
# v316 telemetry opt-in only, no optimizer policy change or hard 10m cutoff.
name: P2 v317 one fresh Arms real Native v316 timing probe
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v317_single_profile_timing_native_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v317-single-v316-trace-real-native
  cancel-in-progress: false
jobs:
  single-native-trace:
    if: contains(github.event.head_commit.message, '[p2-v317-single-trace-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Fetch original exact validated 70783 SimC binary
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Verify binary and offline ONE-case guard before Native
        shell: bash
        run: |
          set -euo pipefail
          test -f out/binary/simc
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile integration_probes/p2_v317_single_profile_time_trace_real_once.py tests/test_p2_v317_single_profile_time_trace_offline.py
          python -m unittest -v tests.test_p2_v317_single_profile_time_trace_offline tests.test_v316_optin_case_time_trace_offline
          echo P2_V317_SOURCE_GUARD_OFFLINE_PASS_BEFORE_NATIVE
      - name: Real source-backed new Arms profile and exact 12-or-fewer Native trace
        timeout-minutes: 32
        env:
          P2_V317_SINGLE_TRACE_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v317_single_profile_time_trace_real_once.py
      - name: Retain only user-like research receipt and original 12-case ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v317-one-case-original-native-trace-receipt
          path: |
            out/p2_v317_single_real_trace/receipt.json
            out/p2_v317_single_real_trace/original_native_and_timing.zip
          retention-days: 7
          if-no-files-found: warn
