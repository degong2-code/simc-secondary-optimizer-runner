name: P2 v320 idea001 SEM tier advisory focused offline
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v320_sem_tier_advisory_offline.yml]
permissions:
  contents: read
concurrency:
  group: p2-v320-sem-tier-offline-only
  cancel-in-progress: false
jobs:
  focused-offline:
    if: contains(github.event.head_commit.message, '[p2-v320-sem-tier-offline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: runner:integration_probes:.
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-web-test.txt
      - name: Focused real-sample math and current v291 120-block guard, Native0
        run: |
          set -euo pipefail
          python -m py_compile runner/v320_idea001_sem_tier_advisory.py tests/test_p2_v320_sem_tier_advisory_offline.py
          python -m unittest -v tests.test_p2_v320_sem_tier_advisory_offline tests.test_p2_v318_sem_precision_optin_offline tests.test_p2_v319_new_windwalker_ab_offline tests.test_p3_hw_multiscale_policy
          python tools/check_development_ledger.py
          echo P2_V320_SEM_TIER_ADVISORY_OFFLINE_NATIVE0_COMPLETE
