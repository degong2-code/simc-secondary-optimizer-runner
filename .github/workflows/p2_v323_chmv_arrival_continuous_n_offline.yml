name: P2 v323 CHMV arrival and variable N research offline
# v323-v2: same CHMV must not create false DPS-gap N decisions.
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v323_chmv_arrival_continuous_n_offline.yml]
permissions:
  contents: read
jobs:
  focused:
    if: contains(github.event.head_commit.message, '[p2-v323-arrival-n-offline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: runner:integration_probes:.
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-web-test.txt
      - name: Source trace arrival, continuous N; older v290/v318/v319 regressions, Native0
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile runner/v322_verified_chmv_arrival.py runner/v323_continuous_n_sem_wall_advisory.py tests/test_p2_v323_chmv_arrival_and_n_offline.py
          python -m unittest -v tests.test_p2_v323_chmv_arrival_and_n_offline tests.test_p2_v320_sem_tier_advisory_offline tests.test_p2_v318_sem_precision_optin_offline tests.test_p2_v319_new_windwalker_ab_offline
          python tools/check_development_ledger.py
