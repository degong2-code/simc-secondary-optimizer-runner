# One genuine new warlock/affliction user; v290/v318 64 source checks, then
# source-identical v306/v328 two region arms each 64 calls / 4520 iterations.
# Additional distinct top-2 CHMV each N640x2 holdout after source SHA seal.
name: P2 v329 IDEA-002 NEW Affliction v306-v328 equal-iteration Native AB
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v329_idea002_fresh_affliction_native_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v329-idea002-new-affliction-native
  cancel-in-progress: false
jobs:
  idea002-new-affliction:
    if: contains(github.event.head_commit.message, '[p2-v329-idea002-affliction-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse exact SHA-verified same-build SimC binary
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Preflight fresh Affliction, v328, v306/v291/cache regressions Native0
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile integration_probes/p2_v329_affliction_new_user_idea002_real_once.py tests/test_p2_v329_affliction_idea002_offline.py
          python -m unittest -v tests.test_p2_v329_affliction_idea002_offline tests.test_p2_v328_idea002_radius_offline tests.test_p2_v306_seed_retained_offline tests.test_p2_v306_new_user_equal_offline tests.test_p2_v319_new_windwalker_ab_offline tests.test_p2_v318_sem_precision_optin_offline
          python tools/check_development_ledger.py
      - name: P1 new Affliction + equal-iteration measured 2-policy region ablation
        timeout-minutes: 48
        env:
          P2_V329_IDEA002_FRESH_AFFLICTION_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v329_affliction_new_user_idea002_real_once.py
      - name: Retain original input JSON2 source journaling and independent holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v329-new-affliction-autoT-idea002-v306-v328-native
          path: |
            out/p2_v329_new_affliction_idea002/receipt.json
            out/p2_v329_new_affliction_idea002/IDEA002_PROGRESS.json
            out/p2_v329_new_affliction_idea002/*_original_native.zip
            out/p2_v329_new_affliction_idea002/independent_640_holdout_original.zip
            out/p2_v329_new_affliction_idea002/holdout_new_native/
          retention-days: 7
          if-no-files-found: warn
