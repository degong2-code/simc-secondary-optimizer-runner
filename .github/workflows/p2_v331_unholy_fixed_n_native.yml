name: P2 v331 final fixed N fresh Unholy real v290 comparison
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p2_v331_unholy_fixed_n_native.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-v331-unholy-fixed-n
  cancel-in-progress: false
jobs:
  native:
    if: contains(github.event.head_commit.message, '[p2-v331-fixed-n-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: runner:integration_probes:.
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Exact existing verified SimC binary
        uses: actions/download-artifact@v4
        with:
          run-id: 42552942329
          name: p3-har-verified-source-new-binary-short-lived
          path: out/binary
          github-token: ${{ github.token }}
      - name: Focused fixed-N preflight Native0
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum out/binary/simc | cut -d' ' -f1)" = "6b83e4d5d2216faf91511fb00ae712cdf4cc0224b0c83107e8c9c7358c24bfc6"
          chmod +x out/binary/simc
          python -m pip install -r requirements-web-test.txt
          python -m py_compile integration_probes/p2_v331_unholy_fixed_N_real_once.py runner/v291_durable_multiscale_native_runner.py integration_probes/p2_v319_new_windwalker_v290_v318_real_once.py
          python -m unittest -v tests.test_p2_v331_fixed_N_offline tests.test_p2_v319_new_windwalker_ab_offline tests.test_p2_v330_fresh_feral_fork_offline tests.test_p2_v330_idea003_stratified_offline
          python tools/check_development_ledger.py
      - name: Fresh product source and five fixed N v290 arms
        timeout-minutes: 30
        env:
          P2_V331_FIXED_N_ONCE: '1'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python -u integration_probes/p2_v331_unholy_fixed_N_real_once.py
      - name: Preserve complete exact original cases and independent holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v331-fresh-unholy-fixed-N-real
          path: |
            out/p2_v331_unholy_fixed_N/receipt.json
            out/p2_v331_unholy_fixed_N/FIXED_N_PROGRESS.json
            out/p2_v331_unholy_fixed_N/HOLDOUT_PROGRESS.json
            out/p2_v331_unholy_fixed_N/N*/
            out/p2_v331_unholy_fixed_N/holdout/
          retention-days: 7
          if-no-files-found: warn
