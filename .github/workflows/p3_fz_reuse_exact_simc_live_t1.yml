# P3-GH: one bounded live 70783 T1, sealed F/O precombat source reuses original v269/v278.
# Reuse existing P3-FW CLI, no new SimC build, no all-spec Native sweep.
# If a source timeout recurs, report the first owner; no automatic retry.
name: P3-FZ reuse exact 70783 CLI for one real zero-history T1 (one-shot)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/requests/p3_gp_f_only_once_20261106.json
  workflow_dispatch:
    inputs:
      exact_flask_item_id:
        description: "Optional same-build physical highest-quality flask ItemID; original v281 verifies it"
        required: false
        type: string
        default: "241324"
      existing_special_gem_id:
        description: "Optional already-selected gem ItemID; never probes gem effect"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: p3-fz-one-shot-live-t1
  cancel-in-progress: false
jobs:
  original-v216-once:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p3-gp-f-only-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      PYTHONPATH: runner:.
      P3_T1_EXACT_FLASK_ITEM_ID: ${{ github.event_name == 'push' && '241324' || inputs.exact_flask_item_id }}
      P3_T1_EXISTING_SPECIAL_GEM_ID: ${{ inputs.existing_special_gem_id }}
      P3_T1_F_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_PINNED_BINARY_SHA256: 980ed4640cecc3ed78b34ed0dc0363dbff2ed7d703174e9cc01f09d18570d36b
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Fail closed on any nonexact P3-GP one-shot push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" =             "integration_probes/requests/p3_gp_f_only_once_20261106.json"
          python3 - <<'PY'
          import json,pathlib
          value=json.loads(pathlib.Path(
            "integration_probes/requests/p3_gp_f_only_once_20261106.json").read_text())
          expected={
            "schema":"p3_gp_one_source_verified_flask_native_once_v1",
            "build":"12.1.5.70783",
            "selected_flask_item_id":241324,
            "source_owner":"EXISTING_V216_V281_V278",
            "max_new_F_native_calls":2,
            "G_native_requested":False,
            "gem_effect_validation":False,
            "complete_GJFO_ready_claim":False,
            "no_new_simc_binary_compile":True,
            "no_main_merge":True}
          assert value==expected,(value,expected)
          print("P3_GP_EXACT_SOURCE_SCOPED_ONE_SHOT_CONFIRMED")
          PY
      - name: Verify existing authenticated season inputs before artifact retrieval
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLIZZARD_CLIENT_ID" && test -n "$BLIZZARD_CLIENT_SECRET" &&
          test -n "$WCL_CLIENT_ID" && test -n "$WCL_CLIENT_SECRET" ||
          { echo "P3_FZ_SEASON_CREDENTIALS_MISSING"; exit 2; }
      - name: Reuse previous successful P3-FW CLI artifact (no compile)
        uses: actions/download-artifact@v4
        with:
          name: p3-fw-exact-simc-cli-70783
          run-id: 42140062861
          github-token: ${{ github.token }}
          path: .p3-fz-tools
      - name: Check exact binary bytes before running original v216
        shell: bash
        run: |
          set -euo pipefail
          test -f .p3-fz-tools/simc
          SHA="$(sha256sum .p3-fz-tools/simc | cut -d' ' -f1)"
          test "$SHA" = "$SIMC_PINNED_BINARY_SHA256" ||
          { echo "P3_FZ_PRIOR_BINARY_SHA_MISMATCH"; exit 2; }
          chmod +x .p3-fz-tools/simc
          echo "SIMC_CLI_WRAPPER=$GITHUB_WORKSPACE/.p3-fz-tools/simc" >> "$GITHUB_ENV"
          echo "P3_FZ_EXISTING_BINARY_SHA_VERIFIED"
      - name: Original v216 current-Retail zero-history Build, optional exact F single item
        shell: bash
        timeout-minutes: 19
        env:
          SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
        run: python -u integration_probes/p3_fr_zero_base_t1_acceptance.py
      - name: Retain factual small receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-fz-exact-binary-zero-history-t1-receipt
          path: |
            p3_fr_zero_base_t1_receipt.json
            p3_fr_zero_base_t1_native_evidence.zip
          if-no-files-found: ignore
          retention-days: 7
