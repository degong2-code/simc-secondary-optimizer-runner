                "weapon_imbues_instead_of_oil":True,
                "permanent_enchants":False,
                "selected_special_equipment":False,
                "longrun_backend":"v291",
                "resume_and_cache_replay_required":True,
                "global_optimum_proven":False}
          if had:
              expected.update({
                "schema":"p3_had_v291_real_eight_native_resume_v1",
                "adaptive_dps_native_max":8,
                "longrun_total_native_budget":12,
                "native_batches":[4,4],
                "strict_final_half_cap":True})
          if hae:
              expected.update({
                "schema":"p3_hae_v291_real_ten_native_precision_v1",
                "adaptive_dps_native_max":10,
                "longrun_total_native_budget":12,
                "native_batches":[4,6],
                "strict_final_half_cap":True,
                "confirmation_iterations":320})
          if hag:
              expected.update({
                "schema":"p3_hag_v292_real_archive_cross_job_zero_dps_native_v1",
                "adaptive_dps_native_max":0,
                "longrun_total_native_budget":12,
                "imported_native_cases":10,
                "new_dps_native_calls":0,
                "original_archive_sha256":"c53dc09015377ccaf3d53f24bb85950e3999efacecc629be756b9f8856ef5fa9",
                "strict_final_half_cap":True,
                "selected_pair_seed_provenance_required":True})
          if haj:
              expected.update({
                "schema":"p3_haj_one_current_source_real_local_web_native_v1",
                "adaptive_dps_native_max":4,
                "user_class":"paladin","user_spec":"retribution",
                "local_web_backend":"v113_v293_v291",
                "max_native_calls":12,
                "first_batch":1,"resume_batch_max":2,
                "cache_only_new_native_calls":0,
                "real_browser_click_tested":False,
                "strict_final_half_cap":True})
          assert got==expected,(got,expected)
          print("P3_HAJ_REAL_LOCAL_HTTP_NATIVE_E2E" if haj else
                "P3_HAG_V292_REAL_CROSS_JOB_PORTABLE_ZERO_DPS_NATIVE" if hag else
                "P3_HAE_V291_TEN_NATIVE_PRECISION_ONCE" if hae else
                "P3_HAD_V291_EIGHT_NATIVE_RESUME_E2E_ONCE" if had else
                "P3_HY_V291_NATIVE_RESUME_E2E_ONCE" if hy else
                "P3_HV_OPT_IN_AXIS_COVERAGE_DPS_ONCE" if hv else
                "P3_HU_FULL_NONENCHANTED_DPS_ONCE" if hu else
                "P3_HS_OTHER_SPEC_REAL_DPS_E2E_ONCE" if hs else
                "P3_HO_ONE_USER_DPS_E2E_ONCE" if ho else
                "P3_GU_J_SOCKET_SOURCE_NO_NATIVE" if gu else
                "P3_EXACT_ORIGINAL_GJF_ONE_SHOT" if gq else
                "P3_GP_EXACT_SOURCE_SCOPED_ONE_SHOT_CONFIRMED")
          PY
      - name: Verify existing authenticated season inputs before artifact retrieval
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLIZZARD_CLIENT_ID" && test -n "$BLIZZARD_CLIENT_SECRET" &&
          test -n "$WCL_CLIENT_ID" && test -n "$WCL_CLIENT_SECRET" ||
          { echo "P3_FZ_SEASON_CREDENTIALS_MISSING"; exit 2; }
      - name: Reuse previous successful P3-FW CLI artifact (no compile)
        uses: actions/download-artifact@v4
        with:
          name: p3-fw-exact-simc-cli-70783
          run-id: 42140062861
          github-token: ${{ github.token }}
          path: .p3-fz-tools
      - name: Retrieve exact real HAE Native evidence for P3-HAG only
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]')
        uses: actions/download-artifact@v4
        with:
          name: p3-fz-exact-binary-zero-history-t1-receipt
          run-id: 42501052586
          github-token: ${{ github.token }}
          path: .p3-hag-origin
      - name: Check exact binary bytes before running original v216
        shell: bash
        run: |
          set -euo pipefail
          test -f .p3-fz-tools/simc
          SHA="$(sha256sum .p3-fz-tools/simc | cut -d' ' -f1)"
          test "$SHA" = "$SIMC_PINNED_BINARY_SHA256" ||
          { echo "P3_FZ_PRIOR_BINARY_SHA_MISMATCH"; exit 2; }
          chmod +x .p3-fz-tools/simc
          echo "SIMC_CLI_WRAPPER=$GITHUB_WORKSPACE/.p3-fz-tools/simc" >> "$GITHUB_ENV"
