# P3-GH: one bounded live 70783 T1, sealed F/O precombat source reuses original v269/v278.
# Reuse existing P3-FW CLI, no new SimC build, no all-spec Native sweep.
# If a source timeout recurs, report the first owner; no automatic retry.
name: P3-FZ reuse exact 70783 CLI for one real zero-history T1 (one-shot)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/requests/p3_gp_f_only_once_20261106.json
      - integration_probes/requests/p3_gq_gjf_one_shot_20261107.json
      - integration_probes/requests/p3_gu_j_socket_source_once_20261107.json
      - integration_probes/requests/p3_ho_one_user_dps_20261108.json
      - integration_probes/requests/p3_hs_other_spec_user_dps_20261108.json
      - integration_probes/requests/p3_hu_full_no_enchants_20261108.json
      - integration_probes/requests/p3_hv_axis_coverage_dps_20261108.json
      - integration_probes/requests/p3_hy_longrun_three_native_20261108.json
      - integration_probes/requests/p3_had_eight_native_20261109.json
      - integration_probes/requests/p3_hae_ten_native_20261109.json
      - integration_probes/requests/p3_hag_portable_cache_once_20261109.json
      - integration_probes/requests/p3_haj_real_web_native_once_20261109.json
  workflow_dispatch:
    inputs:
      exact_flask_item_id:
        description: "Optional same-build physical highest-quality flask ItemID; original v281 verifies it"
        required: false
        type: string
        default: "241324"
      existing_special_gem_id:
        description: "Optional already-selected gem ItemID; never probes gem effect"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: p3-fz-one-shot-live-t1
  cancel-in-progress: false
jobs:
  original-v216-once:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p3-gp-f-only-once]') || contains(github.event.head_commit.message, '[p3-gq-gjf-once]') || contains(github.event.head_commit.message, '[p3-gu-j-socket-source-once]') || contains(github.event.head_commit.message, '[p3-ho-one-user-dps-once]') || contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      PYTHONPATH: runner:.
      P3_T1_EXACT_FLASK_ITEM_ID: ${{ github.event_name == 'push' && '241324' || inputs.exact_flask_item_id }}
      P3_T1_EXISTING_SPECIAL_GEM_ID: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-gq-gjf-once]') || contains(github.event.head_commit.message, '[p3-gu-j-socket-source-once]') || contains(github.event.head_commit.message, '[p3-ho-one-user-dps-once]') || (contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || (contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]'))))))))) && '240967' || inputs.existing_special_gem_id }}
      P3_T1_J_SOCKET_SOURCE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-gu-j-socket-source-once]') && '1' || '0' }}
      P3_T1_F_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-gp-f-only-once]') && '1' || '0' }}
      P3_T1_DPS_E2E_ONCE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-ho-one-user-dps-once]') || (contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || (contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]'))))))))) && '1' || '0' }}
      P3_T1_SPEC_CLASS: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || (contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]')))))))) && 'shaman' || 'paladin' }}
      P3_T1_SPEC_NAME: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || (contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]')))))))) && 'enhancement' || 'retribution' }}
      P3_T1_SPEC_RACE: dwarf
      P3_T1_FULL_CONSUMABLES_ONCE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || (contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') || (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]'))))))) && '1' || '0' }}
      P3_T1_V291_LONGRUN_NATIVE_ONCE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-hy-longrun-three-native-once]') || (contains(github.event.head_commit.message, '[p3-had-eight-native-once]') || (contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') || (contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') || contains(github.event.head_commit.message, '[p3-haj-web-native-once]'))))) && '1' || '0' }}
      P3_T1_V291_EIGHT_NATIVE_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-had-eight-native-once]') && '1' || '0' }}
      P3_T1_V291_TEN_NATIVE_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-hae-ten-native-once]') && '1' || '0' }}
      P3_T1_WEB_LONGRUN_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-haj-web-native-once]') && '1' || '0' }}
      P3_T1_V292_PORTABLE_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-hag-portable-cache-once]') && '1' || '0' }}
      P3_T1_AXIS_COVERAGE_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]') && '1' || '0' }}
      P3_T1_FULL_FOOD: harandar_celebration
      P3_T1_FULL_POTION: potion_of_recklessness_2
      P3_T1_FULL_AUGMENTATION: void_touched
      P3_T1_FULL_OMNIUM: '136822:1/136823:1/136817:1/136821:1/136814:1'
      P3_T1_DPS_NATIVE_AUDIT_ONCE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[p3-hs-other-spec-dps-once]') || (contains(github.event.head_commit.message, '[p3-hu-full-nonenchant-dps-once]') || contains(github.event.head_commit.message, '[p3-hv-axis-coverage-dps-once]'))) && '1' || '0' }}
      SIMC_PINNED_SOURCE_COMMIT: c20e2ad52e4c33711f74272309a5748125175fe8
      SIMC_PINNED_GAME_BUILD: 12.1.5.70783
      SIMC_PINNED_BINARY_SHA256: 980ed4640cecc3ed78b34ed0dc0363dbff2ed7d703174e9cc01f09d18570d36b
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Fail closed on any nonexact P3-GP one-shot push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          files=subprocess.check_output(["git","diff-tree","--no-commit-id",
              "--name-only","-r","HEAD"],text=True).splitlines()
          msg=subprocess.check_output(["git","log","-1","--pretty=%s"],
              text=True).strip()
          gp="[p3-gp-f-only-once]" in msg
          gq="[p3-gq-gjf-once]" in msg
          gu="[p3-gu-j-socket-source-once]" in msg
          ho="[p3-ho-one-user-dps-once]" in msg
          hs="[p3-hs-other-spec-dps-once]" in msg
          hu="[p3-hu-full-nonenchant-dps-once]" in msg
          hv="[p3-hv-axis-coverage-dps-once]" in msg
          hy="[p3-hy-longrun-three-native-once]" in msg
          had="[p3-had-eight-native-once]" in msg
          hae="[p3-hae-ten-native-once]" in msg
          hag="[p3-hag-portable-cache-once]" in msg
          haj="[p3-haj-web-native-once]" in msg
          assert sum((gp,gq,gu,ho,hs,hu,hv,hy,had,hae,hag,haj))==1,"P3_EXACT_ONE_SHOT_MARKER_REQUIRED"
          path=("integration_probes/requests/p3_gp_f_only_once_20261106.json"
                if gp else
                "integration_probes/requests/p3_gq_gjf_one_shot_20261107.json"
                if gq else
                "integration_probes/requests/p3_gu_j_socket_source_once_20261107.json"
                if gu else
                "integration_probes/requests/p3_ho_one_user_dps_20261108.json"
                if ho else
                "integration_probes/requests/p3_hs_other_spec_user_dps_20261108.json"
                if hs else
                "integration_probes/requests/p3_hu_full_no_enchants_20261108.json"
                if hu else
                "integration_probes/requests/p3_hv_axis_coverage_dps_20261108.json"
                if hv else
                "integration_probes/requests/p3_hy_longrun_three_native_20261108.json" if hy else
                "integration_probes/requests/p3_had_eight_native_20261109.json" if had else
                "integration_probes/requests/p3_hae_ten_native_20261109.json" if hae else
                "integration_probes/requests/p3_hag_portable_cache_once_20261109.json" if hag else
                "integration_probes/requests/p3_haj_real_web_native_once_20261109.json")
          assert files==[path],files
          got=json.loads(pathlib.Path(path).read_text())
          common={"build":"12.1.5.70783",
                  "selected_flask_item_id":241324,
                  "no_new_simc_binary_compile":True,
                  "no_main_merge":True}
          if gp:
              expected={**common,
                "schema":"p3_gp_one_source_verified_flask_native_once_v1",
                "source_owner":"EXISTING_V216_V281_V278",
                "max_new_F_native_calls":2,
                "G_native_requested":False,"gem_effect_validation":False,
                "complete_GJFO_ready_claim":False}
          elif gq:
              expected={**common,
                "schema":"p3_gq_one_combined_original_G_J_F_source_once_v1",
                "existing_selected_special_gem_id":240967,
                "four_ordinary_dual_stat_types":["crit","haste","mastery","versatility"],
                "special_gem_effect_independently_checked":False,
                "same_season_original_J_socket_source_required":True,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "official_ready_only_if_original_v212_installed":True,
                "no_external_F_rating_injection":True}
          elif gu:
              expected={**common,
                "schema":"p3_gu_same_build_J_socket_source_only_v1",
                "existing_selected_special_gem_id":240967,
                "four_ordinary_dual_stat_types":["crit","haste","mastery","versatility"],
                "reused_collectors":["v161","v221","v266","v280","v232"],
                "G_native_max":0,"F_native_max":0,"O_native_max":0,
                "no_external_F_rating_injection":True,
                "no_j_socket_admission_without_season_proof":True,
                "official_ready_claim":False}
          elif ho:
              expected={**common,
                "schema":"p3_ho_real_one_user_dps_e2e_v1",
                "existing_selected_special_gem_id":240967,
                "target_ilevel":334,"user_class":"paladin",
                "user_spec":"retribution","declared_socket_count":5,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "adaptive_dps_native_max":6,
                "existing_v216_v212_v098_v096_v094_only":True,
                "separate_gem_effect_gate":False,
                "product_ready_and_user_dps_require_real_native":True}
          elif hs:
              expected={**common,
                "schema":"p3_hs_other_spec_zero_history_dps_e2e_v1",
                "existing_selected_special_gem_id":240967,
                "target_ilevel":334,"user_class":"shaman",
                "user_spec":"enhancement","user_race":"dwarf",
                "declared_socket_count":5,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "adaptive_dps_native_max":6,
                "existing_v216_v212_v098_v096_v094_only":True,
                "separate_gem_effect_gate":False,
                "product_ready_and_user_dps_require_real_native":True}
          elif hu:
              expected={**common,
                "schema":"p3_hu_full_shaman_no_permanent_enchants_v1",
                "existing_selected_special_gem_id":240967,
                "target_ilevel":334,"user_class":"shaman",
                "user_spec":"enhancement","user_race":"dwarf",
                "declared_socket_count":5,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "adaptive_dps_native_max":6,
                "food":"harandar_celebration",
                "potion":"potion_of_recklessness_2",
                "augmentation":"void_touched",
                "omnium_talents":"136822:1/136823:1/136817:1/136821:1/136814:1",
                "weapon_imbues_instead_of_oil":True,
                "permanent_enchants":False,
                "selected_special_equipment":False,
                "existing_v216_v212_v098_v096_v094_only":True,
                "product_ready_and_user_dps_require_real_native":True}
          elif hv:
              expected={**common,
                "schema":"p3_hv_opt_in_axis_coverage_full_shaman_v1",
                "existing_selected_special_gem_id":240967,
                "target_ilevel":334,"user_class":"shaman",
                "user_spec":"enhancement","user_race":"dwarf",
                "declared_socket_count":5,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "adaptive_dps_native_max":6,
                "food":"harandar_celebration",
                "potion":"potion_of_recklessness_2",
                "augmentation":"void_touched",
                "omnium_talents":"136822:1/136823:1/136817:1/136821:1/136814:1",
                "weapon_imbues_instead_of_oil":True,
                "permanent_enchants":False,
                "selected_special_equipment":False,
                "exploration_policy":"axis_coverage_v1",
                "existing_v216_v212_v098_v096_v094_only":True,
                "product_ready_and_user_dps_require_real_native":True}
          else:
              expected={**common,
                "schema":"p3_hy_v291_real_three_native_resume_v1",
                "existing_selected_special_gem_id":240967,
                "target_ilevel":334,"user_class":"shaman",
                "user_spec":"enhancement","user_race":"dwarf",
                "declared_socket_count":5,
                "G_native_max":1,"F_native_max":2,"O_native_max":0,
                "adaptive_dps_native_max":3,
