# One scope-limited completed-result acceptance on original published ZIP. No product/ZIP edits.
name: P3 v639 published Windows ZIP current 70961 E0 full64 result reopen
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/p3_v639_published_zip_final64_once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p3-v639-one-original-extracted-zip-final
  cancel-in-progress: false
jobs:
  packaged-current-source-final64-restore:
    if: ${{ contains(github.event.head_commit.message, '[p3-v639-zip-final64-once]') }}
    runs-on: windows-2022
    timeout-minutes: 42
    env:
      SIMC_PINNED_SOURCE_COMMIT: 9933ffb946fb55b1fa66657b848f519ac19006e1
      SIMC_PINNED_GAME_BUILD: 12.1.5.70961
      SIMC_SOURCE_GITHUB_API_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Preserve source bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Reuse same-source exact Windows SimC, never compile
        id: binary
        uses: actions/cache/restore@v4
        with:
          path: .v618-simc-cache
          key: v618-simc70961-source-9933ffb946fb55b1fa66657b848f519ac19006e1-win2022-msvc-cli
      - name: Reuse exact already published Windows beta ZIP
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 44490716235
          name: v181-windows-source-beta-44490716235
          path: out/v639/download
          github-token: ${{ github.token }}
      - name: Check source SHA, 282 original files, and no historical auto-promotion
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ steps.binary.outputs.cache-hit }}' -ne 'true') { throw 'V639_SIMC_BINARY_CACHE_MISSING_STOP_NO_COMPILE' }
          $exe=Join-Path $PWD '.v618-simc-cache/simc.exe'
          $id=Join-Path $PWD '.v618-simc-cache/identity.json'
          if (!(Test-Path $exe -PathType Leaf) -or !(Test-Path $id -PathType Leaf)) { throw 'V639_SIMC_FILE_MISSING' }
          $meta=Get-Content -Raw $id | ConvertFrom-Json
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($sha -ne '4f4472ac8687d029cd7d6041741f44aa98750ea1b3e953dfa7002dee1f38879f' -or $meta.binary_sha256 -ne $sha -or $meta.game_build -ne $env:SIMC_PINNED_GAME_BUILD -or $meta.source_commit -ne $env:SIMC_PINNED_SOURCE_COMMIT) { throw 'V639_EXACT_BINARY_SHA_SOURCE_MISMATCH' }
          $zip=Join-Path $PWD 'out/v639/download/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip'
          if (!(Test-Path $zip -PathType Leaf)) { throw 'V639_ORIGINAL_ZIP_MISSING' }
          $zipsha=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($zipsha -ne '855e8bca8e53f2e7f6efabaa39a20f92c2308f7f409cb4b75a1adc75eb022bfd') { throw 'V639_ORIGINAL_ZIP_SHA_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'out/v639/extracted' -Force
          $pkg=(Resolve-Path 'out/v639/extracted/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA').Path
          $env:P3_PACKAGE_ROOT=$pkg
          python -c "import os,pathlib,json,hashlib; p=pathlib.Path(os.environ['P3_PACKAGE_ROOT']); m=json.loads((p/'V181_PACKAGE_MANIFEST.json').read_text('utf8')); assert m['file_count']==282 and len(m['files'])==282; assert not m['native_executable_bundled'] and not m['sessions_bundled']; assert all(hashlib.sha256((p/f['path']).read_bytes()).hexdigest()==f['sha256'] for f in m['files']); print('V639_282_ORIGINAL_ZIP_FILES_SHA_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'V639_ORIGINAL_PACKAGE_MANIFEST_DRIFT' }
          $quarantine=Join-Path $PWD 'out/v639/history-quarantine'
          New-Item -ItemType Directory -Force $quarantine | Out-Null
          $old=@(Get-ChildItem (Join-Path $pkg 'data') -File -Filter 'current_season_*.json')
          $old+=@(Get-ChildItem (Join-Path $pkg 'data') -File -Filter 'v202_*.json')
          $old+=@(Get-ChildItem (Join-Path $pkg 'data') -File -Filter 'v206_*.json')
          $old+=@(Get-ChildItem (Join-Path $pkg 'data/season_ordinary_gem_nominal') -File -Filter '*.json')
          if ($old.Count -lt 2) { throw 'V639_EXPECTED_UNAPPROVED_HISTORY_NOT_PRESENT' }
          foreach ($item in $old) { Move-Item -LiteralPath $item.FullName -Destination (Join-Path $quarantine $item.Name) }
          # QA-only probes copied into throwaway unpacked workspace; NEVER added to actual ZIP.
          $probes=@('p2_v637_real_70961_manual_T_signed_Eplus_cancel_resume_once.py','p1_v621_real_70961_browser_enchant_cancel_resume_once.py','p1_v570_real_windows_cold_browser_to_simc_once.py','p1_v344_windows_real_browser_native64_once.py','p1_v610_real_installed_enchant_one_build.py','p1_v524_m1_m2_source_owner_once.py','p3_haj_real_local_web_native_e2e.py','p1_v624_real_70961_browser_enchant_full_result_once.py')
          foreach ($n in $probes) { Copy-Item -LiteralPath (Join-Path $PWD ('integration_probes/'+$n)) -Destination (Join-Path $pkg 'integration_probes') }
          $env:PYTHONPATH="$pkg\runner;$pkg\integration_probes;$pkg"
          python -c "import os,pathlib,importlib.machinery as mh; p=pathlib.Path(os.environ['P3_PACKAGE_ROOT']).resolve(); names=('v113_local_web_api','v216_environment_build_coordinator','v222_season_budget_contract','v632_permanent_enchant_native_E'); assert all(pathlib.Path(mh.PathFinder.find_spec(name,[str(p/'runner')]).origin).resolve().is_relative_to(p) for name in names); print('V639_PACKAGED_PRODUCT_MODULE_IDENTITY_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'V639_CHECKOUT_NOT_PACKAGE_MODULE_IDENTITY' }
          "V639_BINARY=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V639_PKG=$pkg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: One real Chrome v624 completed result and reopen on original ZIP (64 DPS Native once)
        shell: pwsh
        timeout-minutes: 36
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -r requirements-web-test.txt 'selenium>=4.24,<5'
          if ($LASTEXITCODE -ne 0) { throw 'V639_TEST_DEPENDENCIES_UNAVAILABLE' }
          $out=Join-Path $PWD 'out/v639/receipts'
          New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location $env:V639_PKG
          try {
            python -u integration_probes/p1_v624_real_70961_browser_enchant_full_result_once.py --simc "$env:V639_BINARY" --out "$out"
            if ($LASTEXITCODE -ne 0) { throw 'V639_FIRST_PACKAGED_SEASON_USER_BOUNDARY_SEE_COMPACT_RECEIPT' }
          } finally { Pop-Location }
          $r=Join-Path $out 'V624_REAL_CHROME_ENCHANT_FULL_RESULT_RESTORE.json'
          $env:V639_PROOF=$r
          python -c "import json,pathlib,os; d=json.loads(pathlib.Path(os.environ['V639_PROOF']).read_text('utf8')); assert d['status']=='PASS_REAL_CHROME_SIGNED_E0_64_FINAL_RESULT_REOPEN' and d['new_native_calls']==64 and d['browser_final_verified'] and d['http_restart_final_result_reopened'] and d['v622_saved_result_index_visible'] and d['native_attempts_after_readonly_reopen']==64 and d['saved_user_result']['confidence_level']==0.95 and len(d['saved_user_result']['absolute_rating_T'])==4 and sum(d['saved_user_result']['absolute_rating_T'].values())==d['saved_user_result']['final_T'] and d['saved_user_result']['material_near_alternatives']>=1; print('V639_PACKAGED_FINAL64_DPS_SEM_95_RESULT_REOPEN_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'V639_PACKAGE_PROOF_MISSING' }
      - name: Retain only compact final64 user receipt, never binary/credentials/private session
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p3-v639-published-zip-current-70961-final64-reopen
          path: out/v639/receipts/V624_REAL_CHROME_ENCHANT_FULL_RESULT_RESTORE.json
          retention-days: 7
          if-no-files-found: warn
