name: P3 v659 Self-Built SimC Actions ZIP Import (Offline)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v659_simc_self_built_artifact.py
      - runner/v193_simc_local_updater.py
      - runner/v113_local_web_api.py
      - tests/test_p3_v659_simc_self_built_artifact_offline.py
      - .github/workflows/p3_v659_self_built_simc_zip_offline.yml
permissions:
  contents: read
jobs:
  zip-and-pointer:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        py: ['3.12','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Validate local ZIP and existing updater regressions with no Native
        run: |
          python -m unittest -v tests.test_p3_v659_simc_self_built_artifact_offline tests.test_v193_simc_local_updater
          python -m py_compile runner/v659_simc_self_built_artifact.py runner/v193_simc_local_updater.py
