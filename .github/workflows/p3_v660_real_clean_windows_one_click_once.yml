name: P3 v660 Real Clean Windows One-Click SimC from Public Release
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/p3_v660_real_clean_windows_one_click_once.yml
permissions:
  contents: read
jobs:
  clean-windows:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install managed 7z decompressor only (no external 7-Zip)
        shell: pwsh
        run: |
          python -m pip install "py7zr>=1.1.4,<1.2"
          if ($LASTEXITCODE -ne 0) { throw "PY7ZR_DEPENDENCY_INSTALL_FAILED" }
      - name: Actual current KR Live discovery, public cache download, CLI validation, reuse, rollback
        shell: pwsh
        run: |
          @'
          import pathlib,sys,tempfile
          from unittest import mock
          sys.path.insert(0,"runner")
          import v193_simc_local_updater as u
          import v660_simc_one_click_provision as one
          from v289_retail_live_build_source import discover
          observed=discover(region="KR")
          print("ACTUAL_KR_LIVE",observed.get("game_build"),flush=True)
          assert observed["status"]=="LIVE_RETAIL_BUILD_SOURCE_OBSERVED"
          assert observed["game_build"]=="12.1.5.70961"
          live=lambda region: observed
          with tempfile.TemporaryDirectory() as td:
              path=pathlib.Path(td)/"managed"
              manager=u.SimCManager(path,platform="win32")
              assert manager.status()["installed"] is None
              assert not path.exists()
              with mock.patch.object(u,"find_sevenzip",return_value=None):
                  assert u.find_extractor()==u.PY7ZR_TOOL
                  first=one.prepare_one_click(manager,live_loader=live)
                  print("ONE_CLICK_FIRST",first["status"],flush=True)
                  assert first["status"] in (
                      "PUBLIC_SELF_BUILT_BINARY_INSTALLED",
                      "OFFICIAL_BINARY_INSTALLED")
                  assert first["active_binary"] and pathlib.Path(first["active_binary"]).is_file()
                  assert first["game_build"]==observed["game_build"]
                  assert not first["new_compilation"]
                  assert first["native_dps_calls_now"]==0
                  assert u.probe_cli(first["active_binary"],
                                      expected_build=observed["game_build"])
                  again=one.prepare_one_click(manager,live_loader=live)
                  print("ONE_CLICK_SECOND",again["status"],flush=True)
                  assert again["status"] in (
                      "ALREADY_COMPATIBLE_MANAGED","OFFICIAL_BINARY_INSTALLED")
                  assert again["active_binary"]==first["active_binary"]
                  assert manager.rollback()["active_binary"] is None
                  assert not manager.status()["active_binary"]
                  print("P3_V660_CLEAN_WINDOWS_ONE_CLICK_REAL_DOWNLOAD_PASS",
                        first["installed"]["sha256"],flush=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "REAL_CLEAN_WINDOWS_ONE_CLICK_FAILED" }
