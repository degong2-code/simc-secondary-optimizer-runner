name: v034 Chat Triggered Native One-Shot Probe

on:
  push:
    branches:
      - probe/chat-auto-run-20261024
    paths:
      - integration_probes/requests/v034_native_one_shot.json

permissions:
  contents: write  # Run ID reporting to the isolated probe branch only.

concurrency:
  group: v034-chat-auto-run-20261024
  cancel-in-progress: false

jobs:
  pinned-simc-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout optimizer runner only
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Validate one-shot request and publish run pointer for Chat
        shell: bash
        env:
          EXPECTED_BRANCH: probe/chat-auto-run-20261024
        run: |
          set -euo pipefail
          python3 - <<'PY_REQUEST'
          import json, os, pathlib
          req = pathlib.Path('integration_probes/requests/v034_native_one_shot.json')
          expected = {
            'schema': 'v034_native_one_shot',
            'authorization': 'ISOLATED_CLOUD_NATIVE_PROBE_ONLY',
            'rune': 'crit',
            'iterations': 60,
            'simc_commit_prefix': '7bc1071',
          }
          assert json.loads(req.read_text()) == expected, 'REQUEST_IDENTITY_MISMATCH'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['EXPECTED_BRANCH'], 'BRANCH_MISMATCH'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push', 'EVENT_MISMATCH'
          pointer = pathlib.Path('integration_probes/results/v034_run_pointer.json')
          assert not pointer.exists(), 'ONE_SHOT_ALREADY_RECORDED'
          pointer.parent.mkdir(parents=True, exist_ok=True)
          info = {
            'schema': 'v034_chat_automation_run_pointer',
            'run_id': int(os.environ['GITHUB_RUN_ID']),
            'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'trigger_sha': os.environ['GITHUB_SHA'],
            'branch': os.environ['GITHUB_REF_NAME'],
            'artifact_name': 'simc-v034-chat-auto-evidence-' + os.environ['GITHUB_RUN_ID'],
            'rune': 'crit',
            'iterations': 60,
            'status': 'DISPATCHED_NOT_YET_VERIFIED',
          }
          pointer.write_text(json.dumps(info, indent=2, sort_keys=True)+'\n')
          pathlib.Path('run-output').mkdir(exist_ok=True)
          pathlib.Path('run-output/v034_dispatch_receipt.json').write_text(json.dumps(info, indent=2, sort_keys=True)+'\n')
          print('REQUEST_VALIDATED; RUN_ID=' + os.environ['GITHUB_RUN_ID'])
          PY_REQUEST
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration_probes/results/v034_run_pointer.json
          git commit -m 'test: publish v034 one-shot run pointer [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate local portable baseline (no SimC yet)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 runner/pilot.py check
          mkdir -p run-output

      - name: Install only CLI build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential pkg-config

      - name: Fetch exact pinned upstream SimC source (no fallback to latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _vendor
          git clone --filter=blob:none --no-checkout https://github.com/simulationcraft/simc.git _vendor/simc 2>&1 | tee run-output/source_checkout.log
          git -C _vendor/simc checkout --detach 7bc1071 2>&1 | tee -a run-output/source_checkout.log
          REV="$(git -C _vendor/simc rev-parse HEAD)"
          [[ "$REV" == 7bc1071* ]] || { echo "Pinned SimC revision unavailable!" >&2; exit 32; }
          printf '%s\n' "$REV" > run-output/LINUX_SIMC_SOURCE_COMMIT.txt
          git -C _vendor/simc status --short

      - name: Build Linux CLI only at pinned SimC revision
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _vendor/simc -B _vendor/simc/build \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee run-output/cmake_configure.log
          cmake --build _vendor/simc/build --target simc --parallel 2 \
            2>&1 | tee run-output/cmake_build.log
          find _vendor/simc/build -type f -name simc -executable -print | sort > run-output/simc_binary_candidates.txt
          test "$(wc -l < run-output/simc_binary_candidates.txt)" -ge 1

      - name: Run bounded native profiles and verify JSON2
        shell: bash
        env:
          PILOT_RUNE: crit
          PILOT_ITERATIONS: "60"
        run: |
          set -euo pipefail
          SIMC_BIN="$(head -1 run-output/simc_binary_candidates.txt)"
          sha256sum "$SIMC_BIN" > run-output/LINUX_SIMC_BINARY_SHA256.txt
          python3 runner/pilot.py execute \
            --binary "$SIMC_BIN" --rune "$PILOT_RUNE" \
            --iterations "$PILOT_ITERATIONS" \
            --output run-output

      - name: Upload complete execution evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simc-v034-chat-auto-evidence-${{ github.run_id }}
          path: run-output/
          if-no-files-found: warn
          retention-days: 7
