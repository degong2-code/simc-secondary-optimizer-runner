name: v070 Real Rogue Official GJF Native
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [integration_probes/requests/v070_one_native_once.json]
permissions:
  contents: read
  actions: read
jobs:
  official-rating:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact one-time request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os,pathlib
          p="integration_probes/requests/v070_one_native_once.json"
          assert subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",os.environ["GITHUB_SHA"]],text=True).splitlines()==[p]
          assert json.loads(pathlib.Path(p).read_text())=={"schema":"v070","previous_real_native":40181981240,"max_new_native":1,"simc_effects_owned":True,"official_T":"G+J+F","original_v015_016_unchanged":True}
          for path,sha in {"runner/v064_adaptive_evaluator_port.py":"5a9aa58eb99d645292d93c5dd505fef33156361e","runner/v069_rogue_official_budget_native.py":"1708b76991e10e104ddc59e495a3cc2f7d573b81"}.items():
            assert subprocess.check_output(["git","hash-object",path],text=True).strip()==sha
          print("V070_EXACT_ONE_NATIVE_REQUEST_PASS")
          PY
      - name: Regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 runner/pilot.py check
      - name: Previous exact numeric Native witnesses
        uses: actions/download-artifact@v4
        with:
          name: simc-v069-user-rogue-real-GJF-one-native-40181981240
          path: .witness
          run-id: 40181981240
          repository: degong2-code/simc-secondary-optimizer-runner
          github-token: ${{ github.token }}
      - name: Pinned SimC binary
        uses: actions/download-artifact@v4
        with:
          name: v050-exact-native-binary-40153209773
          path: .simc
          run-id: 40153209773
          repository: degong2-code/simc-secondary-optimizer-runner
          github-token: ${{ github.token }}
      - name: One real Native GJF target
        run: |
          set -euo pipefail
          echo '64089f2f917d552ab392ba311d128aa1b7ec559ead52b3546e2cc328ab479b8e  .simc/simc' | sha256sum -c
          chmod +x .simc/simc
          python3 runner/v069_rogue_official_budget_native.py --witness-root .witness/fresh-witness --out "$GITHUB_WORKSPACE/out/official" --binary "$GITHUB_WORKSPACE/.simc/simc"
          python3 - <<'PY'
          import json
          r=json.load(open("out/official/V069_RECEIPT.json"))
          assert r["status"]=="PASS_ONE_ROGUE_OFFICIAL_T_NATIVE_DPS_RATING",r
          assert r["new_native_calls"]==1
          assert (r["G"],r["J"],r["F"],r["T_official"])==(2847,138,165,3150)
          assert r["fixed_special_L"]=={"crit_rating":100,"haste_rating":201,"mastery_rating":0,"versatility_rating":0}
          assert r["result"]["target"]==r["result"]["rating_actual"]
          assert sum(r["result"]["rating_actual"].values())==3150
          assert r["result"]["dps_mean"]>0 and r["result"]["dps_sem"]>=0
          assert not r["global_optimum_proven"]
          print("V070_ROGUE_CHMV3150_GJF_JSON2_NATIVE_PASS")
          PY
      - name: Cache-only repeat of same JSON2
        run: |
          set -euo pipefail
          sha256sum out/official/result.json > out/official/result_checksum.txt
          python3 runner/v069_rogue_official_budget_native.py --witness-root .witness/fresh-witness --out "$GITHUB_WORKSPACE/out/official" --binary "$GITHUB_WORKSPACE/.simc/simc" --cache-only
          sha256sum -c out/official/result_checksum.txt
          python3 - <<'PY'
          import json
          r=json.load(open("out/official/V069_RECEIPT.json"))
          assert r["status"]=="PASS_ONE_ROGUE_OFFICIAL_T_NATIVE_DPS_RATING" and r["new_native_calls"]==0
          print("V070_VERIFIED_NATIVE_CACHE_ONLY_PASS")
          PY
      - name: Archive real JSON2 and SimC stdout stderr
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simc-v070-rogue-GJF-native-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
