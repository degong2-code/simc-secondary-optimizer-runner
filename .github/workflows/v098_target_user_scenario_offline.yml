name: v098 Target User Scenario P1 Offline Regression
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v098_target_user_scenario_offline.yml
      - runner/v101_common_representative_equipment.py
      - runner/v102_ordinary_armor_seed_pool.py
      - runner/v103_source_observed_weapon_types.py
      - runner/v104_shared_pinned_rogue_shaman_composer.py
      - integration_probes/v105_paladin_user_e2e.py
      - tests/test_v105_paladin_user_e2e_contract.py
      - runner/v106_user_session_controller.py
      - runner/v106_windows_simple_gui.py
      - runner/v107_optional_items_dialog.py
      - runner/v108_native_consumable_inputs.py
      - runner/v108_user_consumable_dialog.py
      - runner/v109_windows_readiness_diagnostic.py
      - tests/test_v109_windows_readiness_offline.py
      - tests/test_v108_user_consumables.py
      - tests/test_v107_optional_equipment_inputs.py
      - tests/test_v106_user_session_controller.py
      - tests/test_v104_shared_pinned_rogue_shaman_composer.py
      - tests/test_v103_source_observed_weapon_types.py
      - tests/test_v102_ordinary_armor_seed_pool.py
      - tests/test_v101_common_representative_equipment.py
      - runner/v098_target_user_scenario_bootstrap.py
      - runner/v055_simc_item_selection.py
      - runner/v061_scenario_contract.py
      - runner/v062_static_budget_bridge.py
      - tests/test_v061_scenario_contract.py
      - tests/test_v055_simc_item_selection.py
      - tests/test_v062_static_budget_bridge.py
      - tests/test_v098_target_user_scenario_bootstrap.py
      - runner/v096_unified_product_entry.py
      - runner/v091_weapon_oil_external_adapter.py
      - runner/v065_original_scheduler_native_bridge.py
      - tests/test_v110_windows_exact_simc_input_bytes.py
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile product entry and targeted bootstrap
        run: |
          python3 -m py_compile runner/v055_simc_item_selection.py runner/v061_scenario_contract.py runner/v062_static_budget_bridge.py runner/v101_common_representative_equipment.py runner/v102_ordinary_armor_seed_pool.py runner/v103_source_observed_weapon_types.py runner/v104_shared_pinned_rogue_shaman_composer.py integration_probes/v105_paladin_user_e2e.py runner/v106_user_session_controller.py runner/v106_windows_simple_gui.py runner/v107_optional_items_dialog.py runner/v108_native_consumable_inputs.py runner/v108_user_consumable_dialog.py runner/v109_windows_readiness_diagnostic.py runner/v098_target_user_scenario_bootstrap.py runner/v096_unified_product_entry.py
      - name: Test user entry / old source-locked bridge offline (NO Native SimC)
        run: |
          python3 -m unittest -q \
            tests.test_v055_simc_item_selection \
            tests.test_v061_scenario_contract \
            tests.test_v062_static_budget_bridge \
            tests.test_v089_ilvl_chmv_budget_selector \
            tests.test_v090_reference_total_native_candidate \
            tests.test_v091_weapon_oil_external_adapter \
            tests.test_v092_approved_inclusive_CHMV_policy \
            tests.test_v093_inclusive_adaptive_scheduler_bridge \
            tests.test_v094_durable_inclusive_adaptive_runner \
            tests.test_v095_material_precision_policy \
            tests.test_v096_unified_product_entry \
            tests.test_v096_manual_final_inclusive_entry \
            tests.test_v097_user_result_offline \
            tests.test_v098_target_user_scenario_bootstrap \
            tests.test_v101_common_representative_equipment \
            tests.test_v102_ordinary_armor_seed_pool \
            tests.test_v103_source_observed_weapon_types \
            tests.test_v104_shared_pinned_rogue_shaman_composer \
            tests.test_v105_paladin_user_e2e_contract \
            tests.test_v106_user_session_controller \
            tests.test_v107_optional_equipment_inputs \
            tests.test_v108_user_consumables \
            tests.test_v109_windows_readiness_offline \
            tests.test_v110_windows_exact_simc_input_bytes
      - name: Baseline pilot
        run: python3 runner/pilot.py check
