name: v107 Windows Native-platform User Controls Offline Once
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/requests/v107_windows_controls_once.json
      - integration_probes/requests/v107_windows_controls_retry.json
      - integration_probes/requests/v107_windows_checkout_attr_once.json
      - integration_probes/requests/v108_windows_consumables_once.json
permissions:
  contents: read
concurrency:
  group: v107-windows-user-controls-offline
  cancel-in-progress: false
jobs:
  windows-subprocess-controls:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Preserve exact Git source fixture bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require one explicitly bounded Windows platform request
        shell: pwsh
        run: |
          python -c "import json,os,pathlib,subprocess; p='integration_probes/requests/v107_windows_controls_once.json'; changed=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']],text=True).splitlines(); assert len(changed)==1 and changed[0] in [p,'integration_probes/requests/v107_windows_controls_retry.json','integration_probes/requests/v107_windows_checkout_attr_once.json','integration_probes/requests/v108_windows_consumables_once.json'],changed; expected={'schema':'v107_windows_user_controls_offline_once_v1','one_windows_platform_run':True,'native_simc_calls':0,'no_new_optimizer':True,'assert_tk_tcl_headless':True,'assert_windows_lock_cancel_cache_contract':True,'do_not_claim_interactive_tk_or_windows_native':True,'main_or_work_os_mutation':False}; expected.update({'schema':'v107_windows_user_controls_offline_retry_v1','checkout_lf_preserved':True}) if changed[0].endswith('retry.json') else None; expected.update({'schema':'v107_windows_default_autocrlf_attr_once_v1','checkout_lf_preserved':True,'test_default_windows_autocrlf':True}) if changed[0].endswith('attr_once.json') else None; expected.update({'schema':'v108_windows_native_consumables_omnium_once_v1','validate_new_consumables':True}) if changed[0].endswith('consumables_once.json') else None; assert json.loads(pathlib.Path(changed[0]).read_text())==expected; print('V107_WINDOWS_OFFLINE_BOUNDED_SCOPE_PASS')"
      - name: Force default Windows CRLF checkout and assert pinned source bytes still intact
        if: contains(github.event.head_commit.message, 'checkout attr')
        shell: pwsh
        run: |
          git config --local core.autocrlf true
          git -c core.autocrlf=true checkout-index -f -a
          python -c "import hashlib,pathlib; p=pathlib.Path('integration_probes/fixtures/v082_upstream_mid2_warrior_fury_reference.simc'); b=p.read_bytes(); h=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(); assert h=='3225992ed5b754ad5d61e8b785d9d859f1eed1be',(h,len(b)); print('WINDOWS_AUTOCRLF_TRUE_FIXED_SOURCE_SHA_PASS')"
          python -c "import sys;sys.path.insert(0,'runner'); import v103_source_observed_weapon_types as w; assert w.verify_observed()['executable_source_shapes']==6; print('WINDOWS_ALL_SIX_PINNED_WEAPONS_SOURCE_SHA_PASS')"
      - name: Windows Python Tk runtime without interactive desktop
        shell: pwsh
        run: |
          python -c "import os,sys,tkinter; assert os.name=='nt'; print('WINDOWS_TCL',tkinter.Tcl().eval('info patchlevel'))"
          python -c "import sys;sys.path.insert(0,'runner'); import v106_windows_simple_gui as gui; import v107_optional_items_dialog as items; import v108_user_consumable_dialog as consumables; assert len(gui.DISPLAY)==6; print('V107_WINDOWS_TK_AND_SIX_DPS_DIALOG_IMPORT_PASS')"
      - name: Windows real msvcrt lock, user cancel marker and exact input/Native cache contract
        shell: pwsh
        run: |
          python -m unittest -q tests.test_v106_user_session_controller tests.test_v107_optional_equipment_inputs tests.test_v108_user_consumables
          python runner/pilot.py check
      - name: Verify product Windows starter exists (do not open a display)
        shell: pwsh
        run: |
          python -c "import pathlib; p=pathlib.Path('START_SIMC_OPTIMIZER_WINDOWS.cmd'); c=p.read_text(); assert 'v106_windows_simple_gui.py' in c and 'py -3' in c; print('V107_WINDOWS_BETA_LAUNCHER_FILE_PRESENT')"
