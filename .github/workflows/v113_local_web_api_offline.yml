name: v113 Local Web API P1 Offline (NO Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v113_local_web_api_offline.yml
      - requirements-web.txt
      - requirements-web-test.txt
      - runner/v113_local_web_api.py
      - START_SIMC_OPTIMIZER_WEB_WINDOWS.cmd
      - tests/test_v152_windows_local_web_launcher_offline.py
      - runner/v148_local_batch_results.py
      - tests/test_v148_local_batch_results_offline.py
      - runner/v151_season_catalog_impact.py
      - tests/test_v151_season_catalog_impact_offline.py
      - tests/test_v149_target334_independent_product_offline.py
      - tests/test_v153_non334_independent_product_offline.py
      - runner/v139_pure_target_profile_composer.py
      - tests/test_v150_local_saved_session_index_offline.py
      - tests/test_v113_local_web_api_offline.py
      - tests/test_v114_local_web_ui_offline.py
      - runner/webui/index.html
      - runner/webui/styles.css
      - runner/webui/app.js
      - integration_probes/catalog/v146_character_starter_examples.json
      - runner/v106_user_session_controller.py
      - integration_probes/v145_targeted_pure_physical_native.py
      - integration_probes/v147_all_dps_targeted_native_batch.py
      - integration_probes/RUN_ALL_24_SIMC_NATIVE.cmd
      - tests/test_v147_all_dps_targeted_native_batch_offline.py
      - tests/test_v106_user_session_controller.py
      - runner/v098_target_user_scenario_bootstrap.py
      - runner/v212_environment_manifest.py
      - runner/v216_environment_build_coordinator.py
      - runner/v217_stage_execution_engine.py
      - runner/v218_v098_profile_stage_adapter.py
      - tests/test_v217_stage_execution_engine.py
      - tests/test_v212_environment_manifest.py
      - tests/test_v216_environment_build_coordinator.py
      - runner/v103_source_observed_weapon_types.py
      - runner/v104_shared_pinned_rogue_shaman_composer.py
      - runner/v108_native_consumable_inputs.py
      - runner/v127_dps_source_metadata.py
      - integration_probes/fixtures/v131_upstream_mid2_rogue_outlaw_reference.simc
      - tests/test_v131_rogue_outlaw_source_candidate.py
      - runner/v096_unified_product_entry.py
permissions:
  contents: read
jobs:
  local-web-api:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2022
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Ensure fixture source bytes remain LF on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded HTTP dependencies (no SimC)
        shell: bash
        run: python -m pip install -r requirements-web-test.txt
      - name: Compile and check actual HTTP adapter and existing session code
        shell: bash
        run: |
          python -m py_compile runner/v151_season_catalog_impact.py runner/v148_local_batch_results.py runner/v113_local_web_api.py runner/v106_user_session_controller.py runner/v098_target_user_scenario_bootstrap.py runner/v212_environment_manifest.py runner/v216_environment_build_coordinator.py runner/v217_stage_execution_engine.py runner/v218_v098_profile_stage_adapter.py integration_probes/v147_all_dps_targeted_native_batch.py
      - name: Offline FastAPI HTTP tests, including security and zero Native
        shell: bash
        run: |
          python -m unittest -q tests.test_v217_stage_execution_engine tests.test_v113_local_web_api_offline tests.test_v114_local_web_ui_offline tests.test_v216_environment_build_coordinator tests.test_v106_user_session_controller tests.test_v109_windows_readiness_offline tests.test_v110_windows_exact_simc_input_bytes tests.test_v131_rogue_outlaw_source_candidate tests.test_v147_all_dps_targeted_native_batch_offline tests.test_v148_local_batch_results_offline tests.test_v149_target334_independent_product_offline tests.test_v153_non334_independent_product_offline tests.test_v150_local_saved_session_index_offline tests.test_v151_season_catalog_impact_offline tests.test_v152_windows_local_web_launcher_offline tests.test_v212_environment_manifest tests.test_v213_source_to_catalog
      - name: Windows one-click local web launcher zero-Native preflight
        if: runner.os == 'Windows'
        shell: cmd
        run: START_SIMC_OPTIMIZER_WEB_WINDOWS.cmd --check
      - name: Browser script parse check (Node without dependency install)
        shell: bash
        run: node --check runner/webui/app.js
      - name: Existing original source contract pilot
        shell: bash
        run: python runner/pilot.py check
