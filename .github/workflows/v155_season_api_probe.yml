name: v155 Season API Probe (opt-in live, NO Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v155_season_api_probe.py
      - tests/test_v155_season_api_probe_offline.py
      - .github/workflows/v155_season_api_probe.yml
      - docs/V155_SEASON_API_PROBE_README.md
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: API shape contracts without any HTTP
        run: python -m unittest -v tests.test_v155_season_api_probe_offline
  live-opt-in:
    if: ${{ vars.SIMC_ALLOW_SEASON_API_PROBE == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[api-probe]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exactly bounded Blizzard and optional WCL provider discovery
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python runner/v155_season_api_probe.py --out v155-live-season-api-evidence.json
      - name: Preserve sanitized noncredential response evidence
        uses: actions/upload-artifact@v4
        with:
          name: v155-live-season-api-evidence
          path: v155-live-season-api-evidence.json
          retention-days: 14

  myth-70783-joined-source-once:
    # Reuses the existing authenticated v155 artifact. No new Blizzard/WCL
    # credential reads, no SimC Native, no new parser or product gate.
    if: ${{ contains(github.event.head_commit.message, '[myth-join-one]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse actual 2026-11-16 Blizzard/WCL provider report (no new OAuth)
        uses: actions/download-artifact@v4
        with:
          repository: degong2-code/simc-secondary-optimizer-runner
          run-id: 43852847676
          name: v155-live-season-api-evidence
          path: v523-prior-auth
          github-token: ${{ github.token }}
      - name: One existing v161 Wago 70783 collector, exact v163 join and v522 cap
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,re,sys,traceback
          sys.path.insert(0,'runner')
          import v161_wago_db2_snapshot as v161
          import v163_zero_seed_db2_join as v163
          import v522_myth_target_currency_source as v522
          import v289_retail_live_build_source as retail
          ROOT=pathlib.Path('v523-output')
          ROOT.mkdir(exist_ok=True)
          doc={"schema":"p1_v523_actual_70783_v155_v161_v163_v522_join_v1",
               "status":"PENDING_NOT_YET_PROVEN",
               "game_build":"12.1.5.70783",
               "original_v155_run_id":43852847676,
               "v155_blizzard_wcl_calls_in_this_job":0,
               "new_native_calls":0,
               "environment_ready":False,"official_GJFO_computed":False,
               "original_Wago_CSV_collected_now":False}
          try:
              source=pathlib.Path('v523-prior-auth/v155-live-season-api-evidence.json')
              raw=source.read_bytes()
              report=json.loads(raw)
              assert report.get('schema')=='v155_season_discovery_provider_probe_v1'
              assert report.get('mode')=='LIVE_AUTHENTICATED_BOUNDED'
              assert report.get('wcl',{}).get('status')=='ZONES_WITH_JOURNAL_IDS_RETURNED'
              assert report.get('blizzard',{}).get('endpoints',{}).get('keystone_season_index',{}).get('data',{}).get('current_season_id')==18
              doc["original_v155_sha256"]=hashlib.sha256(raw).hexdigest()
              live=retail.discover(region="KR")
              doc["current_retail_build"]=live.get("game_build")
              if live.get('game_build')!=doc['game_build']:
                  raise ValueError('RETAIL_GAME_BUILD_CHANGED_DO_NOT_REUSE_70783')
              folder=ROOT/'wago'
              receipt=v161.snapshot(folder,build=doc['game_build'],make_archive=True)
              doc["original_Wago_CSV_collected_now"]=True
              doc["original_v161_receipt_sha256"]=hashlib.sha256(
                  (folder/'receipt.json').read_bytes()).hexdigest()
              doc["v161_10_table_total_bytes"]=receipt["total_csv_bytes"]
              scope=v163.discover_unique_live_scope(folder,report)
              doc['v163_join_scope']=scope
              original=v163.build_index(folder,report,
                  raid_zone=scope['raid_zone'],
                  mplus_zone=scope['mplus_zone'],
                  build=doc['game_build'],
                  expansion_id=scope['expansion_id'],
                  wcl_expansion_id=scope['wcl_expansion_id'])
              doc['v163_original_join']={
                  'status':original['status'],
                  'db2_display_season_id':original['db2_display_season_id'],
                  'mapped_raid_bosses':original['mapped_raid_bosses'],
                  'mapped_mplus_dungeons':original['mapped_mplus_dungeons'],
                  'collection_counts':original['collection_counts'],
                  'full_season_completeness_confirmed':original[
                      'full_season_completeness_confirmed']}
              optional=v522.collect(folder,doc['game_build'])
              result=v522.myth_target_candidate(folder,doc['game_build'],
                  active_season_scope=scope)
              doc["v522_myth_source"]={
                  **result,"csv_http_calls_now":optional['network_calls_now']}
              doc["status"]="ACTIVE_SEASON_MYTH_TARGET_SOURCE_PROVEN_NOT_GJFO_INSTALLED" if (
                  result["status"]=="MYTH_TRACK_TARGET_SOURCE_MATCH_UNADMITTED"
                  and result["target_ilevel"]==334
                  and result["currency_ids"]==[3441,3446]
              ) else "MYTH_TARGET_SOURCE_PENDING_MISMATCH"
          except Exception as error:
              raw_code=str(error).split(':',1)[0]
              doc["status"]="PENDING_FIRST_REAL_SOURCE_BLOCKER"
              doc["first_blocker"]=(raw_code if re.fullmatch(
                  r"[A-Z][A-Z0-9_]{2,130}",raw_code) else
                  type(error).__name__)
          finally:
              p=ROOT/'v523-compact.json'
              p.write_text(json.dumps(doc,ensure_ascii=False,sort_keys=True,
                  indent=2)+'\n',encoding='utf8')
              print(json.dumps(doc,ensure_ascii=False,sort_keys=True))
          if doc['status']!='ACTIVE_SEASON_MYTH_TARGET_SOURCE_PROVEN_NOT_GJFO_INSTALLED':
              raise SystemExit(3)
          PY
      - name: Preserve first blocker and original CSV for REUSE (not product runtime)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-v523-real-v155-v161-v163-v522-70783
          path: |
            v523-output/v523-compact.json
            v523-output/wago/receipt.json
            v523-output/wago/db2-snapshot.zip
          retention-days: 2
          if-no-files-found: warn
