name: v157 Source-First Profession Recipe Discovery (NO Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v157_blizzard_craft_probe.py
      - tests/test_v157_blizzard_craft_probe_offline.py
      - docs/V157_CRAFT_AND_DELVE_DISCOVERY_SCOPE.md
      - .github/workflows/v157_crafted_api_probe.yml
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: API-only recipe/outputs and zero-prior-data regression
        run: python -m unittest -v tests.test_v157_blizzard_craft_probe_offline
  live-opt-in:
    if: ${{ vars.SIMC_ALLOW_SEASON_API_PROBE == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[api-probe]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: API-derived crafting recipe references and bounded output discovery
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python runner/v157_blizzard_craft_probe.py --out v157-crafting-real-api.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v157-crafting-real-api
          path: v157-crafting-real-api.json
          retention-days: 14
