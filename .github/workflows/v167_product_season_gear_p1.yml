name: v167 Product Season Catalog to P1 (focused, no Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v167_product_season_gear_adapter.py
      - runner/v139_pure_target_profile_composer.py
      - runner/v113_local_web_api.py
      - runner/webui/app.js
      - runner/webui/index.html
      - tests/test_v167_product_season_gear_adapter.py
      - tests/test_v167_local_gear_catalog_api.py
      - data/current_season_product_gear_db.json
      - .github/workflows/v167_product_season_gear_p1.yml
jobs:
  focused-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web-test.txt
      - name: Lightweight Python and browser syntax
        run: |
          python -m py_compile runner/v167_product_season_gear_adapter.py runner/v139_pure_target_profile_composer.py runner/v113_local_web_api.py
          node --check runner/webui/app.js
      - name: New season role, API and UI regressions without SimC
        run: python -m unittest -v tests.test_v167_product_season_gear_adapter tests.test_v167_local_gear_catalog_api
  real-saved-catalog:
    if: ${{ contains(github.event.head_commit.message, '[v167-real]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse the existing v166 saved 288-role artifact (no WoW API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/v166 data
          gh run download 40855495150 -n v166-current-season-product-gear-db -D out/v166
      - name: Build exactly one replaceable, small active-season product JSON
        run: |
          python runner/v167_product_season_gear_adapter.py \
            --source-v166 out/v166/current-season-product-gear-db.json \
            --out data/current_season_product_gear_db.json
          test "$(stat -c%s data/current_season_product_gear_db.json)" -lt 150000
      - name: Real saved source and zero-seed candidate regression
        env:
          SIMC_V166_PRODUCT_GEAR_DB: out/v166/current-season-product-gear-db.json
        run: python -m unittest -v tests.test_v167_product_season_gear_adapter
      - name: Commit only one replaceable current-season candidate DB to isolated branch
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "probe/chat-cache-v035-20261024"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_season_product_gear_db.json
          git commit -m "data(v167): current-season candidate gear names, types and slots only"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v167-current-season-product-gear-db
          path: data/current_season_product_gear_db.json
          retention-days: 2
