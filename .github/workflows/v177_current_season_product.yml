name: v177 Current-Season Product -> Existing Adaptive v094 (opt-in)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v098_target_user_scenario_bootstrap.py
      - runner/v106_user_session_controller.py
      - runner/v113_local_web_api.py
      - runner/webui/app.js
      - runner/webui/index.html
      - tests/test_v177_current_season_product_flow.py
      - integration_probes/requests/v177_one_real_product_adaptive_once.json
      - .github/workflows/v177_current_season_product.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: v177-season-product-original-v094-one-pilot
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web-test.txt
      - name: 26 real manifest plans, opt-in local API, old session keys and cache/cancel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile runner/v098_target_user_scenario_bootstrap.py runner/v106_user_session_controller.py runner/v113_local_web_api.py
          python3 -m unittest -v tests.test_v177_current_season_product_flow
          python3 -m unittest -q tests.test_v098_target_user_scenario_bootstrap tests.test_v106_user_session_controller tests.test_v113_local_web_api_offline tests.test_v172_current_season_v098_stage
  native-one-product:
    needs: offline
    if: ${{ contains(github.event.head_commit.message, '[v177-adaptive-native]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Assert only explicit bounded request changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          f="integration_probes/requests/v177_one_real_product_adaptive_once.json"
          changed=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",os.environ["GITHUB_SHA"]],text=True).splitlines()
          assert changed==[f],changed
          r=json.loads(pathlib.Path(f).read_text())
          assert r=={"schema":"v177_single_current_season_product_v094_v1",
              "spec":"paladin/retribution","target_ilevel":334,
              "existing_v094_native_candidates_max":6,"use_current_season_product":True,
              "simc_revision":"7bc10711b5",
              "simc_binary_sha256":"64089f2f917d552ab392ba311d128aa1b7ec559ead52b3546e2cc328ab479b8e",
              "new_optimizer":False,"reuse_v176_physical_proof_without_rerun":True,
              "single_spec_only":True,"no_main_merge":True,"no_project_ui_mutation":True},r
          print("V177_SINGLE_REAL_USER_V094_APPROVED_MAX_SIX")
          PY
      - name: Restore pinned SimC from existing GitHub binary cache
        uses: actions/cache/restore@v5
        id: simc
        with:
          path: .simc-cache/v035/
          key: v035-ubuntu2404-x64-7bc10711b5a4514066fa402ca0a71c9ba4b7c9dd-cli-release-nonetwork-r1
      - name: Execute exact one user production opt-in 6 native and verify SHA replay
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.simc.outputs.cache-hit }}" = true
          echo '64089f2f917d552ab392ba311d128aa1b7ec559ead52b3546e2cc328ab479b8e  .simc-cache/v035/simc' | sha256sum -c
          chmod +x .simc-cache/v035/simc
          python3 - <<'PY'
          import json,pathlib,sys,hashlib,math
          sys.path.insert(0,"runner")
          import v106_user_session_controller as s
          root=pathlib.Path("out").resolve()
          root.mkdir(exist_ok=True)
          binary=pathlib.Path(".simc-cache/v035/simc").resolve()
          u=s.user_scenario(s.standard_controls(("paladin","retribution")))
          folder=s.store_session(u,root,binary,"7bc10711b5",
                                current_season_product=True)
          assert s.worker(folder,binary,"7bc10711b5")==0,"V177_ORIGINAL_V094_REAL_NATIVE_FAILED"
          result=json.loads(s.paths(folder)["final"].read_text())
          assert result["status"].startswith("PASS"),result
          assert result["native_calls_cumulative"]==6
          assert result["user_result"]["confidence_level"]==0.95
          assert result["user_result"]["observed_first_choice"]["observed_dps_mean"]>0
          assert result["user_result"]["global_optimum_proven"] is False
          hashes=s.native_json2_hashes(folder)
          assert len(hashes)==6,hashes
          assert s.worker(folder,binary,"7bc10711b5",cache_only=True)==0, \
                 "V177_ORIGINAL_V094_SHA_CACHE_REPLAY_FAILED"
          after=json.loads(s.paths(folder)["final"].read_text())
          assert after["cache_hits_this_run"]==6 and after["native_calls_cumulative"]==6
          assert s.native_json2_hashes(folder)==hashes
          print("V177_ONE_PRODUCT_REAL_V094_SIX_CANDIDATE_AND_95_PERCENT_PASS")
          print("V177_ZERO_NEW_NATIVE_CACHE_SHA_REPLAY_PASS")
          print("V177_DPS",result["user_result"]["observed_first_choice"]["observed_dps_mean"])
          print("V177_SEM",result["user_result"]["observed_first_choice"]["simc_sem"])
          PY
      - name: Archive original v094 output, raw SimC JSON2 and logs, user session receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v177-one-current-season-product-real-v094-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
