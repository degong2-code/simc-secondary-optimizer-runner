name: v181 P1-D Windows Source Beta ZIP + Actual Loopback HTTP (No Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - integration_probes/v181_windows_beta_packager.py
      - integration_probes/v181_windows_beta_live_http.py
      - tests/test_v181_windows_beta_package_offline.py
      - WINDOWS_BETA_START_HERE.md
      - runner/v193_simc_local_updater.py
      - runner/v113_local_web_api.py
      - runner/v196_current_season_user_catalog.py
      - runner/v208_internal_exact_special_L_hydrator.py
      - runner/v212_environment_manifest.py
      - runner/v213_source_to_catalog.py
      - data/current_season_source_to_catalog.json
      - integration_probes/v181_windows_beta_live_http.py
      - integration_probes/v181_windows_beta_packager.py
      - tests/test_v113_local_web_api_offline.py
      - tests/test_v208_special_L_hydration_offline.py
      - tests/test_v212_environment_manifest.py
      - data/current_season_simc_enchant_candidates.json
      - tests/test_v196_current_season_ui_catalog.py
      - runner/v197_verified_effect_budget.py
      - runner/v197_enchant_effect_families.py
      - tests/test_v197_verified_effect_budget.py
      - tests/test_v197_enchant_effect_families.py
      - integration_probes/v198_targeted_enchant_native_rating.py
      - tests/test_v198_targeted_enchant_native_rating.py
      - runner/v065_v015_scheduler_adapter.py
      - runner/v093_inclusive_adaptive_scheduler_bridge.py
      - runner/v096_unified_product_entry.py
      - runner/v098_target_user_scenario_bootstrap.py
      - runner/v202_one_enchant_admission.py
      - data/v202_verified_enchant_8025_source.json
      - tests/test_v202_one_enchant_admission.py
      - tests/test_v202_enchant_scheduler_floor.py
      - integration_probes/v202_existing_planner_no_native.py
      - runner/webui/index.html
      - runner/webui/app.js
      - runner/webui/styles.css
      - tests/test_v193_simc_local_updater.py
      - tests/test_v193_local_web_simc_update_api.py
      - START_SIMC_OPTIMIZER_WEB_WINDOWS.cmd
      - .github/workflows/v181_windows_beta_packaging.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful v213 source-to-catalog workflow run ID
        type: string
        required: true
        default: "41178704794"
      source_artifact:
        description: Exact v213 source-to-catalog artifact name
        type: string
        required: true
        default: "v213-source-to-catalog-41178704794"
permissions:
  contents: read
  actions: read
concurrency:
  group: v181-windows-beta-one-source-package
  cancel-in-progress: false
jobs:
  windows-beta:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            py: "3.12"
          - os: windows-2022
            py: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve exact source text on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - name: Reuse exact source-backed v213 catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact || 'v213-source-to-catalog-41178704794' }}
          run-id: ${{ inputs.source_run_id || '41178704794' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: p3c-source
      - name: Bind v213 catalog bytes into the Windows package workspace
        shell: pwsh
        run: |
          $source = Join-Path $PWD "p3c-source/v213_current_season_source_to_catalog.json"
          if (!(Test-Path $source -PathType Leaf)) { throw "V213_SOURCE_ARTIFACT_FILE_MISSING" }
          Copy-Item $source "data/current_season_source_to_catalog.json" -Force
          python -c "import json,sys;sys.path.insert(0,'runner');import v213_source_to_catalog as v;p=json.load(open('data/current_season_source_to_catalog.json',encoding='utf8'));assert v.verify_catalog(p);assert p['native_calls']==0 and p['network_calls']==0 and p['automatic_ui_promotion'] is False;print('V181_V213_SOURCE_ARTIFACT_VALIDATED',p['manifest_sha256'])"
          if ($LASTEXITCODE -ne 0) { throw "V213_SOURCE_CATALOG_VALIDATION_FAILED" }
      - name: Install only current Windows web-test dependencies, no SimC
        shell: pwsh
        run: |
          python -m pip install -r requirements-web-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Python web dependencies could not be installed" }
      - name: Reproducible source ZIP all SHA checks with zero Native
        shell: pwsh
        run: |
          python -m unittest -v tests.test_v181_windows_beta_package_offline
          if ($LASTEXITCODE -ne 0) { throw "Source archive unit tests failed" }
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          python integration_probes/v181_windows_beta_packager.py --out dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          if ($LASTEXITCODE -ne 0) { throw "Beta packaging failed" }
      - name: Actual extracted Windows CMD launcher preflight + local HTTP server + 3 plans
        shell: pwsh
        run: |
          python integration_probes/v181_windows_beta_live_http.py --zip dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          if ($LASTEXITCODE -ne 0) { throw "Real Windows process and HTTP integration failed" }
      - name: Existing Windows local web, session, SHA/cache, security offline regressions
        shell: pwsh
        run: |
          python -m unittest -q tests.test_v152_windows_local_web_launcher_offline tests.test_v113_local_web_api_offline tests.test_v114_local_web_ui_offline tests.test_v106_user_session_controller tests.test_v177_current_season_product_flow tests.test_v180_multilevel_current_season_product_offline tests.test_v193_simc_local_updater tests.test_v193_local_web_simc_update_api tests.test_v196_current_season_ui_catalog tests.test_v197_verified_effect_budget tests.test_v197_enchant_effect_families tests.test_v198_targeted_enchant_native_rating tests.test_v202_one_enchant_admission tests.test_v202_enchant_scheduler_floor
          if ($LASTEXITCODE -ne 0) { throw "Existing local web or session regression failed" }
          node --check runner/webui/app.js
          if ($LASTEXITCODE -ne 0) { throw "Browser JS syntax failed" }
      - name: Retain one small Windows beta ZIP; no SimC executable or session cache
        if: matrix.py == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: v181-windows-source-beta-${{ github.run_id }}
          path: dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          retention-days: 7
          if-no-files-found: error
