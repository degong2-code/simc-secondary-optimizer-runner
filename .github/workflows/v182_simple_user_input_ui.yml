name: v182 User-Friendly Equipment, Oil and Omnium UI (Offline)
# Recheck current isolated HEAD on standard public-hosted Ubuntu/Windows runners.
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v167_product_season_gear_adapter.py
      - runner/v108_native_consumable_inputs.py
      - runner/v188_user_choice_metadata.py
      - runner/v196_current_season_user_catalog.py
      - runner/v213_source_to_catalog.py
      - data/current_season_simc_enchant_candidates.json
      - data/current_season_source_to_catalog.json
      - integration_probes/v181_windows_beta_packager.py
      - tests/test_v181_windows_beta_package_offline.py
      - tests/test_v113_local_web_api_offline.py
      - tests/test_v196_current_season_ui_catalog.py
      - runner/v197_verified_effect_budget.py
      - runner/v197_enchant_effect_families.py
      - tests/test_v197_verified_effect_budget.py
      - tests/test_v197_enchant_effect_families.py
      - integration_probes/v198_targeted_enchant_native_rating.py
      - tests/test_v198_targeted_enchant_native_rating.py
      - runner/v065_v015_scheduler_adapter.py
      - runner/v093_inclusive_adaptive_scheduler_bridge.py
      - runner/v096_unified_product_entry.py
      - runner/v098_target_user_scenario_bootstrap.py
      - runner/v208_internal_exact_special_L_hydrator.py
      - runner/v212_environment_manifest.py
      - runner/v216_environment_build_coordinator.py
      - runner/v202_one_enchant_admission.py
      - data/v202_verified_enchant_8025_source.json
      - tests/test_v202_one_enchant_admission.py
      - tests/test_v202_enchant_scheduler_floor.py
      - integration_probes/v202_existing_planner_no_native.py
      - runner/v101_common_representative_equipment.py
      - tests/test_v188_user_choice_labels_and_slots.py
      - tests/test_v187_current_season_tier_overlay.py
      - integration_probes/v181_windows_beta_live_http.py
      - runner/webui/app.js
      - runner/webui/index.html
      - tests/test_v182_simple_user_inputs_offline.py
      - tests/test_v208_special_L_hydration_offline.py
      - tests/test_v212_environment_manifest.py
      - tests/test_v216_environment_build_coordinator.py
      - tests/test_v114_local_web_ui_offline.py
      - tests/test_v167_local_gear_catalog_api.py
      - .github/workflows/v182_simple_user_input_ui.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful v213 source-to-catalog workflow run ID
        type: string
        required: true
        default: "41194394128"
      source_artifact:
        description: Exact v213 source-to-catalog artifact name
        type: string
        required: true
        default: "v213-source-to-catalog-41194394128"
permissions:
  contents: read
  actions: read
concurrency:
  group: v182-user-input-batch
  cancel-in-progress: false
jobs:
  focused-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve input/source bytes on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reuse exact source-backed v213 catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact || 'v213-source-to-catalog-41194394128' }}
          run-id: ${{ inputs.source_run_id || '41194394128' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: p3c-source
      - name: Bind v213 catalog bytes into the Windows package workspace
        shell: pwsh
        run: |
          $source = Join-Path $PWD "p3c-source/v213_current_season_source_to_catalog.json"
          if (!(Test-Path $source -PathType Leaf)) { throw "V213_SOURCE_ARTIFACT_FILE_MISSING" }
          Copy-Item $source "data/current_season_source_to_catalog.json" -Force
          python -c "import json,sys;sys.path.insert(0,'runner');import v213_source_to_catalog as v;p=json.load(open('data/current_season_source_to_catalog.json',encoding='utf8'));assert v.verify_catalog(p);assert p['native_calls']==0 and p['network_calls']==0 and p['automatic_ui_promotion'] is False;print('V182_V213_SOURCE_ARTIFACT_VALIDATED',p['manifest_sha256'])"
          if ($LASTEXITCODE -ne 0) { throw "V213_SOURCE_CATALOG_VALIDATION_FAILED" }
      - run: python -m pip install -r requirements-web-test.txt
        shell: bash
      - name: New form contract, old user consumables and 26 spec/5 level regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_v182_simple_user_inputs_offline tests.test_v188_user_choice_labels_and_slots tests.test_v196_current_season_ui_catalog tests.test_v208_special_L_hydration_offline tests.test_v212_environment_manifest tests.test_v197_verified_effect_budget tests.test_v197_enchant_effect_families tests.test_v198_targeted_enchant_native_rating tests.test_v202_one_enchant_admission tests.test_v202_enchant_scheduler_floor tests.test_v187_current_season_tier_overlay
          python -m unittest -q tests.test_v108_user_consumables tests.test_v114_local_web_ui_offline tests.test_v113_local_web_api_offline tests.test_v177_current_season_product_flow tests.test_v179_current_season_input_paths_offline tests.test_v167_local_gear_catalog_api
          node --check runner/webui/app.js
      - name: Package updated Windows UX and verify reproducible runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_v181_windows_beta_package_offline
          mkdir -p dist
          python integration_probes/v181_windows_beta_packager.py --out dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
      - if: matrix.os == 'windows-2022'
        name: Actual Windows extracted CMD, HTTP three plans and restore
        shell: pwsh
        run: |
          python integration_probes/v181_windows_beta_live_http.py --zip dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows beta live HTTP regression failed" }
      - if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v6
        with:
          name: v182-windows-beta-user-friendly-form-${{ github.run_id }}
          path: dist/SIMC_SECONDARY_OPTIMIZER_WINDOWS_BETA.zip
          retention-days: 7
          if-no-files-found: error
