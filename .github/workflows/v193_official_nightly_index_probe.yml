name: v193 Once Official SimC Windows Nightly Index Discovery (No Download)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v193_official_nightly_index_probe.yml]
permissions:
  contents: read
jobs:
  official-index-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch official TLS-correct nightly HTML index and parse Windows x64 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"runner")
          import v193_simc_local_updater as u
          manager=u.SimCManager(pathlib.Path("unused-no-install"),platform="win32")
          result=manager.check()
          summary={"schema":"v194_official_simc_release_source_diagnostic_v1",
                   "status":"OFFICIAL_DIRECT_READY" if result["candidate"] else
                       "OFFICIAL_GITHUB_MANUAL_READY" if result.get("github_alternative") else
                       "MANUAL_ONLY_METADATA_UNAVAILABLE",
                   "index":u.BASE,
                   "official_index_problem":result.get("official_index_problem"),
                   "github_alternative":result.get("github_alternative"),
                   "direct_candidate":result["candidate"],
                   "download_performed":False,
                   "executable_installed":False,
                   "native_calls":0}
          pathlib.Path("out/v194_source_fallback_receipt.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          assert result["candidate"] or result.get("github_alternative"),"NO_OFFICIAL_DISCOVERY_SOURCE"
          assert not pathlib.Path("unused-no-install").exists()
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v193-official-nightly-index-only-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
