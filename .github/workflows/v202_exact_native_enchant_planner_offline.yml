name: v202 Actual Product Enchant Planning (Zero Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v202_exact_native_enchant_planner_offline.yml]
permissions:
  contents: read
jobs:
  frost-334:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: previous
        with:
          path: .simc-cache/v192/
          key: v192-ubuntu2404-710c2408bfd3ae4df71b8cd55cdf01f63fd6c926-cli-r1
      - name: Ensure exact prior binary and check no-Native opt-in planner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .simc-cache/v192/simc.sha256
          python -m unittest -q tests.test_v202_one_enchant_admission tests.test_v202_enchant_scheduler_floor
          python integration_probes/v202_existing_planner_no_native.py .simc-cache/v192/simc out/
