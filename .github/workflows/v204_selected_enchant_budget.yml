name: v204 selected enchant budget focused
on:
  push:
    branches:
      - probe/chat-cache-v035-20261024
    paths:
      - 'runner/v204_selected_enchant_reference_budget.py'
      - 'runner/v090_reference_total_native_candidate.py'
      - 'runner/v091_weapon_oil_external_adapter.py'
      - 'runner/v096_unified_product_entry.py'
      - 'runner/v098_target_user_scenario_bootstrap.py'
      - 'tests/test_v204_selected_enchant_reference_budget.py'
      - '.github/workflows/v204_selected_enchant_budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-budget-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing minimum offline test requirements
        run: python -m pip install -r requirements-web-test.txt
      - name: Compile the changed budget adapter and existing entry points
        run: python -m compileall -q runner/v204_selected_enchant_reference_budget.py runner/v090_reference_total_native_candidate.py runner/v091_weapon_oil_external_adapter.py runner/v096_unified_product_entry.py runner/v098_target_user_scenario_bootstrap.py
      - name: Run only directly affected reference, oil, entry, E and user compatibility checks
        run: python -m unittest -v tests.test_v204_selected_enchant_reference_budget tests.test_v089_ilvl_chmv_budget_selector tests.test_v091_weapon_oil_external_adapter tests.test_v096_unified_product_entry tests.test_v202_enchant_scheduler_floor tests.test_v203_enchant_cross_feature_policy
      - name: Check this job did not request SimC Native or mutate caches
        run: python -c "import os; assert not os.path.exists('out'); print('V204_OFFLINE_ONLY_NO_NATIVE_REQUESTED')"
