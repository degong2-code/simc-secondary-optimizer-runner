name: v206 Eagle one selectable nonCHMV end-to-end offline
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v206_eagle_one_user_option_offline.yml]
permissions:
  contents: read
concurrency:
  group: v206-one-eagle-focused-no-native
  cancel-in-progress: false
jobs:
  selected-E0-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install existing web-test deps only, no SimC
        run: python -m pip install -r requirements-web-test.txt
      - name: Compile changed code and assert browser JS syntax
        run: |
          python -m compileall -q runner/v206_nonchmv_eagle_selection.py runner/v196_current_season_user_catalog.py runner/v106_user_session_controller.py runner/v098_target_user_scenario_bootstrap.py runner/v096_unified_product_entry.py runner/v113_local_web_api.py tests/test_v206_nonchmv_eagle_user_path.py
          node --check runner/webui/app.js
      - name: One E0 selected profile and previous input, cache, budget, API regressions
        run: |
          python -m unittest -v tests.test_v206_nonchmv_eagle_user_path tests.test_v196_current_season_ui_catalog tests.test_v197_enchant_effect_families tests.test_v203_enchant_cross_feature_policy tests.test_v204_selected_enchant_reference_budget tests.test_v106_user_session_controller tests.test_v113_local_web_api_offline tests.test_v098_target_user_scenario_bootstrap tests.test_v096_unified_product_entry tests.test_v177_current_season_product_flow tests.test_v179_current_season_input_paths_offline tests.test_v182_simple_user_inputs_offline tests.test_v114_local_web_ui_offline
      - name: Confirm no Native output or accidental execution requested
        run: python -c "from pathlib import Path; assert not Path('out').exists(); print('V206_NO_NATIVE_TEST_MATRICES_PASS')"
