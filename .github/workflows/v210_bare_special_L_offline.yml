name: v210 bare selected L separates gem J and enchant E
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v210_bare_special_L_offline.yml, tests/test_v208_special_L_hydration_offline.py]
permissions:
  contents: read
concurrency:
  group: v210-bare-special-L-focused-no-native
  cancel-in-progress: false
jobs:
  bare-L-J-E:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Keep source LF on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Existing runtime dependencies only
        run: python -m pip install -r requirements-web-test.txt
      - name: Code compile, JS unchanged
        run: |
          python -m compileall -q runner/v062_static_budget_bridge.py runner/v208_internal_exact_special_L_hydrator.py tests/test_v208_special_L_hydration_offline.py
          node --check runner/webui/app.js
      - name: Gemmed neck bare L, all original static-budget paths, HTTP and selected user regressions
        run: |
          python -m unittest -v tests.test_v062_static_budget_bridge tests.test_v208_special_L_hydration_offline tests.test_v113_local_web_api_offline tests.test_v106_user_session_controller tests.test_v098_target_user_scenario_bootstrap tests.test_v177_current_season_product_flow tests.test_v206_nonchmv_eagle_user_path tests.test_v114_local_web_ui_offline
      - name: Zero actual Native in offline witness
        run: python -c "from pathlib import Path; assert not Path('out').exists(); print('V210_BARE_SPECIAL_L_J_E_OFFLINE_NO_NATIVE_PASS')"
