name: v211 classified enchant metadata in existing season catalog (offline)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v197_enchant_effect_families.py
      - runner/v196_current_season_user_catalog.py
      - data/current_season_enchant_effect_classification.json
      - tests/test_v197_enchant_effect_families.py
      - tests/test_v196_current_season_ui_catalog.py
      - .github/workflows/v211_enchant_catalog_integration_offline.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v211-enchant-catalog-integration-offline
  cancel-in-progress: false
jobs:
  catalog-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve authored LF on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing web test dependencies only
        run: python -m pip install -r requirements-web-test.txt
      - name: Existing catalog, exact E budget, Eagle and v202 proof regressions
        run: |
          python -m py_compile runner/v196_current_season_user_catalog.py runner/v197_enchant_effect_families.py
          python -m unittest -v tests.test_v197_enchant_effect_families tests.test_v197_verified_effect_budget tests.test_v196_current_season_ui_catalog tests.test_v206_nonchmv_eagle_user_path tests.test_v202_one_enchant_admission tests.test_v202_enchant_scheduler_floor tests.test_v113_local_web_api_offline tests.test_v114_local_web_ui_offline
      - name: Compact catalog integration receipt; no Native and no selection expansion
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"runner")
          import v196_current_season_user_catalog as catalog
          c=catalog.public_options(); e=c["enchant_candidates"]
          assert e["total"]==38 and e["source_classified_count"]==38
          assert e["source_classification_counts"]=={
            "static_chmv_rating":8,"static_nonchmv_only_or_mixed":19,
            "spell_effects":15,"native_E_measured":2}
          assert [x["enchant_id"] for x in e["items"] if x["ui_selectable"]]==[7967]
          assert c["native_calls_now"]==0 and c["optimizer_or_cache_mutated"] is False
          out=pathlib.Path("out");out.mkdir(exist_ok=True)
          (out/"V211_V196_CATALOG_INTEGRATION_RECEIPT.json").write_text(
            json.dumps({"status":"PASS_38_SOURCE_CLASSIFIED_EXISTING_CATALOG_ONLY",
              "counts":e["source_classification_counts"],
              "selectable_enchant_ids":[7967],"native_calls":0,
              "automatic_ui_promotion":False},indent=2)+"\n",encoding="utf8")
          print("V211_V196_EXISTING_CATALOG_INTEGRATION_PASS_NO_NATIVE_NO_NEW_CHOICES")
          PY
      - name: Retain small integration receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v211-catalog-integration-${{ matrix.os }}
          path: out/V211_V196_CATALOG_INTEGRATION_RECEIPT.json
          retention-days: 7
          if-no-files-found: warn
