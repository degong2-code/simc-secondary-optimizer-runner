name: v212 Environment Manifest offline contract
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v212_environment_manifest.py
      - tests/test_v212_environment_manifest.py
      - .github/workflows/v212_environment_manifest_offline.yml
permissions:
  contents: read
concurrency:
  group: v212-environment-manifest-offline
  cancel-in-progress: false
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile only new manifest module
        run: python -m py_compile runner/v212_environment_manifest.py tests/test_v212_environment_manifest.py
      - name: Deterministic provenance, exact build/revision, approval and path checks
        run: python -m unittest -v tests.test_v212_environment_manifest
      - name: Assert no Native output was created
        run: python -c "from pathlib import Path; assert not Path('out').exists(); print('V212_ENVIRONMENT_MANIFEST_NATIVE0_PASS')"
