name: v212 Environment Manifest offline contract
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - runner/v212_environment_manifest.py
      - runner/v216_environment_build_coordinator.py
      - runner/v222_season_budget_contract.py
      - runner/v223_installed_season_budget_source.py
      - runner/v224_season_gjfo_evidence_inventory.py
      - runner/v225_season_source_bundle_intake.py
      - runner/v226_representative_native_g_work_order.py
      - runner/v227_cached_native_g_observation.py
      - runner/v228_source_native_g_reconciliation.py
      - runner/v229_simc_only_source_seed.py
      - runner/v230_simc_item_metadata.py
      - tests/test_v230_simc_item_metadata.py
      - tests/test_v229_simc_only_source_seed.py
      - tests/test_v228_source_native_g_reconciliation.py
      - runner/v046_static_item_cache.py
      - tests/test_v227_cached_native_g_observation.py
      - runner/v169_source_first_representative_stage.py
      - tests/test_v226_representative_native_g_work_order.py
      - tests/test_v225_season_source_bundle_intake.py
      - tests/test_v224_season_gjfo_evidence_inventory.py
      - tests/test_v223_installed_season_budget_source.py
      - tests/test_v222_season_budget_contract.py
      - runner/v217_stage_execution_engine.py
      - runner/v218_v098_profile_stage_adapter.py
      - tests/test_v217_stage_execution_engine.py
      - runner/v208_internal_exact_special_L_hydrator.py
      - runner/v213_source_to_catalog.py
      - runner/v221_gem_item_db2_relation.py
      - tests/test_v221_gem_item_db2_relation.py
      - runner/v220_catalog_auto_admission.py
      - tests/test_v220_catalog_auto_admission.py
      - runner/v196_current_season_user_catalog.py
      - runner/v206_nonchmv_eagle_selection.py
      - runner/v143_specialization_contracts.py
      - tests/test_v212_environment_manifest.py
      - tests/test_v216_environment_build_coordinator.py
      - tests/test_v213_source_to_catalog.py
      - .github/workflows/v212_environment_manifest_offline.yml
permissions:
  contents: read
concurrency:
  group: v212-environment-manifest-offline
  cancel-in-progress: false
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile source catalog, approval adapter and manifest modules
        run: python -m py_compile runner/v221_gem_item_db2_relation.py tests/test_v221_gem_item_db2_relation.py runner/v220_catalog_auto_admission.py tests/test_v220_catalog_auto_admission.py runner/v143_specialization_contracts.py runner/v196_current_season_user_catalog.py runner/v206_nonchmv_eagle_selection.py runner/v208_internal_exact_special_L_hydrator.py runner/v213_source_to_catalog.py runner/v212_environment_manifest.py runner/v216_environment_build_coordinator.py runner/v222_season_budget_contract.py tests/test_v222_season_budget_contract.py runner/v223_installed_season_budget_source.py tests/test_v223_installed_season_budget_source.py runner/v224_season_gjfo_evidence_inventory.py tests/test_v224_season_gjfo_evidence_inventory.py runner/v225_season_source_bundle_intake.py tests/test_v225_season_source_bundle_intake.py runner/v226_representative_native_g_work_order.py tests/test_v226_representative_native_g_work_order.py runner/v227_cached_native_g_observation.py tests/test_v227_cached_native_g_observation.py runner/v228_source_native_g_reconciliation.py tests/test_v228_source_native_g_reconciliation.py runner/v229_simc_only_source_seed.py tests/test_v229_simc_only_source_seed.py runner/v230_simc_item_metadata.py tests/test_v230_simc_item_metadata.py runner/v169_source_first_representative_stage.py runner/v217_stage_execution_engine.py runner/v218_v098_profile_stage_adapter.py tests/test_v213_source_to_catalog.py tests/test_v217_stage_execution_engine.py tests/test_v212_environment_manifest.py
      - name: Deterministic v213 provenance, exact 7967 approval, v098 profile and relocation checks
        run: python -m unittest -v tests.test_v213_source_to_catalog tests.test_v212_environment_manifest tests.test_v216_environment_build_coordinator tests.test_v220_catalog_auto_admission tests.test_v221_gem_item_db2_relation tests.test_v222_season_budget_contract tests.test_v223_installed_season_budget_source tests.test_v224_season_gjfo_evidence_inventory tests.test_v225_season_source_bundle_intake tests.test_v226_representative_native_g_work_order tests.test_v227_cached_native_g_observation tests.test_v228_source_native_g_reconciliation tests.test_v229_simc_only_source_seed tests.test_v230_simc_item_metadata
      - name: Assert no Native output was created
        run: python -c "from pathlib import Path; assert not Path('out').exists(); print('V212_ENVIRONMENT_MANIFEST_NATIVE0_PASS')"
