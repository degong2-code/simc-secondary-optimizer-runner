name: v229 SimC-Only Source Seed (Explicit Request, No Native)

on:
  workflow_dispatch:
    inputs:
      simc_commit:
        description: Exact upstream SimulationCraft 40-hex commit (never a branch or latest)
        type: string
        required: true
      game_build:
        description: Exact retail build observed in that commit's generated tables
        type: string
        required: true
      previous_game_build:
        description: Previously known build (only used to prevent stale season relabel)
        type: string
        required: true
      update_event:
        description: Update type, season/expansion require changed game build
        type: choice
        required: true
        default: season_change
        options: [season_change, expansion_change, mid_patch]
      include_item_data:
        description: Also fetch large SimC item_data.inc (up to 32 MB), opt in
        type: boolean
        required: false
        default: false
      tier_set_option:
        description: Optional independently identified season tier set option (candidate only)
        type: string
        required: false
      tier_class:
        description: DPS class for optional SimC tier physical slot crosscheck
        type: string
        required: false
      tier_spec:
        description: DPS specialization for optional tier crosscheck
        type: string
        required: false
      target_ilevel:
        description: Optional one-spec representative source preview target ilvl (not a G reference)
        type: number
        required: false
        default: 334
      probe_race:
        description: Optional one-spec source-only SimC probe character race (no existing gear)
        type: string
        required: false
      probe_level:
        description: Optional character level for source-only physical profile
        type: number
        required: false
        default: 90

permissions:
  contents: read

concurrency:
  group: v229-simc-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simc-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            runner/v191_unified_season_data_update.py
            runner/v229_simc_only_source_seed.py
            runner/v230_simc_item_metadata.py
            runner/v231_simc_tier_item_join.py
            runner/v232_simc_only_ordinary_representative.py
            runner/v233_source_only_G_probe_profile.py
            runner/v169_source_first_representative_stage.py
            runner/v167_product_season_gear_adapter.py
            runner/v143_specialization_contracts.py
            tests/test_v229_simc_only_source_seed.py
            tests/test_v230_simc_item_metadata.py
            tests/test_v231_simc_tier_item_join.py
            tests/test_v232_simc_only_ordinary_representative.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Isolate only reusable engine code and offline tests, no old data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v229-only/runner" "$RUNNER_TEMP/v229-only/tests"
          cp runner/v191_unified_season_data_update.py runner/v229_simc_only_source_seed.py runner/v230_simc_item_metadata.py runner/v231_simc_tier_item_join.py runner/v232_simc_only_ordinary_representative.py runner/v233_source_only_G_probe_profile.py runner/v169_source_first_representative_stage.py runner/v167_product_season_gear_adapter.py runner/v143_specialization_contracts.py "$RUNNER_TEMP/v229-only/runner/"
          cp tests/test_v229_simc_only_source_seed.py tests/test_v230_simc_item_metadata.py tests/test_v231_simc_tier_item_join.py tests/test_v232_simc_only_ordinary_representative.py "$RUNNER_TEMP/v229-only/tests/"
          touch "$RUNNER_TEMP/v229-only/runner/__init__.py" "$RUNNER_TEMP/v229-only/tests/__init__.py"
          test ! -e "$RUNNER_TEMP/v229-only/data"
          test ! -e "$RUNNER_TEMP/v229-only/integration_probes"
          test ! -e "$RUNNER_TEMP/v229-only/.git"
          (cd "$RUNNER_TEMP/v229-only" && python -m unittest discover -s tests -p 'test_v2*.py' -v)
          echo 'V229_SEPARATE_ENGINE_WORKTREE_NO_LEGACY_SOURCE_FILES_NATIVE0'
      - name: Validate required exact revision, build and source request before network
        shell: bash
        env:
          REVISION: ${{ inputs.simc_commit }}
          GAME_BUILD: ${{ inputs.game_build }}
          PRIOR_BUILD: ${{ inputs.previous_game_build }}
          UPDATE_EVENT: ${{ inputs.update_event }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          r=os.environ['REVISION']; b=os.environ['GAME_BUILD']; prev=os.environ['PRIOR_BUILD']
          assert re.fullmatch(r'[a-f0-9]{40}',r),'SIMC_EXACT_SOURCE_COMMIT_REQUIRED'
          assert re.fullmatch(r'\d+(?:\.\d+){3}',b),'SIMC_GAME_BUILD_REQUIRED'
          assert re.fullmatch(r'\d+(?:\.\d+){3}',prev),'SIMC_PRIOR_BUILD_REQUIRED'
          assert os.environ['UPDATE_EVENT']=='mid_patch' or b!=prev, 'OLD_BUILD_AS_NEW_SEASON_BLOCKED'
          print('V229_SOURCE_REQUEST_EXPLICIT_AND_PINNED')
          PY
      - name: Download exact immutable generated SimC source only (no Blizzard/Wago request)
        shell: bash
        env:
          REVISION: ${{ inputs.simc_commit }}
          GAME_BUILD: ${{ inputs.game_build }}
          PRIOR_BUILD: ${{ inputs.previous_game_build }}
          UPDATE_EVENT: ${{ inputs.update_event }}
          LARGE_ITEM_DATA: ${{ inputs.include_item_data }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$LARGE_ITEM_DATA" == 'true' ]]; then args+=(--include-item-data); fi
          (
            cd "$RUNNER_TEMP/v229-only"
            python runner/v229_simc_only_source_seed.py \
              --revision "$REVISION" \
              --game-build "$GAME_BUILD" \
              --previous-game-build "$PRIOR_BUILD" \
              --event "$UPDATE_EVENT" \
              --out-dir "$RUNNER_TEMP/v229-only/seed" \
              "${args[@]}"
          )
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ["RUNNER_TEMP"])/'v229-only/seed/simc_seed_receipt.json'
          doc=json.loads(r.read_text(encoding='utf8'))
          assert doc['provenance_tree_blob_authenticated'] is True
          assert doc['G'] is None and doc['J'] is None and doc['F'] is None and doc['O'] is None
          assert doc['B'] is None and doc['T'] is None
          assert doc['native_calls']==0 and not doc['environment_ready']
          assert not doc['user_options_auto_admitted']
          print('V229_SOURCE_IDENTITY_ONLY_NOT_GJFO_RATING_READY')
          PY
      - name: Optional one-spec exact tier item join (still NOT an active-season proof)
        if: inputs.tier_set_option != '' || inputs.tier_class != '' || inputs.tier_spec != ''
        env:
          SET_OPTION: ${{ inputs.tier_set_option }}
          REQUESTED_CLASS: ${{ inputs.tier_class }}
          REQUESTED_SPEC: ${{ inputs.tier_spec }}
          LARGE_ITEM_DATA: ${{ inputs.include_item_data }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LARGE_ITEM_DATA" != 'true' ]]; then
            echo 'V231_OPT_IN_ITEM_DATA_REQUIRED' >&2
            exit 3
          fi
          (
            cd "$RUNNER_TEMP/v229-only"
            python runner/v231_simc_tier_item_join.py \
              --seed-dir "$RUNNER_TEMP/v229-only/seed" \
              --set-option "$SET_OPTION" \
              --class "$REQUESTED_CLASS" \
              --spec "$REQUESTED_SPEC" \
              --out "$RUNNER_TEMP/v229-only/seed/v231_tier_candidate.json"
          )
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v229-only/seed/v231_tier_candidate.json'
          r=json.loads(p.read_text(encoding='utf8'))
          assert set(r['tier_piece_ids'])=={'head','shoulders','chest','hands','legs'}
          assert r['tier_bonus_sizes']==[2,4] and not r['environment_ready']
          assert r['G'] is None and r['B'] is None and r['T'] is None
          print('V231_ONE_SPEC_TIER_SOURCE_CANDIDATE_ONLY_NO_NATIVE')
          PY
      - name: Preview one requested DPS physical representative from SimC only (unapproved candidate)
        if: inputs.tier_set_option != '' && inputs.tier_class != '' && inputs.tier_spec != '' && inputs.include_item_data
        continue-on-error: true
        env:
          REQUESTED_LEVEL: ${{ inputs.target_ilevel }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/v229-only"
            python runner/v232_simc_only_ordinary_representative.py \
              --seed-dir "$RUNNER_TEMP/v229-only/seed" \
              --tier-candidate "$RUNNER_TEMP/v229-only/seed/v231_tier_candidate.json" \
              --target-ilevel "$REQUESTED_LEVEL" \
              --out "$RUNNER_TEMP/v229-only/seed/v232_provisional_representative.json"
          )
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v229-only/seed/v232_provisional_representative.json'
          v=json.loads(p.read_text(encoding='utf8'))
          assert len(v['selected_G_slot_ids']) in (13,14)
          assert not v['tier_set_current_season_authenticated']
          assert not v['environment_ready'] and v['native_calls']==0
          assert v['G'] is None and v['J'] is None and v['F'] is None and v['O'] is None
          assert v['B'] is None and v['T'] is None
          print('V232_PROVISIONAL_SOURCE_REPRESENTATIVE_NOT_ADMITTED_TO_G')
          PY
      - name: Optionally compile exact SimC physical source-only probe input (zero Native)
        if: inputs.probe_race != '' && inputs.tier_set_option != '' && inputs.tier_class != '' && inputs.tier_spec != '' && inputs.include_item_data
        continue-on-error: true
        env:
          REQUESTED_RACE: ${{ inputs.probe_race }}
          REQUESTED_LEVEL: ${{ inputs.probe_level }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/v229-only"
            test -f seed/v231_tier_candidate.json
            test -f seed/v232_provisional_representative.json
            python runner/v233_source_only_G_probe_profile.py \
              --seed-dir "$RUNNER_TEMP/v229-only/seed" \
              --tier-candidate "$RUNNER_TEMP/v229-only/seed/v231_tier_candidate.json" \
              --representative-candidate "$RUNNER_TEMP/v229-only/seed/v232_provisional_representative.json" \
              --race "$REQUESTED_RACE" --level "$REQUESTED_LEVEL" \
              --output-dir "$RUNNER_TEMP/v229-only/seed"
          )
          python - <<'PY'
          import os, pathlib, json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"v229-only/seed/v233_receipt.json"
          d=json.loads(p.read_text(encoding="utf8"))
          assert d["G"] is None and d["B"] is None and d["T"] is None
          assert not d["environment_ready"] and d["native_calls"]==0
          print("V233_SIMC_PROBE_READY_NOT_EXECUTED")
          PY
      - name: Save short-lived exact SimC source seed for future verified adapters
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v229-simc-source-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/v229-only/seed/
          if-no-files-found: error
          retention-days: 2
