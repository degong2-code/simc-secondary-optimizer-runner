name: v243 ONE-SHOT Retail public tier source pilot (2 URLs, no Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v243_one_shot_tier_public_source.yml
permissions:
  contents: read
jobs:
  observe-two-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check original public Retail class titles against pinned same-season ItemSet
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"runner")
          import v243_fresh_tier_anchor_intake as tier
          build="12.1.5.70575"
          try:
              html=tier.fetch_bytes(tier.SOURCE_URL,tier.MAX_PUBLISHER_BYTES)
              itemset_url=tier.SET_CSV_URL+"?build="+build+"&locale=enUS"
              csv=tier.fetch_bytes(itemset_url,tier.MAX_ITEMSET_BYTES)
              print("P3_TIER_PUBLIC_ORIGINAL_BYTES",len(html),len(csv),
                    "hashes",tier.digest(html),tier.digest(csv))
              result=tier.parse_anchor(publisher_raw=html,itemset_raw=csv,
                  build=build,expansion_id=11,mplus_zone="Mythic+ Season 2")
              print("P3_TIER_PUBLISHER_ITEMSET_MATCH_PASS",
                    "classes",len(result["classes"]),
                    "unique_sets",len(set(result["verified_item_set_ids"].values())),
                    "season",result["publisher_season"])
          except Exception as error:
              print("P3_TIER_PUBLISHER_OR_ITEMSET_PENDING",
                    type(error).__name__,str(error).split(":",1)[0])
              raise SystemExit(2)
          PY
