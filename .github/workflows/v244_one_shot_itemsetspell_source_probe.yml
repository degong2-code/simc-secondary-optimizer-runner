name: v244 ONE-SHOT Wago ItemSetSpell 2pc 4pc current pinned build (No Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v244_one_shot_itemsetspell_source_probe.yml
permissions:
  contents: read
jobs:
  inspect-two-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pinned Wago ItemSet and ItemSetSpell exact 2pc/4pc relations
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import csv,io,hashlib,json
          source="https://wago.tools/db2/"
          build="12.1.5.70575"
          def table(name,limit):
              u=source+name+"/csv?build="+build+"&locale=enUS"
              with urlopen(Request(u,headers={"User-Agent":"SIMC-Secondary-TierSource-Probe/1.0"}),timeout=60) as r:
                  if r.status!=200:raise RuntimeError("HTTP_NOT_200:"+name)
                  data=r.read(limit+1)
                  if not 0<len(data)<=limit:raise RuntimeError("SOURCE_LIMIT:"+name)
              print("SOURCE",name,"bytes",len(data),"sha256",hashlib.sha256(data).hexdigest())
              rd=csv.DictReader(io.StringIO(data.decode("utf-8-sig")))
              print("FIELDS",name,rd.fieldnames)
              return list(rd)
          sets=table("ItemSet",5_000_000)
          spells=table("ItemSetSpell",20_000_000)
          anchors=json.load(open("data/current_season_tier_source_anchors.json",encoding="utf8"))
          ids={}
          for cl,needle in anchors["classes"].items():
              matching=[s for s in sets if s["Name_lang"].strip().casefold()==needle.casefold()]
              if len(matching)!=1:
                  print("SET_NOT_UNIQUE",cl,needle,len(matching))
              else:
                  ids[cl]=int(matching[0]["ID"])
          print("EXACT_SET_NAMES",len(ids))
          keys=set(spells[0]) if spells else set()
          if not {"ItemSetID","Threshold","ChrSpecID","SpellID"}<=keys:
              raise RuntimeError("ITEMSET_SPELL_COLUMNS_MISSING")
          summaries={}
          for cl,iid in sorted(ids.items()):
              rs=[r for r in spells if int(r.get("ItemSetID","0") or 0)==iid]
              bythreshold={}
              for row in rs:
                  th=int(row.get("Threshold",0) or 0)
                  bythreshold[th]=bythreshold.get(th,0)+1
              specs={int(row.get("ChrSpecID",0) or 0) for row in rs}
              summaries[cl]={"set_id":iid,"rows":len(rs),"thresholds":bythreshold,
                  "spec_count":len(specs),"spec_ids":sorted(specs)[:6]}
          for cl,r in summaries.items():
              print("CLASS",cl,json.dumps(r,sort_keys=True))
          two=sum(2 in x["thresholds"] for x in summaries.values())
          four=sum(4 in x["thresholds"] for x in summaries.values())
          both=sum(2 in x["thresholds"] and 4 in x["thresholds"] for x in summaries.values())
          print("2PC_4PC_OBSERVED","both",both,"2pc",two,"4pc",four,
                "class_set_count",len(ids))
          print("SOURCE_DISCOVERY_ONLY_NOT_SEASON_CERTIFICATION")
          PY
