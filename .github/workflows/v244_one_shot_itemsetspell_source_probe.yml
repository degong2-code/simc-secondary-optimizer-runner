name: v244 ONE-SHOT DB2 tier item versus Journal loot source join (No Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v244_one_shot_itemsetspell_source_probe.yml
permissions:
  contents: read
jobs:
  inspect-raid-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Detect whether same-season tier physical items appear directly in JournalEncounterItem
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,hashlib
          from collections import Counter
          from urllib.request import Request,urlopen
          build="12.1.5.70575"
          def get(name,limit):
              url="https://wago.tools/db2/"+name+"/csv?build="+build+"&locale=enUS"
              with urlopen(Request(url,headers={"User-Agent":"SIMC-TierJoinSource-Pilot/1.0"}),timeout=60) as response:
                  if response.status!=200:raise RuntimeError(name+"_HTTP")
                  raw=response.read(limit+1)
              if not 0<len(raw)<=limit:raise RuntimeError(name+"_LIMIT")
              print("SOURCE",name,len(raw),hashlib.sha256(raw).hexdigest())
              rd=csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
              print("FIELDS",name,rd.fieldnames)
              return list(rd)
          sets=get("ItemSet",5_000_000)
          journals=get("JournalEncounterItem",40_000_000)
          all_raid=Counter(int(r.get("ItemID","0") or 0) for r in journals)
          for name,ids in (("OBSERVED_MIDNIGHT_S1",range(1978,1991)),
                           ("OBSERVED_MIDNIGHT_S2",range(2055,2068))):
              chosen=[s for s in sets if int(s["ID"]) in ids]
              physical={int(s.get("ItemID_"+str(i),0) or 0) for s in chosen for i in range(17)}
              physical.discard(0)
              matching=[r for r in journals if int(r.get("ItemID",0) or 0) in physical]
              seasons=Counter(r.get("DisplaySeasonID","<no column>") for r in matching)
              states=Counter(r.get("WorldStateExpressionID","<no column>") for r in matching)
              print("GROUP",name,"sets",len(chosen),"physical_ids",len(physical),
                    "journal_link_rows",len(matching),
                    "display_seasons",dict(seasons),"world_states",dict(states))
              print("GROUP_FIRST_5_SET_NAMES",[s.get("Name_lang") for s in chosen[:5]])
          print("DIAGNOSTIC_ONLY_NO_ASSUMED_CURRENT_SEASON_BY_ITEMSET_ID")
          PY
