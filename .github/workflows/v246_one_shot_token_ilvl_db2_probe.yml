name: v246 ONE-SHOT DB2 token effect and tier base ilvl (No Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v246_one_shot_token_ilvl_db2_probe.yml
permissions:
  contents: read
jobs:
  token-and-ilvl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Same-build actual source relations without item names
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, os, pathlib, tempfile
          from collections import defaultdict,Counter
          from urllib.request import Request,urlopen
          build="12.1.5.70575"
          tokens=(270910,270911,270912,270913,270914,270915)
          tables=("ItemSet","ItemSparse","ItemXItemEffect","ItemEffect","SpellEffect")
          maxima={"ItemSet":3_000_000,"ItemSparse":250_000_000,
                  "ItemXItemEffect":20_000_000,"ItemEffect":30_000_000,
                  "SpellEffect":250_000_000}
          folder=pathlib.Path(tempfile.mkdtemp(prefix="v246-probe-"))
          def fetch(table):
              url=f"https://wago.tools/db2/{table}/csv?build={build}&locale=enUS"
              req=Request(url,headers={"User-Agent":"SIMC-DB2-OneShot-TierToken/1.0",
                                       "Accept":"text/csv"})
              sha=hashlib.sha256();count=0
              path=folder/(table+".csv")
              with urlopen(req,timeout=180) as r, path.open("wb") as out:
                  assert r.status==200,(table,r.status)
                  while True:
                      piece=r.read(1024*1024)
                      if not piece:break
                      count+=len(piece)
                      assert count<=maxima[table],("OVERSIZED_SOURCE",table,count)
                      sha.update(piece);out.write(piece)
              assert count>10,(table,count)
              with path.open(encoding="utf-8-sig",newline="") as f:
                  header=next(csv.reader(f))
              print("V246_SOURCE",table,"bytes",count,"sha256",sha.hexdigest(),flush=True)
              print("V246_HEADER",table,header[:38],flush=True)
              return path
          def scan(table):
              with paths[table].open(encoding="utf-8-sig",newline="") as f:
                  for row in csv.DictReader(f): yield row
          def number(x):
              try:return int(x)
              except (TypeError,ValueError):return 0
          paths={}
          for table in tables[:4]:paths[table]=fetch(table)
          xlinks=defaultdict(list);fx={}
          for row in scan("ItemXItemEffect"):
              iid=number(row.get("ItemID"))
              if iid in tokens:xlinks[iid].append(row)
          for row in scan("ItemEffect"):
              iid=number(row.get("ParentItemID"))
              if iid in tokens or number(row.get("ID")) in {
                   number(x.get("ItemEffectID")) for vals in xlinks.values() for x in vals}:
                  fx[number(row.get("ID"))]=row
          spells=set()
          for token in tokens:
              matching=[v for v in fx.values() if number(v.get("ParentItemID"))==token]
              linked=[fx[number(x["ItemEffectID"])] for x in xlinks[token]
                      if number(x.get("ItemEffectID")) in fx]
              used={number(x.get("SpellID")) for x in matching+linked}
              spells.update(used)
              print("V246_TOKEN",token,"direct_effects",
                    [(x.get("ID"),x.get("SpellID"),x.get("TriggerType")) for x in matching],
                    "itemx",[(x.get("ItemEffectID")) for x in xlinks[token]],
                    "linked_spells",sorted(used),flush=True)
          sets={}
          for row in scan("ItemSet"):
              sid=number(row.get("ID"))
              if 1978<=sid<=1990 or 2055<=sid<=2067:
                  ids=[number(row.get(f"ItemID_{i}")) for i in range(17)]
                  sets[sid]=[x for x in ids if x>0]
          wanted={x for ids in sets.values() for x in ids}|set(tokens)
          records={}
          for row in scan("ItemSparse"):
              iid=number(row.get("ID"))
              if iid in wanted:
                  records[iid]={"level":number(row.get("ItemLevel")),
                                "set":number(row.get("ItemSet")),
                                "expansion":number(row.get("ExpansionID")),
                                "inventory":number(row.get("InventoryType"))}
          for start in (1978,2055):
              print("V246_TIER_ROSTER",start,"set_count",
                    sum(x in sets for x in range(start,start+13)),
                    "piece_counts",Counter(len(sets.get(x,[])) for x in range(start,start+13)),
                    "base_levels",dict(Counter(records[i]["level"] for s in range(start,start+13)
                            for i in sets.get(s,[]) if i in records)),
                    "missing",sum(i not in records for s in range(start,start+13)
                            for i in sets.get(s,[])),flush=True)
          for token in tokens:
              print("V246_TOKEN_ITEMSPARSE",token,records.get(token),flush=True)
          if spells:
              paths["SpellEffect"]=fetch("SpellEffect")
              related=set(spells); found=[]
              for row in scan("SpellEffect"):
                  spell=number(row.get("SpellID"))
                  if spell in related:
                      found.append({k:row.get(k) for k in
                         ("SpellID","EffectIndex","Effect","EffectItemType",
                          "EffectTriggerSpell","EffectMiscValue","DifficultyID")})
              print("V246_SPELL_EFFECT_DIRECT",found[:120],"total",len(found),flush=True)
              print("V246_EFFECT_ITEM_TYPE_DIRECT_MATCHES",
                    [r for r in found if number(r.get("EffectItemType")) in wanted],
                    flush=True)
          else:
              print("V246_NO_TOKEN_SPELL_NO_SPELLEFFECT_DOWNLOAD",flush=True)
          print("V246_PROBE_COMPLETE_NOT_CURRENT_SEASON_CERTIFICATION",flush=True)
          PY
