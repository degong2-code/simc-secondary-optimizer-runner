name: v247 ONE-SHOT JournalEncounterItem tier token location proof (No Native)
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths:
      - .github/workflows/v247_one_shot_token_journal_source_probe.yml
permissions:
  contents: read
jobs:
  token-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Identify exact tier-token journal loot records in single pinned game build
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,io
          from urllib.request import Request,urlopen
          build="12.1.5.70575"
          targets=set(range(270910,270916))
          tables=("JournalEncounterItem","JournalEncounter","JournalInstance")
          data={}
          def number(x):
              try:return int(x)
              except (TypeError,ValueError):return 0
          for table in tables:
              url=f"https://wago.tools/db2/{table}/csv?build={build}&locale=enUS"
              req=Request(url,headers={"User-Agent":"SIMC-TierToken-Journal-Source/1.0",
                                       "Accept":"text/csv"})
              with urlopen(req,timeout=90) as res:
                  assert res.status==200
                  raw=res.read(8_000_001)
              assert 0<len(raw)<=8_000_000
              print("V247_SOURCE",table,"bytes",len(raw),
                    "sha256",hashlib.sha256(raw).hexdigest(),flush=True)
              rows=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
              print("V247_SCHEMA",table,list(rows[0])[:25],flush=True)
              data[table]=rows
          enc={number(x["ID"]):x for x in data["JournalEncounter"]}
          ins={number(x["ID"]):x for x in data["JournalInstance"]}
          found=[x for x in data["JournalEncounterItem"]
                 if number(x["ItemID"]) in targets]
          for r in sorted(found,key=lambda x:(number(x["ItemID"]),number(x["JournalEncounterID"]))):
              e=enc.get(number(r["JournalEncounterID"]),{})
              i=ins.get(number(e.get("JournalInstanceID")),{})
              print("V247_TOKEN_JOURNAL",r["ItemID"],
                    "encounter_id",r["JournalEncounterID"],
                    "boss",e.get("Name_lang"),
                    "instance",i.get("Name_lang"),
                    "difficulty",r.get("DifficultyMask"),
                    "display_season",r.get("DisplaySeasonID"),
                    "wse",r.get("WorldStateExpressionID"),flush=True)
          print("V247_TOKEN_MATCHED",len(found),"distinct",
                sorted({number(r["ItemID"]) for r in found}),flush=True)
          print("V247_SOURCE_PROBE_ONLY_NO_SEASON_AUTOPROMOTION",flush=True)
          PY
