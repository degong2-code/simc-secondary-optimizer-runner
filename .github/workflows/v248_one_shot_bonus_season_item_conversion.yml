name: v248 ONE-SHOT DB2 ItemBonusSeason tier membership relationships
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v248_one_shot_bonus_season_item_conversion.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Bounded same-build relational tier source probe, no Native
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,hashlib
          from collections import defaultdict,Counter
          from urllib.request import Request,urlopen
          build="12.1.5.70575"
          tables=("ItemSet","ItemConversionEntry","ItemBonusSequenceSpell",
                  "ItemXBonusTree","ItemBonusTreeNode","ItemBonusSeason",
                  "ItemBonusSeasonBonusListGroup","DisplaySeason")
          maxima={x:24_000_000 for x in tables}
          def num(x):
              try:return int(x)
              except (TypeError,ValueError):return 0
          data={}
          for table in tables:
              url=f"https://wago.tools/db2/{table}/csv?build={build}&locale=enUS"
              with urlopen(Request(url,headers={"User-Agent":"SIMC-DB2-TierSeasonProbe/1.0"}),timeout=60) as response:
                  assert response.status==200
                  raw=response.read(maxima[table]+1)
              assert 0<len(raw)<=maxima[table],(table,len(raw))
              data[table]=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
              print("V248_TABLE",table,len(raw),hashlib.sha256(raw).hexdigest(),
                    "rows",len(data[table]),"cols",list(data[table][0])[:22] if data[table] else [],flush=True)
          classsets={}
          for r in data["ItemSet"]:
              sid=num(r.get("ID"))
              if 1978<=sid<=1990 or 2055<=sid<=2067:
                  classsets[sid]={num(r.get(f"ItemID_{i}")) for i in range(17)}-{0}
          physical={i for ids in classsets.values() for i in ids}
          conversions=[(num(x.get("ItemID")),num(x.get("ItemConversionID"))) for x in data["ItemConversionEntry"] if num(x.get("ItemID")) in physical or 270910<=num(x.get("ItemID"))<=270915]
          print("V248_CONVERSION_DIRECT",len(conversions),conversions[:50],flush=True)
          seq=[(num(x.get("ItemID")),num(x.get("SpellID"))) for x in data["ItemBonusSequenceSpell"] if num(x.get("ItemID")) in physical or 270910<=num(x.get("ItemID"))<=270915]
          print("V248_BONUS_SEQUENCE_DIRECT",len(seq),seq[:50],flush=True)
          xref=defaultdict(set)
          for r in data["ItemXBonusTree"]:
              iid=num(r.get("ItemID"))
              if iid in physical:
                  xref[iid].add(num(r.get("ItemBonusTreeID")))
          tree_nodes=defaultdict(list)
          for r in data["ItemBonusTreeNode"]:
              parent=num(r.get("ParentItemBonusTreeID"))
              tree_nodes[parent].append(r)
          season_to_group=defaultdict(set)
          for r in data["ItemBonusSeasonBonusListGroup"]:
              season_to_group[num(r.get("ItemBonusListGroupID"))].add(num(r.get("ItemBonusSeasonID")))
          known_seasons={num(r.get("ID")):num(r.get("SeasonID")) for r in data["ItemBonusSeason"]}
          print("V248_SEASON_IDS",known_seasons,flush=True)
          print("V248_BONUS_SEASON_GROUP_COUNT",len(season_to_group),flush=True)
          def children(item):
              queue=list(xref.get(item,()))
              seen=set();groups=set();depth=0
              while queue and depth<10000:
                  depth+=1;t=queue.pop()
                  if t in seen:continue
                  seen.add(t)
                  for node in tree_nodes.get(t,[]):
                      group=num(node.get("ChildItemBonusListGroupID"))
                      if group>0:groups.add(group)
                      child=num(node.get("ChildItemBonusTreeID"))
                      if child>0 and child not in seen:queue.append(child)
              return groups,seen
          for cohort in (1978,2055):
              grouped=Counter();items=[];grpmap=Counter();treematched=0
              for sid in range(cohort,cohort+13):
                  for iid in classsets.get(sid,[]):
                      groups,trees=children(iid)
                      possible={season for group in groups for season in season_to_group.get(group,set())}
                      linked={known_seasons.get(season) for season in possible}
                      linked.discard(None)
                      if trees:treematched+=1
                      grouped.update({tuple(sorted(linked)):1})
                      grpmap.update(groups)
                      items.append((iid,sid,sorted(linked),len(groups),len(trees)))
              print("V248_COHORT",cohort,"items",len(items),"xref_count",treematched,
                    "season_paths",grouped,"groups",grpmap.most_common(12),
                    "example",items[:6],flush=True)
          print("V248_PROBE_SUCCESS_SOURCE_RELATIONS_NOT_SEASON_CERTIFICATION",flush=True)
          PY
