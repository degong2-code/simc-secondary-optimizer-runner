name: v249 ONE-SHOT active raid loot to tier bonus group join
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v249_one_shot_raid_bonus_tree_relation.yml]
permissions:
  contents: read
jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Source-only bonus-group comparison, no name input or Native
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,hashlib
          from collections import Counter,defaultdict
          from urllib.request import Request,urlopen
          build="12.1.5.70575"
          tables=("ItemSet","ItemXBonusTree","ItemBonusTreeNode",
                  "JournalEncounterItem","JournalEncounter","JournalInstance")
          def N(x):
              try:return int(x)
              except (TypeError,ValueError):return 0
          data={}
          for table in tables:
              url=f"https://wago.tools/db2/{table}/csv?build={build}&locale=enUS"
              with urlopen(Request(url,headers={"User-Agent":"SIMC-Tier-Raid-BonusGroup-Probe/1.0"}),timeout=90) as r:
                  assert r.status==200
                  raw=r.read(8_000_001)
              assert 0<len(raw)<=8_000_000
              data[table]=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
              print("V249_SOURCE",table,len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
          sets={}
          for r in data["ItemSet"]:
              sid=N(r.get("ID"))
              if 1978<=sid<=1990 or 2055<=sid<=2067:
                  sets[sid]={N(r.get(f"ItemID_{i}")) for i in range(17)}-{0}
          groups=defaultdict(list);subtrees=defaultdict(list)
          for r in data["ItemBonusTreeNode"]:
              parent=N(r.get("ParentItemBonusTreeID"))
              group=N(r.get("ChildItemBonusListGroupID"))
              child=N(r.get("ChildItemBonusTreeID"))
              if group>0:groups[parent].append(group)
              if child>0:subtrees[parent].append(child)
          xref=defaultdict(set)
          for r in data["ItemXBonusTree"]:
              xref[N(r.get("ItemID"))].add(N(r.get("ItemBonusTreeID")))
          def collect(i):
              queue=list(xref[i]);seen=set();found=set()
              while queue:
                  k=queue.pop()
                  if k in seen:continue
                  seen.add(k)
                  found.update(groups[k])
                  queue.extend(subtrees[k])
              return found
          for start in (1978,2055):
              ids={i for set_id in range(start,start+13) for i in sets.get(set_id,())}
              profiles=Counter(tuple(sorted(collect(i))) for i in ids)
              print("V249_TIER_COHORT",start,"count",len(ids),"group_fingerprints",
                    dict(profiles),flush=True)
          encounters={N(r["ID"]):r for r in data["JournalEncounter"]}
          instance=next((N(encounters[i]["JournalInstanceID"]) for i in (2874,2887) if i in encounters),None)
          assert instance is not None
          raids={iid for iid,r in encounters.items() if N(r["JournalInstanceID"])==instance}
          raid_loot={N(r.get("ItemID")) for r in data["JournalEncounterItem"]
                     if N(r.get("JournalEncounterID")) in raids}
          other_loot={N(r.get("ItemID")) for r in data["JournalEncounterItem"]
                     if N(r.get("JournalEncounterID")) not in raids}
          for tag,ids in (("CURRENT_RAID_JOURNAL",raid_loot),
                          ("OTHER_JOURNAL",other_loot)):
              stats=Counter();matched=[];none=0
              for i in ids:
                  g=collect(i)
                  if not g:
                      none+=1;continue
                  stats.update(g)
                  if g & set(range(614,619)):
                      matched.append((i,sorted(g)))
              print("V249_LOOT",tag,"items",len(ids),"no_groups",none,
                    "top_groups",stats.most_common(24),
                    "items_intersect_614_618",len(matched),
                    "examples",matched[:25],flush=True)
          print("V249_NO_SEASON_PROMOTION_NO_NATIVE",flush=True)
          PY
