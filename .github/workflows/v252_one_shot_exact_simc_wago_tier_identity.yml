name: v252 ONE-SHOT exact Wago-ItemSet to first-party SimC set bonus source
on:
  push:
    branches: [probe/chat-cache-v035-20261024]
    paths: [.github/workflows/v252_one_shot_exact_simc_wago_tier_identity.yml]
permissions:
  contents: read
jobs:
  source-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Same-build actual 13x5 source-only identity check, no Native
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,io
          from collections import defaultdict,Counter
          from urllib.request import Request,urlopen
          from runner import v229_simc_only_source_seed as simc
          build="12.1.5.70575"
          commit="710c2408bfd3ae4df71b8cd55cdf01f63fd6c926"
          urls={
            "ItemSet":f"https://wago.tools/db2/ItemSet/csv?build={build}&locale=enUS",
            "SimC":f"https://raw.githubusercontent.com/simulationcraft/simc/{commit}/engine/dbc/generated/item_set_bonus.inc"}
          source={}
          for name,url in urls.items():
              with urlopen(Request(url,headers={"User-Agent":"SIMC-Secondary-Tier-Source-Join/1.0"}),timeout=90) as response:
                  assert response.status==200,(name,response.status)
                  raw=response.read(900_001)
              assert 0<len(raw)<=900_000
              source[name]=raw
              print("V252_SOURCE",name,"bytes",len(raw),
                    "sha256",hashlib.sha256(raw).hexdigest(),flush=True)
          groups=simc.parse_set_bonus(source["SimC"],build)["candidate_groups"]
          rows=list(csv.DictReader(io.StringIO(source["ItemSet"].decode("utf-8-sig"))))
          wago={}
          for r in rows:
              ids={int(r[f"ItemID_{i}"]) for i in range(17)}
              ids.discard(0)
              if len(ids)==5:wago[int(r["ID"])]=ids
          candidates=defaultdict(list)
          for g in groups:
              sid=g["set_id"]
              ids=set(g["item_ids"])
              if sid in wago and len(ids)==5 and ids==wago[sid] and g["observed_bonus_sizes"]==[2,4]:
                  candidates[g["set_opt"]].append((sid,g["class_id"],g["item_ids"]))
          for opt,items in sorted(candidates.items()):
              if len(items)==13 and len({x[1] for x in items})==13:
                  print("V252_MATCHED_13_CLASS",repr(opt),"set_count",len(items),
                        "physical_item_count",len({iid for _,_,ids in items for iid in ids}),
                        "id_ranges",min(x[0] for x in items),max(x[0] for x in items),
                        "native",0,flush=True)
          for start in (1978,2055):
              exact=[(g["class_id"],g["set_id"],g["set_opt"]) for g in groups
                     if start<=g["set_id"]<=start+12
                     and g["set_id"] in wago
                     and set(g["item_ids"])==wago[g["set_id"]]
                     and g["observed_bonus_sizes"]==[2,4]]
              print("V252_COHORT_CROSS_JOIN",start,"sets",len(exact),"unique_classes",
                    len({x[0] for x in exact}),"unique_options",sorted({x[2] for x in exact}),
                    flush=True)
              assert len(exact)==13 and len({x[0] for x in exact})==13,(start,exact)
          print("V252_EXACT_FIRST_PARTY_SET_JOIN_PASS_SEASON_NOT_AUTO_ADMITTED",flush=True)
          PY
